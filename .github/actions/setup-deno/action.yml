name: Setup Deno
description: Setup Deno with caching for CI

inputs:
  warm-cache:
    description: Pre-warm the esm.sh cache for tests
    required: false
    default: "false"
  warm-redis-cache:
    description: Pre-warm the deno.land Redis cache for unit and integration tests
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Configure Deno dependency cache
      shell: bash
      run: |
        set -euo pipefail
        deno_cache_dir="${RUNNER_TEMP}/veryfront-deno-cache"
        mkdir -p "${deno_cache_dir}"
        echo "DENO_DIR=${deno_cache_dir}" >> "${GITHUB_ENV}"
        echo "DENO_NO_UPDATE_CHECK=1" >> "${GITHUB_ENV}"

    - name: Restore Deno dependency cache
      id: deno-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
      with:
        path: ${{ runner.temp }}/veryfront-deno-cache
        key: veryfront-deno-v2-${{ runner.os }}-${{ runner.arch }}-2.7.7-${{ hashFiles('deno.lock', 'scripts/deno.lock', 'deno.json', '**/deno.json') }}
        restore-keys: |
          veryfront-deno-v2-${{ runner.os }}-${{ runner.arch }}-2.7.7-

    - name: Install pinned Deno
      shell: bash
      run: |
        set -euo pipefail

        version="2.7.7"
        os="$(uname -s)"
        arch="$(uname -m)"
        deno_exe="deno"

        # Always hash via stdin: GNU sha256sum/shasum escape filenames that contain
        # a backslash by prefixing the output line with a literal "\", which would
        # corrupt the digest on Windows runners, where RUNNER_TEMP is always a
        # backslash-separated path and so always triggers the escaping.
        compute_sha256() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum < "$1" | awk '{print $1}'
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 < "$1" | awk '{print $1}'
          elif command -v openssl >/dev/null 2>&1; then
            openssl dgst -sha256 < "$1" | awk '{print $NF}'
          elif command -v node >/dev/null 2>&1; then
            node -e "const fs = require('fs'); const crypto = require('crypto'); process.stdout.write(crypto.createHash('sha256').update(fs.readFileSync(0)).digest('hex'))" < "$1"
          else
            echo "No checksum utility available (sha256sum/shasum/openssl/node)" >&2
            return 1
          fi
        }

        case "${os}" in
          Linux) os_target="unknown-linux-gnu" ;;
          Darwin) os_target="apple-darwin" ;;
          MINGW*|MSYS*|CYGWIN*)
            os_target="pc-windows-msvc"
            deno_exe="deno.exe"
            ;;
          *) echo "Unsupported Deno install OS: ${os}" >&2; exit 1 ;;
        esac

        case "${arch}" in
          x86_64|amd64) arch_target="x86_64" ;;
          arm64|aarch64) arch_target="aarch64" ;;
          *) echo "Unsupported Deno install architecture: ${arch}" >&2; exit 1 ;;
        esac

        archive="deno-${arch_target}-${os_target}.zip"
        deno_dir="${RUNNER_TEMP}/deno-${version}-${arch_target}-${os_target}"
        deno_bin="${deno_dir}/${deno_exe}"
        if [ ! -x "${deno_bin}" ]; then
          mkdir -p "${deno_dir}"
          zip_path="${deno_dir}/deno.zip"
          checksums_manifest_path="${deno_dir}/checksums.txt"
          checksums_manifest_sha256="0019dfc4b32d63c1392aa264aed2253c1e0c2fb09216f8e2cc269bbfb8bb49b5"
          archive_checksum_path="${deno_dir}/archive-checksum.txt"

          checksums_manifest_http_code="$(curl --fail --location --show-error --retry 5 --retry-delay 2 \
            --retry-max-time 120 \
            --remove-on-error \
            --connect-timeout 20 --max-time 120 \
            "https://github.com/denoland/deno/releases/download/v${version}/checksums.txt" \
            --write-out "%{http_code}" \
            --output "${checksums_manifest_path}")" || true
          if [ "${checksums_manifest_http_code}" != "200" ]; then
            # No Deno release publishes checksums.txt, so this is the path every
            # run takes. A 404, a 5xx and a died connection are indistinguishable
            # here -- all of them mean "no manifest to verify against" -- so an
            # upstream blip must not fail the job. This costs no integrity: the
            # archive is still verified against ${archive}.sha256sum below, which
            # is the same check the 404 path has always relied on.
            echo "Checksums manifest unavailable for v${version} (HTTP ${checksums_manifest_http_code}); falling back to archive checksum file" >&2
            checksum_parse_path="${archive_checksum_path}"
          else
            checksums_manifest_actual_sha256="$(compute_sha256 "${checksums_manifest_path}")"
            if [ "${checksums_manifest_actual_sha256}" != "${checksums_manifest_sha256}" ]; then
              echo "Checksums manifest checksum mismatch for v${version}" >&2
              echo "Expected: ${checksums_manifest_sha256}" >&2
              echo "Actual:   ${checksums_manifest_actual_sha256}" >&2
              exit 1
            fi

            checksum_parse_path="${checksums_manifest_path}"
          fi

          if ! curl --fail --location --show-error --retry 5 --retry-delay 2 \
            --retry-max-time 120 \
            --remove-on-error \
            --connect-timeout 20 --max-time 120 \
            "https://github.com/denoland/deno/releases/download/v${version}/${archive}.sha256sum" \
            --output "${archive_checksum_path}"; then
            echo "Failed to download Deno archive checksum for ${archive}" >&2
            exit 1
          fi

          if ! curl --fail --location --show-error --retry 5 --retry-delay 2 \
            --retry-max-time 120 \
            --remove-on-error \
            --connect-timeout 20 --max-time 120 \
            "https://github.com/denoland/deno/releases/download/v${version}/${archive}" \
            --output "${zip_path}"; then
            echo "Failed to download Deno archive for ${archive}" >&2
            exit 1
          fi

          archive_sha256="$(awk 'BEGIN {IGNORECASE = 1} /^Hash[[:space:]]*:/ { print tolower($3) }' "${checksum_parse_path}")"
          if [ -z "${archive_sha256}" ]; then
            archive_sha256="$(awk -v target="${archive}" '$2 == target || $2 == "*" target { print tolower($1) }' "${checksum_parse_path}")"
          fi
          if [ -z "${archive_sha256}" ]; then
            echo "Missing Deno archive checksum for ${archive} in release checksums for v${version}" >&2
            exit 1
          fi

          actual_sha256="$(compute_sha256 "${zip_path}")"
          if [ "${actual_sha256}" != "${archive_sha256}" ]; then
            echo "Deno archive checksum mismatch for ${archive}" >&2
            echo "Expected: ${archive_sha256}" >&2
            echo "Actual:   ${actual_sha256}" >&2
            exit 1
          fi

          unzip -oq "${zip_path}" -d "${deno_dir}"
          chmod +x "${deno_bin}"
        fi

        echo "${deno_dir}" >> "${GITHUB_PATH}"
        "${deno_bin}" --version

    - name: Generate template manifest
      shell: bash
      run: deno run -A scripts/build/generate-templates-manifest.ts && deno fmt templates/manifest.json

    - name: Warm Redis module cache
      if: inputs.warm-redis-cache == 'true' && steps.deno-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        timeout --signal=TERM --kill-after=15s 2m \
          deno cache --frozen https://deno.land/x/redis@v0.32.1/mod.ts

    - name: Warm esm.sh cache
      if: inputs.warm-cache == 'true' && steps.deno-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        timeout --signal=TERM --kill-after=15s 3m \
          deno cache --frozen src/index.ts

    - name: Save complete Deno dependency cache
      if: inputs.warm-cache == 'true' && inputs.warm-redis-cache == 'true' && steps.deno-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/veryfront-deno-cache
        key: ${{ steps.deno-cache.outputs.cache-primary-key }}
