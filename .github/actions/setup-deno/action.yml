name: Setup Deno
description: Setup Deno with caching for CI

inputs:
  warm-cache:
    description: Pre-warm the esm.sh cache for tests
    required: false
    default: "false"
  warm-redis-cache:
    description: Pre-warm the deno.land Redis cache for unit and integration tests
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # The public-pool reusable workflow stays pinned to main for runner routing.
    # Its checked-out composite supplies npm to coverage tests on this revision.
    - name: Install Node for coverage project creation
      if: ${{ github.job == 'coverage-shards' }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
        package-manager-cache: false

    - name: Configure Deno dependency cache
      shell: bash
      run: |
        set -euo pipefail
        deno_cache_dir="${RUNNER_TEMP}/veryfront-deno-cache"
        mkdir -p "${deno_cache_dir}"
        echo "DENO_DIR=${deno_cache_dir}" >> "${GITHUB_ENV}"
        echo "DENO_NO_UPDATE_CHECK=1" >> "${GITHUB_ENV}"

    - name: Restore Deno dependency cache
      id: deno-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
      with:
        path: ${{ runner.temp }}/veryfront-deno-cache
        key: veryfront-deno-v2-${{ runner.os }}-${{ runner.arch }}-2.9.7-${{ hashFiles('deno.lock', 'scripts/deno.lock', 'deno.json', '**/deno.json') }}
        restore-keys: |
          veryfront-deno-v2-${{ runner.os }}-${{ runner.arch }}-2.9.7-

    - name: Install pinned Deno
      shell: bash
      run: |
        set -euo pipefail

        version="2.9.7"
        os="$(uname -s)"
        arch="$(uname -m)"
        deno_exe="deno"

        # Always hash via stdin: GNU sha256sum/shasum escape filenames that contain
        # a backslash by prefixing the output line with a literal "\", which would
        # corrupt the digest on Windows runners, where RUNNER_TEMP is always a
        # backslash-separated path and so always triggers the escaping.
        compute_sha256() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum < "$1" | awk '{print $1}'
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 < "$1" | awk '{print $1}'
          elif command -v openssl >/dev/null 2>&1; then
            openssl dgst -sha256 < "$1" | awk '{print $NF}'
          elif command -v node >/dev/null 2>&1; then
            node -e "const fs = require('fs'); const crypto = require('crypto'); process.stdout.write(crypto.createHash('sha256').update(fs.readFileSync(0)).digest('hex'))" < "$1"
          else
            echo "No checksum utility available (sha256sum/shasum/openssl/node)" >&2
            return 1
          fi
        }

        case "${os}" in
          Linux) os_target="unknown-linux-gnu" ;;
          Darwin) os_target="apple-darwin" ;;
          MINGW*|MSYS*|CYGWIN*)
            os_target="pc-windows-msvc"
            deno_exe="deno.exe"
            ;;
          *) echo "Unsupported Deno install OS: ${os}" >&2; exit 1 ;;
        esac

        case "${arch}" in
          x86_64|amd64) arch_target="x86_64" ;;
          arm64|aarch64) arch_target="aarch64" ;;
          *) echo "Unsupported Deno install architecture: ${arch}" >&2; exit 1 ;;
        esac

        archive="deno-${arch_target}-${os_target}.zip"

        # The expected digest of every supported archive is pinned HERE, in the
        # repository, so the release origin is never trusted to vouch for its
        # own bytes. Deno publishes no combined checksums.txt manifest (the
        # URL 404s on every real release), and the per-archive .sha256sum
        # assets ship from the same origin as the archives themselves, so
        # downloading either added no integrity: whoever could tamper with the
        # archive could tamper with its checksum file too. This is the
        # fail-closed anchor -- an archive whose digest is not pinned below, or
        # does not match its pin, must never be executed. Bumping ${version}
        # means re-pinning every digest from the new release's assets.
        case "${archive}" in
          deno-x86_64-unknown-linux-gnu.zip)
            archive_sha256="c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490" ;;
          deno-aarch64-unknown-linux-gnu.zip)
            archive_sha256="c832298b1ad4422481334855f6003e0f54145762c5a134f20a489511d2f65bbf" ;;
          deno-x86_64-apple-darwin.zip)
            archive_sha256="95daaff11c116a52ad54785e7914c8e9c9cdcaba793c5ed929c74ca2d8e6259a" ;;
          deno-aarch64-apple-darwin.zip)
            archive_sha256="5cd46d6268f6f78f5d88bdc7159d20bd44cdaa4b3303474839f87ec6fe7ae25c" ;;
          deno-x86_64-pc-windows-msvc.zip)
            archive_sha256="a0c3101b4158d1dfb7d6a78a7bf0f3de80c96bb423c152beec8beb22786f2238" ;;
          deno-aarch64-pc-windows-msvc.zip)
            archive_sha256="c4c4ac8bfdaa37814bda5c05fc9cdf2154904e2ef8277673a30bdceaaa649807" ;;
          *)
            echo "No pinned checksum for ${archive} (Deno v${version})" >&2
            exit 1
            ;;
        esac

        deno_dir="${RUNNER_TEMP}/deno-${version}-${arch_target}-${os_target}"
        deno_bin="${deno_dir}/${deno_exe}"
        if [ ! -x "${deno_bin}" ]; then
          mkdir -p "${deno_dir}"
          zip_path="${deno_dir}/deno.zip"

          # This download is REQUIRED -- there is no fallback, so its retry
          # budget is the only thing between an upstream blip and a red job,
          # and setup-deno runs in every job (~30 per merge_group).
          #
          # --retry-all-errors is the load-bearing flag. Plain --retry only
          # treats 5xx and timeouts as transient, so a dead connection (exit
          # 56) or a rate-limited 4xx (exit 22) ends the transfer outright: in
          # merge-queue run 31625521721 a required download took one 503,
          # waited its 2s, hit a dead connection and gave up 2.0 seconds in,
          # with four of its five retries unspent.
          #
          # The window, not the count, is the real number: 150s covers an
          # outage measured in minutes, and 20 x 8s of backoff is what it takes
          # to fill it. 8s rather than 2s because ~30 concurrent jobs retrying
          # a degraded endpoint every 2s is a retry storm of its own.
          #
          # --proto/--proto-redir pin the transfer to HTTPS: the release URL
          # redirects, and --location must never be allowed to follow that
          # redirect onto an insecure protocol.
          #
          # Worst case is bounded on purpose: a new attempt can start at the
          # end of the window and run a full --max-time, so an upstream that is
          # simply gone fails at 150+120s -- 4.5 minutes, inside the tightest
          # setup-deno job (10 min) so the error says what went wrong instead
          # of timing out the job.
          if ! curl --fail --location --proto "=https" --proto-redir "=https" \
            --show-error --retry 20 --retry-delay 8 \
            --retry-all-errors \
            --retry-max-time 150 \
            --remove-on-error \
            --connect-timeout 20 --max-time 120 \
            "https://github.com/denoland/deno/releases/download/v${version}/${archive}" \
            --output "${zip_path}"; then
            echo "Failed to download Deno archive for ${archive}" >&2
            exit 1
          fi

          actual_sha256="$(compute_sha256 "${zip_path}")"
          if [ "${actual_sha256}" != "${archive_sha256}" ]; then
            echo "Deno archive checksum mismatch for ${archive}" >&2
            echo "Expected: ${archive_sha256}" >&2
            echo "Actual:   ${actual_sha256}" >&2
            exit 1
          fi

          unzip -oq "${zip_path}" -d "${deno_dir}"
          chmod +x "${deno_bin}"
        fi

        echo "${deno_dir}" >> "${GITHUB_PATH}"
        "${deno_bin}" --version

    - name: Warm Redis module cache
      if: inputs.warm-redis-cache == 'true' && steps.deno-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        timeout --signal=TERM --kill-after=15s 2m \
          deno cache --frozen https://deno.land/x/redis@v0.32.1/mod.ts

    - name: Warm esm.sh cache
      if: inputs.warm-cache == 'true' && steps.deno-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        timeout --signal=TERM --kill-after=15s 3m \
          deno cache --frozen src/index.ts

    - name: Save complete Deno dependency cache
      if: inputs.warm-cache == 'true' && inputs.warm-redis-cache == 'true' && steps.deno-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/veryfront-deno-cache
        key: ${{ steps.deno-cache.outputs.cache-primary-key }}
