{
  "name": "Issue 2785 diagnostic Demo",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "version-check": {
      "runs-on": "ubuntu-latest",
      "outputs": {
        "is_stable": "false"
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "prerelease": {
      "runs-on": "ubuntu-latest",
      "outputs": {
        "version": "${{ steps.version.outputs.version }}"
      },
      "steps": [
        {
          "id": "version",
          "run": "echo version=0.0.0-rc.278500000000000 >> \"$GITHUB_OUTPUT\""
        },
        {
          "name": "Deliberate failed publish fixture",
          "run": "echo \"Exact merged diagnostic source: 299be74ff5fc7188f6cac0609168adef1264918e\"; exit 1"
        }
      ]
    },
    "github-prerelease": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "publish-public-release": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "registry-validation-rc": {
      "name": "registry validation (RC)",
      "if": "${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.version-check.result == 'success' && needs.version-check.outputs.is_stable == 'false' }}",
      "needs": [
        "prerelease",
        "version-check"
      ],
      "runs-on": "ubuntu-latest",
      "permissions": {
        "contents": "read"
      },
      "timeout-minutes": 65,
      "steps": [
        {
          "name": "Report selected release result",
          "env": {
            "IS_STABLE": "${{ needs.version-check.outputs.is_stable }}",
            "PRERELEASE_RESULT": "${{ needs.prerelease.result }}",
            "STABLE_RELEASE_RESULT": "skipped"
          },
          "run": "if [ \"$IS_STABLE\" = \"true\" ]; then\n  selected_result_name=\"STABLE_RELEASE_RESULT\"\nelse\n  selected_result_name=\"PRERELEASE_RESULT\"\nfi\nselected_result=\"${!selected_result_name}\"\nif [ \"$selected_result\" != \"success\" ]; then\n  echo \"::warning::REGISTRY RELEASE NON-SUCCESS [configuration]: $selected_result_name finished with $selected_result. Registry validation will continue, but downstream release dispatch remains blocked.\" >&2\nfi\n"
        },
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Diagnose failed RC publish",
          "if": "${{ needs.prerelease.result != 'success' }}",
          "env": {
            "RC_VERSION": "${{ needs.prerelease.outputs.version }}",
            "GITHUB_SHA": "${{ github.sha }}"
          },
          "run": "set -euo pipefail\ncontainer_name=\"veryfront-registry-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"\ntrap 'docker rm -f \"$container_name\" >/dev/null 2>&1 || true' EXIT INT TERM\ndocker run --rm --init \\\n  --name \"$container_name\" \\\n  --user 1000:1000 --read-only --cap-drop ALL \\\n  --security-opt no-new-privileges=true --network=bridge \\\n  --mount \"type=bind,source=${GITHUB_WORKSPACE},target=/source,readonly\" \\\n  --workdir /source --env RC_VERSION --env GITHUB_SHA \\\n  node:24-bookworm-slim@sha256:5cbc7caba8c2c0f0bca675d1b61b9f2857e1cf1853c6164ee9dd409501a936e7 \\\n  node --experimental-transform-types --input-type=module -e '\nimport { readFileSync } from \"node:fs\";\nimport { diagnoseRegistryPackages, REQUEST_TIMEOUT_MS } from \"./scripts/ci/registry-release-integrity.ts\";\nconst version = process.env.RC_VERSION;\nif (!version) throw new Error(\"Exact RC version is required for diagnostics.\");\nconst names = [\"veryfront\"];\nfor (const member of JSON.parse(readFileSync(\"deno.json\", \"utf8\")).workspace) {\n  if (!member.startsWith(\"./extensions/\")) continue;\n  const manifest = JSON.parse(readFileSync(`${member}/deno.json`, \"utf8\"));\n  if (manifest.veryfront?.npm?.publish === false) continue;\n  names.push(manifest.name, ...(manifest.veryfront?.npm?.runtimePackages ?? []).map(pkg => pkg.name));\n}\nawait diagnoseRegistryPackages(names.map(packageName => ({\n  packageName, version, expectedGitHead: process.env.GITHUB_SHA,\n  maxAttempts: 2, retryDelayMs: 120000, requestTimeoutMs: REQUEST_TIMEOUT_MS,\n})));\n'\n"
        },
        {
          "name": "Build registry validation image",
          "if": "${{ needs.prerelease.result == 'success' }}",
          "timeout-minutes": 5,
          "env": {
            "REGISTRY_IMAGE": "veryfront-registry-validation:${{ github.run_id }}-${{ github.run_attempt }}"
          },
          "run": "set -euo pipefail\nbuild_context=\"$(mktemp -d)\"\ncleanup() {\n  rm -rf \"$build_context\"\n}\ntrap cleanup EXIT INT TERM\ncat > \"$build_context/Dockerfile\" <<'DOCKERFILE'\nFROM node:24-bookworm-slim@sha256:5cbc7caba8c2c0f0bca675d1b61b9f2857e1cf1853c6164ee9dd409501a936e7\nRUN apt-get update \\\n  && apt-get install -y --no-install-recommends ca-certificates curl jq unzip \\\n  && rm -rf /var/lib/apt/lists/*\nRUN curl --fail --location --silent --show-error \\\n      https://github.com/denoland/deno/releases/download/v2.7.7/deno-x86_64-unknown-linux-gnu.zip \\\n      --output /tmp/deno.zip \\\n  && echo '0cd918870657ccc3d96ac682290e894dda374e2a742424aae9118b258a6cf7a3  /tmp/deno.zip' \\\n      | sha256sum --check --strict \\\n  && unzip -q /tmp/deno.zip -d /usr/local/bin \\\n  && chmod 0755 /usr/local/bin/deno \\\n  && /usr/local/bin/deno --version \\\n  && rm /tmp/deno.zip\nRUN mkdir /registry && chown 1000:1000 /registry\nWORKDIR /registry\nDOCKERFILE\ndocker build --platform linux/amd64 --tag \"$REGISTRY_IMAGE\" \"$build_context\"\n"
        },
        {
          "name": "Validate exact registry release",
          "if": "${{ needs.prerelease.result == 'success' }}",
          "env": {
            "REGISTRY_IMAGE": "veryfront-registry-validation:${{ github.run_id }}-${{ github.run_attempt }}",
            "RC_VERSION": "${{ needs.prerelease.outputs.version }}",
            "STABLE_VERSION": "",
            "GITHUB_SHA": "${{ github.sha }}",
            "IS_STABLE": "${{ needs.version-check.outputs.is_stable }}"
          },
          "run": "set -euo pipefail\ncontainer_name=\"veryfront-registry-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"\ncleanup() {\n  docker rm -f \"$container_name\" >/dev/null 2>&1 || true\n}\ntrap cleanup EXIT INT TERM\ndocker run --rm --init \\\n  --platform linux/amd64 \\\n  --name \"$container_name\" \\\n  --user 1000:1000 \\\n  --read-only \\\n  --cap-drop ALL \\\n  --security-opt no-new-privileges=true \\\n  --network=bridge \\\n  --volume /registry \\\n  --tmpfs /tmp:rw,nosuid,nodev,size=64m \\\n  --mount \"type=bind,source=${GITHUB_WORKSPACE},target=/source,readonly\" \\\n  --env RC_VERSION \\\n  --env STABLE_VERSION \\\n  --env GITHUB_SHA \\\n  --env IS_STABLE \\\n  --env HOME=/registry/home \\\n  --env DENO_DIR=/registry/deno-cache \\\n  --env TMPDIR=/registry/tmp \\\n  --env npm_config_cache=/registry/npm-cache \\\n  --env CI=true \\\n  \"$REGISTRY_IMAGE\" \\\n  bash -euo pipefail -c 'mkdir -p /registry/home /registry/deno-cache /registry/tmp /registry/npm-cache /registry/workspace\ntar -C /source --exclude=.git --exclude=node_modules --no-same-owner -cf - . | tar -C /registry/workspace --no-same-owner -xf -\ncd /registry/workspace\nbash scripts/ci/registry-release-smoke.sh'\n"
        }
      ]
    },
    "quality-gate-registry": {
      "name": "quality gate (registry)",
      "if": "${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.version-check.result == 'success' && (needs.version-check.outputs.is_stable == 'false' || needs.version-check.outputs.stable_release_requested == 'true') }}",
      "runs-on": "ubuntu-latest",
      "needs": [
        "version-check",
        "prerelease",
        "github-prerelease",
        "publish-public-release",
        "registry-validation-rc"
      ],
      "steps": [
        {
          "name": "Report selected release result",
          "env": {
            "IS_STABLE": "${{ needs.version-check.outputs.is_stable }}",
            "PRERELEASE_RESULT": "${{ needs.prerelease.result }}",
            "STABLE_RELEASE_RESULT": "${{ needs.release.result }}",
            "PUBLIC_RELEASE_RESULT": "${{ needs.publish-public-release.result }}"
          },
          "run": "if [ \"$IS_STABLE\" = \"true\" ]; then\n  selected_result_name=\"STABLE_RELEASE_RESULT\"\nelse\n  selected_result_name=\"PRERELEASE_RESULT\"\nfi\nselected_result=\"${!selected_result_name}\"\nif [ \"$selected_result\" != \"success\" ]; then\n  echo \"::warning::REGISTRY RELEASE NON-SUCCESS [configuration]: $selected_result_name finished with $selected_result. Registry validation will continue, but downstream release dispatch remains blocked.\" >&2\nfi\n"
        },
        {
          "name": "Require RC release dependencies",
          "if": "${{ needs.version-check.outputs.is_stable == 'false' }}",
          "env": {
            "PRERELEASE_RESULT": "${{ needs.prerelease.result }}",
            "ASSETS_RESULT": "${{ needs.github-prerelease.result }}",
            "PUBLIC_RELEASE_RESULT": "${{ needs.publish-public-release.result }}",
            "REGISTRY_RESULT": "${{ needs.registry-validation-rc.result }}"
          },
          "run": "failed=0\nfor result_name in PRERELEASE_RESULT ASSETS_RESULT PUBLIC_RELEASE_RESULT REGISTRY_RESULT; do\n  result=\"${!result_name}\"\n  if [ \"$result\" != \"success\" ]; then\n    echo \"::error::$result_name finished with $result\"\n    failed=1\n  fi\ndone\nexit \"$failed\"\n"
        }
      ]
    }
  }
}
