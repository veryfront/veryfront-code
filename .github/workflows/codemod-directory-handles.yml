name: Codemod directory handles

on:
  pull_request:
    paths:
      - "scripts/codemods/**"
      - ".github/workflows/codemod-directory-handles.yml"
      - ".tool-versions"
      - "deno.json"
      - "tests/integration/codemods/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded first-attempt PR runs. Non-PR runs and manual reruns get
  # run-unique groups so a pending or newer run is never cancelled or replaced.
  # Pinned by tests/integration/ci/workflow-concurrency.test.ts; see cicd.yml and
  # veryfront-studio#5544.
  group: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('{0}-{1}', github.workflow, github.ref) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  directory-handles:
    name: Directory handles (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
      - run: deno task lint:esm-sh-codemod
