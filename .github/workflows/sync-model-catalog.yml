# Regenerates the model catalog data file from the published catalog and opens
# or updates one pull request with the result, so the snapshot that ships in the
# package is no longer maintained by hand.
#
# Required repository Actions secret:
#
#   VERYFRONT_CATALOG_READ_TOKEN
#     A platform API token whose only permission is to read the model catalog
#     (GET /ai/models). It must grant nothing else: no write scope, no gateway
#     access, no project access. It is passed to exactly one step, through
#     `env`, never as a command argument, and is never printed.
#
# What a run does with the generated data, once it differs from main:
#
#   no sync branch on the remote  -> commit, push, open a pull request
#   branch matches, pull request open -> nothing; the head, its CI and the
#                                    review held against it all survive
#   branch matches, no pull request open -> open one for the commit already
#                                    there, rather than pushing another
#   branch differs                -> commit, push, update the open pull
#                                    request or open one
#
# A run that finds the catalog back at what main carries says so and leaves any
# open sync pull request to be closed, and its branch deleted, by hand.
#
# This workflow runs on a schedule and on manual dispatch only. Nothing on a
# pull_request path reads the secret, so forks and outside contributors never
# need it, and no job here gates a contributor's pull request. When a run fails,
# it fails loudly: the scheduled run turns red, and that is the alert.

name: Sync Model Catalog

on:
  schedule:
    # Every day at 05:00 UTC.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One sync at a time: two runs would race on the same fixed branch.
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  SYNC_BRANCH: automation/model-catalog
  DATA_FILE: src/provider/veryfront-cloud/model-catalog.data.ts

jobs:
  sync:
    # This workflow has no pull_request trigger, so the guard is always true
    # here. It is written out because the repository's setup-deno contract
    # requires every job that runs repository code to carry it.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every checkout in this repository refuses the persisted token: the
          # sync push must authenticate with the App token, not with the
          # workflow's own read-only credential.
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5

      # The only step that reads the secret.
      - name: Regenerate the model catalog data
        env:
          VERYFRONT_CATALOG_READ_TOKEN: ${{ secrets.VERYFRONT_CATALOG_READ_TOKEN }}
        run: deno task generate:model-catalog

      - name: Collect the changed model ids
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet -- "${DATA_FILE}"; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "The served catalog matches the committed data."
            echo "Any open sync pull request is now stale: close it by hand and"
            echo "delete its branch, so a later change opens a fresh one."
            exit 0
          fi
          echo "changed=true" >> "${GITHUB_OUTPUT}"
          # Only model ids leave this step: never a price, never a host.
          ids="$(git diff -U0 -- "${DATA_FILE}" \
            | grep -E '^[-+][[:space:]]*modelId: "' \
            | sed -E 's/.*modelId: "([^"]+)".*/\1/' \
            | sort -u || true)"
          {
            echo "ids<<MODEL_IDS_EOF"
            echo "${ids}"
            echo "MODEL_IDS_EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Create catalog sync GitHub App token
        # A GitHub App token, not GITHUB_TOKEN: a push made with GITHUB_TOKEN
        # starts no workflow, and this pull request has to run CI.
        if: steps.changes.outputs.changed == 'true'
        id: sync-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.VERYFRONT_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.VERYFRONT_RELEASE_APP_PRIVATE_KEY }}
          owner: veryfront
          # This repository. The release job in cicd.yml scopes the same App to
          # `veryfront`, because it publishes releases there; the sync pull
          # request is opened here instead.
          repositories: |
            veryfront-code
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the catalog sync pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.sync-app-token.outputs.token }}
          CHANGED_IDS: ${{ steps.changes.outputs.ids }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Does the sync branch on the remote already carry exactly this data?
          # Only the two workflow-controlled names are used here; nothing from
          # the fetched catalog reaches the shell.
          branch_matches=false
          if git fetch --no-tags --depth=1 "${remote}" "refs/heads/${SYNC_BRANCH}"; then
            if git diff --quiet FETCH_HEAD -- "${DATA_FILE}"; then
              branch_matches=true
            fi
          fi
          open_pr="$(gh pr list --head "${SYNC_BRANCH}" --state open --json number --jq '.[].number')"

          # An open pull request that already carries this data must be left
          # alone. Rewriting its head would rerun CI, invalidate the review
          # held against that head, and mutate the pull request while it may be
          # queued. A branch that matches with NOTHING tracking it is a
          # different case: the pull request was closed without deleting the
          # branch, and main is still stale, so one has to be opened.
          if [ "${branch_matches}" = true ] && [ -n "${open_pr}" ]; then
            echo "The open sync pull request already carries this data. Leaving it untouched."
            exit 0
          fi

          if [ "${branch_matches}" = true ]; then
            echo "The sync branch carries this data but no pull request tracks it. Opening one."
          else
            git config user.name "veryfront-release[bot]"
            git config user.email "veryfront-release[bot]@users.noreply.github.com"
            git checkout -B "${SYNC_BRANCH}"
            git add -- "${DATA_FILE}"
            git commit -m "chore(provider): sync the Veryfront Cloud model catalog data"
            # The checkout persists no credentials, so this push authenticates
            # itself with the App token, exactly as the release job does. The
            # branch is written by this workflow and by nothing else, and the
            # concurrency group admits one run at a time, so the previous sync
            # commit is always the one being replaced.
            git push --force "${remote}" "HEAD:refs/heads/${SYNC_BRANCH}"
          fi

          # The body carries model ids and nothing else.
          body_file="${RUNNER_TEMP}/model-catalog-pr-body.md"
          {
            echo "Regenerated by the model catalog sync. Review the diff, not this summary."
            echo
            echo "Model ids added, removed or changed:"
            echo
            if [ -z "${CHANGED_IDS}" ]; then
              echo "- none: an entry changed without its model id changing"
            else
              echo "${CHANGED_IDS}" | awk '{ print "- " $0 }'
            fi
          } > "${body_file}"

          if [ -n "${open_pr}" ]; then
            gh pr edit "${SYNC_BRANCH}" --body-file "${body_file}"
          else
            gh pr create \
              --base main \
              --head "${SYNC_BRANCH}" \
              --title "chore(provider): sync the Veryfront Cloud model catalog data" \
              --body-file "${body_file}"
          fi
