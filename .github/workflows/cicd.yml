name: CI/CD

on:
  workflow_dispatch:
    inputs:
      maintenance_release_number:
        description: Older immutable RC number for a maintenance branch (no deploy dispatch)
        required: false
        type: string
  pull_request:
  # Required for merge-queue entries: queued runs report checks via merge_group.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Cancel only superseded first-attempt pull_request runs. Everything else
  # gets a run-unique group: a non-PR run must never be cancelled (a main push
  # can be mid-publish) nor replaced while pending, since GitHub keeps one
  # pending run per group, and a manual rerun of an older attempt keeps its
  # ref and must not cancel the current head's run. The contract is pinned by
  # tests/integration/ci/workflow-concurrency.test.ts. See veryfront-studio#5544.
  group: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('{0}-{1}', github.workflow, github.ref) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================
  # CD: Reuse the tested merge-queue run (main only)
  # The merge queue tests the exact commit that lands on main. When its run
  # of this workflow succeeded and its artifacts still exist, main skips the
  # tests, keeps the Sonar gate on the queue's coverage, and publishes the
  # queue's npm artifact under the queue run's RC number. Otherwise main runs
  # the full pipeline. The release-number artifact keeps RC numbers in landing
  # order across main runs (see scripts/ci/tested-merge-queue-run.ts).
  # The job runs, and finishes at once, on every other ref too: a job whose
  # `if` has no status function is skipped when any upstream job skipped.
  # ============================================
  tested-run:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    # On main it waits up to 30 minutes for a queue run that is still finishing
    # and up to 10 more for an earlier main run to choose its release number.
    timeout-minutes: 50
    name: tested merge-queue run
    permissions:
      actions: read
      contents: read
    outputs:
      reuse: ${{ steps.decide.outputs.reuse || 'false' }}
      run_id: ${{ steps.decide.outputs.run_id }}
      release_number: ${{ steps.maintenance.outputs.release_number || steps.decide.outputs.release_number || github.run_number }}
    steps:
      - name: Validate maintenance release number
        if: github.event_name == 'workflow_dispatch' && inputs.maintenance_release_number != ''
        id: maintenance
        env:
          RELEASE_NUMBER: ${{ inputs.maintenance_release_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$RELEASE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::maintenance_release_number must be a positive integer RC build number." >&2
            exit 1
          fi
          if ! [[ "${GITHUB_REF}" =~ ^refs/heads/maintenance/rc\.([1-9][0-9]*)$ ]]; then
            echo "::error::Maintenance RC publication must be dispatched from a protected maintenance/rc.<number> branch." >&2
            exit 1
          fi
          if [ "${BASH_REMATCH[1]}" != "$RELEASE_NUMBER" ]; then
            echo "::error::maintenance_release_number must match the maintenance branch suffix." >&2
            exit 1
          fi
          if [ "${GITHUB_REF_PROTECTED:-false}" != "true" ]; then
            echo "::error::Maintenance source branch must be protected." >&2
            exit 1
          fi
          branch_name="$(jq -rn --arg branch "${GITHUB_REF#refs/heads/}" '$branch | @uri')"
          branch_identity="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${branch_name}" --jq '{sha: .commit.sha, protected: .protected}')"
          if ! jq -e --arg sha "${GITHUB_SHA}" '.protected == true and .sha == $sha' <<< "$branch_identity" >/dev/null; then
            echo "::error::Maintenance source branch protection or exact commit differs." >&2
            exit 1
          fi
          echo "release_number=$RELEASE_NUMBER" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.ref == 'refs/heads/main' && inputs.maintenance_release_number == ''
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        if: github.ref == 'refs/heads/main' && inputs.maintenance_release_number == ''
        timeout-minutes: 5
      - name: Find the tested merge-queue run
        if: github.ref == 'refs/heads/main' && inputs.maintenance_release_number == ''
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deno run --config=scripts/test.deno.json --frozen --no-check \
            --allow-env=GH_TOKEN,GITHUB_EVENT_NAME,GITHUB_OUTPUT,GITHUB_REPOSITORY,GITHUB_RUN_ATTEMPT,GITHUB_RUN_ID,GITHUB_RUN_NUMBER,GITHUB_SHA \
            --allow-net=api.github.com --allow-write="${GITHUB_OUTPUT}" \
            scripts/ci/tested-merge-queue-run.ts \
            "npm-compatibility-${GITHUB_SHA}" \
            coverage-shard-1 coverage-shard-2 coverage-shard-3 coverage-shard-4 \
            coverage-shard-5 coverage-shard-6 coverage-shard-7 coverage-shard-8 \
            coverage-native-executor coverage-integration-client
      - name: Record release number
        if: (github.ref == 'refs/heads/main' && inputs.maintenance_release_number == '') || (github.event_name == 'workflow_dispatch' && inputs.maintenance_release_number != '' && startsWith(github.ref, 'refs/heads/maintenance/rc.'))
        env:
          RELEASE_NUMBER: ${{ steps.maintenance.outputs.release_number || steps.decide.outputs.release_number }}
        run: |
          mkdir -p dist/release-number
          echo "${RELEASE_NUMBER}" > dist/release-number/release-number.txt
      - name: Upload release number
        if: (github.ref == 'refs/heads/main' && inputs.maintenance_release_number == '') || (github.event_name == 'workflow_dispatch' && inputs.maintenance_release_number != '' && startsWith(github.ref, 'refs/heads/maintenance/rc.'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-number-${{ steps.maintenance.outputs.release_number || steps.decide.outputs.release_number }}
          path: dist/release-number
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  # ============================================
  # CI: Quality Checks
  # ============================================
  ci:
    needs: [tested-run]
    if: ${{ !cancelled() && needs.tested-run.outputs.reuse != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        check: [test-layout, format, lint, typecheck, test-typecheck]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure test migration baselines
        if: ${{ matrix.check == 'test-layout' || matrix.check == 'lint' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          case "$EVENT_NAME" in
            pull_request) fetch_ref="$PR_BASE_SHA"; base="$PR_BASE_SHA" ;;
            merge_group) fetch_ref="$MERGE_GROUP_BASE_SHA"; base="$MERGE_GROUP_BASE_SHA" ;;
            push) fetch_ref="$PUSH_BASE_SHA"; base="$PUSH_BASE_SHA" ;;
            *) fetch_ref="main"; base="origin/main" ;;
          esac

          if [ -z "$base" ] || printf '%s' "$base" | grep -Eq '^0+$'; then
            fetch_ref="main"
            base="origin/main"
          fi
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            if [ "$base" = "origin/main" ]; then
              git fetch --no-tags --unshallow origin "main:refs/remotes/origin/main"
            else
              git fetch --no-tags --unshallow origin "$fetch_ref"
            fi
          elif [ "$base" = "origin/main" ]; then
            git fetch --no-tags --depth=1 origin "main:refs/remotes/origin/main"
          else
            git fetch --no-tags --depth=1 origin "$fetch_ref"
          fi

          echo "TEST_LAYOUT_MIGRATION_BASE_REF=$base" >> "$GITHUB_ENV"
          echo "TEST_SEMANTIC_AUDIT_BASE_REF=$base" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
      # docs:snippets:check runs the integrations guide's TypeScript first call
      # under Node, which needs Node 22.18+ to run .ts files without flags.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        if: ${{ matrix.check == 'lint' }}
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Run ${{ matrix.check }}
        run: |
          case "${{ matrix.check }}" in
            test-layout) deno task test:layout ;;
            format) deno task fmt:check ;;
            # Keep the local lint:ci task intact. CI runs its test typecheck
            # concurrently, and fails closed if the task chain changes shape.
            lint)
              deno eval '
                const chain = JSON.parse(Deno.readTextFileSync("deno.json"))
                  .tasks["lint:ci"].split(" && ");
                const check = "deno task lint:test-typecheck";
                if (chain.filter((command) => command === check).length !== 1) {
                  throw new Error("expected one test typecheck in lint:ci");
                }
                const status = await new Deno.Command("bash", {
                  args: ["-e", "-o", "pipefail", "-c",
                    chain.filter((command) => command !== check).join(" && ")],
                  stdout: "inherit", stderr: "inherit",
                }).spawn().status;
                Deno.exit(status.code);
              '
              ;;
            typecheck) deno task typecheck ;;
            test-typecheck) deno task lint:test-typecheck ;;
          esac
      # test:scripts is a local task; CI needs this focused generator lane.
      - name: Run Runs fixture generator regression tests
        if: ${{ matrix.check == 'typecheck' }}
        run: deno task test:file scripts/generate-runs-fixtures.test.ts

  # ============================================
  # CI: Tests
  # ============================================

  tests-integration:
    needs: [tested-run]
    if: ${{ !cancelled() && needs.tested-run.outputs.reuse != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 35
    name: "tests (integration shard ${{ matrix.shard }}/3)"
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 10
        with:
          warm-cache: "true"
          warm-redis-cache: ${{ matrix.shard == 1 }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Chromium for integration hydration regressions
        timeout-minutes: 20
        uses: ./.github/actions/install-chromium
      # Nested Node executor fixtures in both shards need the resolver packages.
      - name: Install Node resolver test dependencies
        run: |
          npm ci --ignore-scripts --prefix tests/node/resolver-dependencies
          mkdir -p node_modules npm/node_modules
          cp -R tests/node/resolver-dependencies/node_modules/. npm/node_modules/
      - name: Run Node cache-link compatibility tests
        if: ${{ matrix.shard == 2 }}
        run: node ./tests/node/run-tests.mjs 'src/utils/cache-dir.test.ts'
      # The pinned egress transport is Node/Bun-only, so the Deno lanes skip its
      # tests entirely. Without this step nothing in CI exercises it, which is
      # how it shipped omitting the request headers `fetch` normally supplies.
      - name: Run Node egress transport tests
        if: ${{ matrix.shard == 2 }}
        run: node ./tests/node/run-tests.mjs 'src/platform/compat/http/pinned-fetch.test.ts'
      - name: Generate integration inputs
        run: deno task generate
      - name: Run integration shard
        env:
          INTEGRATION_SHARD: ${{ matrix.shard }}
        run: |
          deno eval --config=scripts/test.deno.json '
            import { planIntegrationShard } from "./scripts/test/run-suite.ts";
            import {
              buildDenoSuiteCommandArgs, DENO_SUITE_PROFILES,
            } from "./scripts/test/run-deno-suite.ts";
            import {
              buildTestProcessEnv, partitionDenoSuiteFiles,
              shouldRunDenoBatchInParallel,
            } from "./scripts/test/suites.ts";
            const index = Number(Deno.env.get("INTEGRATION_SHARD"));
            const plans = await planIntegrationShard({ index, total: 3 });
            if (!plans.some((plan) => plan.files.length)) throw new Error("empty integration shard");
            for (const { suite, files: selected } of plans) {
              if (selected.length === 0) continue;
              const profile = DENO_SUITE_PROFILES[suite];
              console.log(`Integration shard ${index}/3 (${suite}): ${selected.length} files`);
              const batches = partitionDenoSuiteFiles(selected, profile.maxFilesPerProcess);
              for (const files of batches) {
                const status = await new Deno.Command("deno", {
                  args: buildDenoSuiteCommandArgs(suite, files, {
                    parallel: shouldRunDenoBatchInParallel(profile.parallel, files),
                    passthroughArgs: ["--no-lock"],
                  }),
                  clearEnv: true,
                  env: buildTestProcessEnv(Deno.env.toObject(), profile.env),
                  stdin: "inherit", stdout: "inherit", stderr: "inherit",
                }).spawn().status;
                if (!status.success) Deno.exit(status.code);
              }
            }
          '

  # Preserve the required check name. Matrix results fail if any shard fails,
  # is cancelled or is skipped; the merge gate also requires this aggregate.
  # A main run that reuses its merge-queue run skips the shards; that run
  # already passed them on this commit.
  tests:
    name: tests (integration)
    needs: [tested-run, tests-integration]
    if: ${{ always() }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - name: Require all integration shards
        env:
          REUSED_RUN_ID: ${{ needs.tested-run.outputs.reuse == 'true' && needs.tested-run.outputs.run_id || '' }}
          INTEGRATION_RESULT: ${{ needs.tests-integration.result }}
        run: |
          if [ -n "$REUSED_RUN_ID" ] && [ "$INTEGRATION_RESULT" = "skipped" ]; then
            echo "Integration shards passed in merge-queue run $REUSED_RUN_ID"
            exit 0
          fi
          if [ "$INTEGRATION_RESULT" != "success" ]; then
            echo "::error::Integration shards finished with $INTEGRATION_RESULT"
            exit 1
          fi

  tests-node:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [npm-compatibility-artifact]
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 20
    name: "tests (node shard ${{ matrix.shard }}/2)"
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
        with:
          warm-cache: "true"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: ./.github/actions/restore-npm-workspace
      - name: Run Node runtime shard
        env:
          VF_TEST_SHARD: ${{ matrix.shard }}/2
        run: node ./tests/node/run-tests.mjs --suite=runtime:node

  # Sandbox worker generation and prepared-module encoding on the minimum
  # supported Node. Only Node 22/24 lack the Uint8Array proposal methods
  # (toHex/toBase64) whose use shipped the #732 defect class; the full node
  # suite above covers Node 24, this leg pins the floor
  # (veryfront-issue-inbox#751).
  tests-node-sandbox:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [npm-compatibility-artifact]
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 15
    name: tests (node sandbox, minimum Node)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
        with:
          warm-cache: "true"
      - name: Read minimum supported Node version
        id: node-version
        run: |
          deno eval '
            import { MINIMUM_NODE_VERSION } from "./scripts/build/runtime-support.ts";
            console.log(`version=${MINIMUM_NODE_VERSION}`);
          ' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          package-manager-cache: false
      - uses: ./.github/actions/restore-npm-workspace
      - name: Run sandbox worker tests
        run: node ./tests/node/run-tests.mjs --suite=runtime:node 'src/security/sandbox/'

  tests-bun:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [npm-compatibility-artifact]
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 20
    name: tests (bun)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
        with:
          warm-cache: "true"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.6"
      - uses: ./.github/actions/restore-npm-workspace
      - name: Run Bun runtime suite
        run: node --test tests/bun/runner-args.test.mjs tests/bun/workspace-packages.test.mjs && node ./tests/bun/run-tests.mjs --suite=runtime:bun

  npm-compatibility-artifact:
    needs: [tested-run]
    if: ${{ !cancelled() && needs.tested-run.outputs.reuse != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 20
    name: npm compatibility artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
        with:
          warm-cache: "true"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Build and pack tested npm output
        env:
          # Merge-queue builds carry their RC number so main can publish them.
          MAINTENANCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.maintenance_release_number != '' }}
          RELEASE_NUMBER: ${{ needs.tested-run.outputs.release_number || github.run_number }}
        run: |
          BASE_VERSION=$(jq -r '.version' deno.json)
          if { [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_EVENT_NAME}" = "merge_group" ] || [ "${MAINTENANCE_RELEASE}" = "true" ]; } && [[ ! "${BASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            export VERSION="${BASE_VERSION}.${RELEASE_NUMBER}"
            deno run -A scripts/ci/prepare-rc-build.ts
          fi
          deno task build:npm
          deno run --config=scripts/test.deno.json --frozen --allow-read --allow-write --allow-run=npm,tar \
            scripts/ci/npm-compatibility-artifact.ts pack npm dist/npm-compatibility "${GITHUB_SHA}"
      - name: Archive npm runtime workspace
        run: tar -cf - npm | gzip -1 > dist/npm-runtime-workspace.tar.gz
      - name: Upload tested npm compatibility artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-compatibility-${{ github.sha }}
          path: dist/npm-compatibility
          retention-days: 30
          overwrite: true
      - name: Upload npm runtime workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-runtime-workspace-${{ github.sha }}
          path: dist/npm-runtime-workspace.tar.gz
          retention-days: 1
          compression-level: 0
          overwrite: true

  tests-runtime-critical-flow:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [npm-compatibility-artifact]
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 20
    name: "tests (runtime critical flow: ${{ matrix.runtime }})"
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        runtime: [deno, node, bun]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
        with:
          warm-cache: "true"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ matrix.runtime == 'bun' }}
        with:
          bun-version: "1.3.6"
      - name: Download canonical npm compatibility artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-compatibility-${{ github.sha }}
          path: dist/npm-compatibility
      - name: Run runtime critical flow
        run: deno run -A scripts/test/runtime-inference-critical-flow.ts --runtime=${{ matrix.runtime }} --packed-dir=dist/npm-compatibility

  tests-windows-localhost:
    needs: [tested-run]
    if: ${{ !cancelled() && needs.tested-run.outputs.reuse != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: windows-2022
    timeout-minutes: 20
    name: tests (Windows localhost routing)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
        with:
          warm-cache: "true"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Record wildcard localhost resolution
        shell: pwsh
        run: |
          $nodeReport = node scripts/ci/probe-localhost-resolution.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $denoReport = deno run --allow-net scripts/ci/probe-localhost-resolution.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @(
            "### Windows wildcard localhost resolution",
            "",
            '```json',
            $nodeReport,
            $denoReport,
            '```'
          ) | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Install Chromium
        timeout-minutes: 10
        run: deno run -A npm:playwright@1.60.0 install chromium
      - name: Exercise local virtual-host routing
        run: deno run -A scripts/ci/run-windows-localhost-e2e.ts

  coverage-shards:
    needs: [tested-run]
    if: ${{ !cancelled() && needs.tested-run.outputs.reuse != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 20
    name: coverage shard ${{ matrix.shard }}/8
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
      - name: Run unit coverage shard
        id: coverage
        run: |
          START=$(date +%s)
          deno task coverage:ci:shard -- --shard=${{ matrix.shard }}/8 --coverage-dir=coverage-shard-${{ matrix.shard }}
          echo "duration=$(($(date +%s) - START))s" >> "$GITHUB_OUTPUT"
      - name: Include CLI, dependency history, and runtime security integration coverage
        if: matrix.shard == 1
        run: |
          rm -rf coverage-history coverage-cli
          deno task test:file --coverage=coverage-history \
            tests/integration/semantic-unit-boundary/src/platform/adapters/fs/veryfront/dependency-metadata-history.test.ts \
            tests/integration/semantic-unit-boundary/src/platform/adapters/veryfront-api-client/dependency-metadata-history.test.ts \
            tests/integration/semantic-unit-boundary/src/transforms/esm/package-registry-metadata-history.test.ts \
            tests/integration/semantic-unit-boundary/src/config/host-api-base.test.ts \
            tests/integration/platform/runtime-request-context.test.ts \
            tests/integration/runtime/compat/esbuild-cleanup.test.ts \
            tests/integration/server/shared-agent-bootstrap.test.ts \
            tests/integration/observability/project-otlp-transport-policy.test.ts \
            tests/integration/observability/project-provider.test.ts \
            tests/integration/observability/project-http-lifecycle.test.ts
          # The CLI regression changes cwd, so give it a separate process.
          deno task test:file --coverage=coverage-cli \
            tests/integration/cli/merge-preview.integration.test.ts \
            tests/integration/cli/production-startup-cache.integration.test.ts
          # Kept as separate reports: block ids are normalized only when every
          # report is merged at once (coverage gate and Sonar), so an early
          # merge here must not rewrite them.
          mkdir -p coverage-shard-1/history coverage-shard-1/cli
          deno coverage coverage-history --include=src/ --include=cli/ --exclude=/tests/ --exclude=/__tests__/ --lcov > coverage-shard-1/history/lcov.info
          deno coverage coverage-cli --include=src/ --include=cli/ --exclude=/tests/ --exclude=/__tests__/ --lcov > coverage-shard-1/cli/lcov.info
      - name: Upload unit coverage lcov
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-shard-${{ matrix.shard }}/**/lcov.info
          retention-days: 1
      - name: Add coverage shard summary
        run: echo "### Coverage shard ${{ matrix.shard }}/8 completed in ${{ steps.coverage.outputs.duration }}" >> "$GITHUB_STEP_SUMMARY"

  coverage-node-executor:
    needs: [tested-run]
    if: ${{ !cancelled() && needs.tested-run.outputs.reuse != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 10
    name: native executor coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install Node resolver test dependencies
        run: |
          npm ci --ignore-scripts --prefix tests/node/resolver-dependencies
          mkdir -p node_modules npm/node_modules
          cp -R tests/node/resolver-dependencies/node_modules/. npm/node_modules/
      - name: Collect mapped native executor coverage
        run: deno task coverage:ci:node-executor
      - name: Upload native executor coverage lcov
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-native-executor
          path: coverage/node-executor/lcov.info
          retention-days: 1
          if-no-files-found: error

  coverage-integration-client:
    needs: [tested-run]
    if: ${{ !cancelled() && needs.tested-run.outputs.reuse != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 20
    name: integration client coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
        with:
          warm-cache: "true"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Collect integration client and CLI coverage
        run: deno task coverage:ci:integration-client
      - name: Upload integration client coverage lcov
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-integration-client
          path: coverage/integration-client/lcov.info
          retention-days: 1
          if-no-files-found: error

  coverage:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 10
    name: coverage gate
    needs: [coverage-shards, tested-run]
    if: ${{ always() && (github.event_name != 'merge_group' || !cancelled()) && needs.tested-run.outputs.reuse != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Require coverage shards
        env:
          COVERAGE_SHARDS_RESULT: ${{ needs.coverage-shards.result }}
        run: |
          if [ "$COVERAGE_SHARDS_RESULT" != "success" ]; then
            echo "::error::Coverage shards finished with $COVERAGE_SHARDS_RESULT"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
      - name: Download unit coverage lcov files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: coverage-profiles
          pattern: coverage-shard-*
      - name: Run coverage gate
        id: coverage
        run: |
          START=$(date +%s)
          deno task coverage:ci:merge coverage-profiles/coverage-shard-*
          echo "duration=$(($(date +%s) - START))s" >> "$GITHUB_OUTPUT"
      - name: Add coverage summary
        run: echo "### Coverage shard merge completed in ${{ steps.coverage.outputs.duration }}" >> "$GITHUB_STEP_SUMMARY"

  # Uploading is a separate job from `coverage-shards` on purpose. The shard job
  # runs the unit suite with `--allow-all`, so any code on the branch executes
  # there. Granting that job `id-token: write` would let branch code mint a
  # repository OIDC token. This job runs no repository code: it downloads the
  # shard artifacts, rewrites paths with sed, and calls the upload action.
  codecov-upload:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 10
    name: codecov upload
    needs: [coverage-shards]
    if: ${{ needs.coverage-shards.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download unit coverage lcov files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: coverage-profiles
          pattern: coverage-shard-*
      # `deno coverage --lcov` emits absolute `SF:` paths (for example,
      # `$GITHUB_WORKSPACE/src/...`). Codecov matches
      # coverage records against repo-relative paths, so strip the workspace
      # prefix. This edits the downloaded copies only. The stored artifact and
      # the `coverage gate` job read their own copies and are unaffected.
      - name: Normalize lcov paths for Codecov
        run: |
          find coverage-profiles -name lcov.info -exec sed -i "s|^SF:${GITHUB_WORKSPACE}/|SF:|" {} +
      # Authenticated with OIDC rather than a stored CODECOV_TOKEN, so there is
      # no upload secret to manage or rotate. A token is otherwise mandatory
      # here: `main` is a protected branch, and Codecov only permits tokenless
      # uploads for fork PRs.
      #
      # Advisory only: `fail_ci_if_error` stays false so a Codecov outage can
      # never fail this job, and this job is not a required status check. The
      # blocking threshold remains `deno task coverage:gate`.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          # Comma separated, the form the action documents. All files go up in
          # one call, so Codecov records one upload per commit.
          files: coverage-profiles/coverage-shard-1/lcov.info,coverage-profiles/coverage-shard-1/history/lcov.info,coverage-profiles/coverage-shard-1/cli/lcov.info,coverage-profiles/coverage-shard-2/lcov.info,coverage-profiles/coverage-shard-3/lcov.info,coverage-profiles/coverage-shard-4/lcov.info,coverage-profiles/coverage-shard-5/lcov.info,coverage-profiles/coverage-shard-6/lcov.info,coverage-profiles/coverage-shard-7/lcov.info,coverage-profiles/coverage-shard-8/lcov.info
          disable_search: true
          name: unit
          fail_ci_if_error: false

  # Merges every coverage report into the one LCOV file Sonar reads. Merging
  # runs repository code (`deno task coverage:ci:merge`), so it happens here,
  # in a job with no secrets, and hands the scan job only the finished report.
  sonar-coverage:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 10
    name: Sonar coverage report
    needs: [
      tested-run,
      version-check,
      coverage-shards,
      coverage-node-executor,
      coverage-integration-client,
    ]
    if: ${{ !cancelled() && (needs.tested-run.outputs.reuse != 'true' || needs.version-check.outputs.is_stable != 'false') && (needs.tested-run.outputs.reuse == 'true' || (needs.coverage-shards.result == 'success' && needs.coverage-node-executor.result == 'success' && needs.coverage-integration-client.result == 'success')) && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]')) }}
    permissions:
      actions: read
      contents: read
    steps: &sonar-coverage-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A main run that reuses the merge-queue run merges the queue's coverage.
      - name: Download unit coverage lcov files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: coverage-profiles
          pattern: coverage-shard-*
          run-id: ${{ needs.tested-run.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download native executor coverage lcov
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-native-executor
          path: coverage-profiles/coverage-native-executor
          run-id: ${{ needs.tested-run.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download integration client coverage lcov
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-integration-client
          path: coverage-profiles/coverage-integration-client
          run-id: ${{ needs.tested-run.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
      - name: Merge coverage reports for SonarQube
        run: |
          deno task coverage:ci:merge -- --threshold=0 \
            coverage-profiles/coverage-shard-* \
            coverage-profiles/coverage-native-executor \
            coverage-profiles/coverage-integration-client
      - name: Normalize lcov paths
        run: |
          sed -i "s|^SF:${GITHUB_WORKSPACE}/|SF:|" coverage/lcov.info
      - name: Upload merged Sonar coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-sonar
          path: coverage/lcov.info
          retention-days: 1

  sonar-coverage-main:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 10
    name: Reused main Sonar coverage report
    needs: [tested-run, version-check]
    if: ${{ !cancelled() && needs.tested-run.result == 'success' && needs.tested-run.outputs.reuse == 'true' && needs.version-check.outputs.is_stable == 'false' && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]')) }}
    permissions:
      actions: read
      contents: read
    steps: *sonar-coverage-steps

  # Automatic Analysis runs on Sonar's servers and cannot see coverage, which is
  # only produced where the tests run. This job holds SONAR_TOKEN, so it runs no
  # repository code: it downloads the merged report from `sonar-coverage` and
  # calls the scan action.
  #
  # Skipped for forks and for Dependabot: both reach the scan without SONAR_TOKEN
  # (Dependabot branches live in this repository, but Actions secrets are not
  # exposed to Dependabot-triggered runs), and an empty token fails the scan.
  # The scan waits up to 20 minutes for SonarCloud's server-side Quality Gate
  # before this required job succeeds; the remaining 8 minutes cover checkout,
  # the report download and analysis upload (the whole job takes about 6
  # minutes today). 28 minutes keeps the coverage and Sonar path inside the
  # merge queue response budget now that `sonar-coverage` sits before it.
  sonar:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 28
    name: SonarQube Cloud scan
    needs: [sonar-coverage, tested-run, version-check]
    if: ${{ !cancelled() && (needs.tested-run.outputs.reuse != 'true' || needs.version-check.outputs.is_stable != 'false') && needs.sonar-coverage.result == 'success' && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]')) }}
    permissions:
      contents: read
    steps: &sonar-scan-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Sonar reads git history for new-code and blame.
          fetch-depth: 0
      - name: Download merged Sonar coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-sonar
          path: coverage
      - name: Set up Node for the pinned Sonar action
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
      - name: Fetch the pinned official Sonar action outside the scan workspace
        shell: bash
        run: |
          set -euo pipefail
          action_dir="$RUNNER_TEMP/sonarqube-scan-action"
          action_ref=SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
          action_repository="${action_ref%@*}"
          action_sha="${action_ref##*@}"
          git init "$action_dir"
          git -C "$action_dir" fetch --depth=1 "https://github.com/$action_repository.git" "$action_sha"
          test "$(git -C "$action_dir" rev-parse FETCH_HEAD)" = "$action_sha"
          git -C "$action_dir" checkout --detach FETCH_HEAD
      - name: Scan with one Sonar server-error retry
        id: sonar-scan
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_EVENT_NAME: ${{ github.event_name }}
          SONAR_REF_NAME: ${{ github.ref_name }}
          INPUT_ARGS: ""
          INPUT_PROJECTBASEDIR: "."
          INPUT_SCANNERVERSION: "8.1.0.6389"
          INPUT_SCANNERBINARIESURL: https://binaries.sonarsource.com/Distribution/sonar-scanner-cli
          INPUT_SKIPSIGNATUREVERIFICATION: "false"
          INPUT_SCANNERBINARIESAUTHHEADER: ""
        run: |
          set -euo pipefail
          # Queue scans replace the originating PR decoration, never main.
          # PR mode reuses the analysis cache for the exact queue checkout.
          if [ "$SONAR_EVENT_NAME" = "merge_group" ]; then
            if [[ ! "$SONAR_REF_NAME" =~ ^gh-readonly-queue/main/pr-([0-9]+)-[0-9a-f]+$ ]]; then
              echo "::error::Invalid merge queue ref for Sonar PR analysis"
              exit 1
            fi
            export INPUT_ARGS="-Dsonar.pullrequest.key=${BASH_REMATCH[1]} -Dsonar.pullrequest.branch=$SONAR_REF_NAME -Dsonar.pullrequest.base=main"
          fi
          # Preserve the official action and its signature verification. Only a
          # failed Compute Engine task may retry; a red quality gate never does.
          for attempt in 1 2; do
            log="$RUNNER_TEMP/sonar-attempt-$attempt.log"
            echo "Sonar scan attempt $attempt of 2"
            set +e
            node "$RUNNER_TEMP/sonarqube-scan-action/dist/index.js" 2>&1 | tee "$log"
            statuses=("${PIPESTATUS[@]}")
            set -e
            if [ "${statuses[1]}" -ne 0 ]; then
              exit "${statuses[1]}"
            fi
            status="${statuses[0]}"
            if [ "$status" -eq 0 ] || [ "$attempt" -eq 2 ]; then
              exit "$status"
            fi
            if ! grep -Fq 'CE Task finished abnormally' "$log" || grep -Fq 'QUALITY GATE STATUS: FAILED' "$log"; then
              exit "$status"
            fi
            echo "::warning::Retrying Sonar once after CE Task finished abnormally"
          done

      - name: Require server-side quality gate
        if: ${{ always() }}
        env:
          SONAR_RESULT: ${{ steps.sonar-scan.outcome }}
        run: |
          if [ "$SONAR_RESULT" != "success" ]; then
            echo "::error::Server-side SonarQube Cloud quality gate finished with $SONAR_RESULT"
            exit 1
          fi

  sonar-main:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 28
    name: Reused main SonarQube Cloud scan
    needs: [sonar-coverage-main, tested-run, version-check]
    if: ${{ !cancelled() && needs.tested-run.outputs.reuse == 'true' && needs.version-check.outputs.is_stable == 'false' && needs.sonar-coverage-main.result == 'success' && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]')) }}
    permissions:
      contents: read
    steps: *sonar-scan-steps

  sonar-quality-gate:
    name: SonarQube Cloud quality gate
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 2
    needs: [sonar, sonar-main, tested-run, version-check]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') }}
    steps:
      - name: Require server-side quality gate
        env:
          SONAR_RESULT: ${{ needs.tested-run.outputs.reuse == 'true' && needs.version-check.outputs.is_stable == 'false' && needs.sonar-main.result || needs.sonar.result }}
        run: |
          if [ "$SONAR_RESULT" != "success" ]; then
            echo "::error::Server-side SonarQube Cloud quality gate finished with $SONAR_RESULT"
            exit 1
          fi

  tests-e2e-rsc-browser:
    needs: [tested-run]
    if: ${{ !cancelled() && needs.tested-run.outputs.reuse != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 25
    name: tests (rsc browser e2e)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
      - name: Install Chromium
        timeout-minutes: 20
        uses: ./.github/actions/install-chromium
      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_wait_seconds: 10
          command: deno task test:e2e:rsc-browser

  # ============================================
  # CI: Compiled Binary E2E Tests
  # ============================================

  tests-binary-e2e:
    needs: [tested-run]
    if: ${{ !cancelled() && needs.tested-run.outputs.reuse != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 60
    name: tests (binary e2e)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
      - name: Install Chromium
        timeout-minutes: 20
        uses: ./.github/actions/install-chromium
      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 30
          max_attempts: 2
          retry_wait_seconds: 30
          command: |
            VERYFRONT_BINARY_FRESH=1 deno task test:e2e:binary

  # Failure observers have one prerequisite each, so they never wait for
  # unrelated tests or Sonar. Only these no-checkout jobs can cancel runs, and
  # they run the callee pinned to an immutable reviewed main commit, never the queued
  # revision; jobs executing repository code keep their read permissions.
  cancel-after-ci:
    needs: [ci]
    if: ${{ failure() && github.event_name == 'merge_group' }}
    permissions:
      actions: write
    uses: veryfront/veryfront-code/.github/workflows/cancel-failed-merge-group.yml@03903775fbf92852f23cccc1ba6243192042ff64

  cancel-after-coverage:
    needs: [coverage]
    if: ${{ failure() && github.event_name == 'merge_group' }}
    permissions:
      actions: write
    uses: veryfront/veryfront-code/.github/workflows/cancel-failed-merge-group.yml@03903775fbf92852f23cccc1ba6243192042ff64

  cancel-after-tests:
    needs: [tests]
    if: ${{ failure() && github.event_name == 'merge_group' }}
    permissions:
      actions: write
    uses: veryfront/veryfront-code/.github/workflows/cancel-failed-merge-group.yml@03903775fbf92852f23cccc1ba6243192042ff64

  cancel-after-tests-node:
    needs: [tests-node]
    if: ${{ failure() && github.event_name == 'merge_group' }}
    permissions:
      actions: write
    uses: veryfront/veryfront-code/.github/workflows/cancel-failed-merge-group.yml@03903775fbf92852f23cccc1ba6243192042ff64

  cancel-after-tests-node-sandbox:
    needs: [tests-node-sandbox]
    if: ${{ failure() && github.event_name == 'merge_group' }}
    permissions:
      actions: write
    uses: veryfront/veryfront-code/.github/workflows/cancel-failed-merge-group.yml@03903775fbf92852f23cccc1ba6243192042ff64

  cancel-after-tests-bun:
    needs: [tests-bun]
    if: ${{ failure() && github.event_name == 'merge_group' }}
    permissions:
      actions: write
    uses: veryfront/veryfront-code/.github/workflows/cancel-failed-merge-group.yml@03903775fbf92852f23cccc1ba6243192042ff64

  cancel-after-tests-binary-e2e:
