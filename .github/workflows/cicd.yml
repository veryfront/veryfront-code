    if: ${{ failure() && github.event_name == 'merge_group' }}
    permissions:
      actions: write
    uses: veryfront/veryfront-code/.github/workflows/cancel-failed-merge-group.yml@03903775fbf92852f23cccc1ba6243192042ff64

  cancel-after-sonar-coverage:
    needs: [sonar-coverage]
    if: ${{ failure() && github.event_name == 'merge_group' }}
    permissions:
      actions: write
    uses: veryfront/veryfront-code/.github/workflows/cancel-failed-merge-group.yml@03903775fbf92852f23cccc1ba6243192042ff64

  cancel-after-coverage-node-executor:
    needs: [coverage-node-executor]
    if: ${{ failure() && github.event_name == 'merge_group' }}
    permissions:
      actions: write
    uses: veryfront/veryfront-code/.github/workflows/cancel-failed-merge-group.yml@03903775fbf92852f23cccc1ba6243192042ff64

  cancel-after-coverage-integration-client:
    needs: [coverage-integration-client]
    if: ${{ failure() && github.event_name == 'merge_group' }}
    permissions:
      actions: write
    uses: veryfront/veryfront-code/.github/workflows/cancel-failed-merge-group.yml@03903775fbf92852f23cccc1ba6243192042ff64

  quality-gate-merge:
    name: quality gate (merge)
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 2
    needs:
      - ci
      - coverage
      - tests
      - tests-node
      - tests-node-sandbox
      - tests-bun
      - tests-binary-e2e
      - tests-e2e-rsc-browser
      - sonar-quality-gate
      - tested-run
    if: ${{ always() && github.event_name != 'push' }}
    steps:
      - name: Require merge correctness dependencies
        env:
          # A main run that reuses its merge-queue run skips the tests that run
          # already passed on this commit; Sonar still has to pass here.
          REUSED_RUN_ID: ${{ needs.tested-run.outputs.reuse == 'true' && needs.tested-run.outputs.run_id || '' }}
          # Sonar needs SONAR_TOKEN, so fork and Dependabot PRs intentionally
          # skip it. Pushes, merge-group runs, and trusted PRs must block on it.
          SONAR_REQUIRED: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') }}
          SOURCE_CHECKS_RESULT: ${{ needs.ci.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          SONAR_RESULT: ${{ needs.sonar-quality-gate.result }}
          INTEGRATION_TESTS_RESULT: ${{ needs.tests.result }}
          NODE_RUNTIME_TESTS_RESULT: ${{ needs.tests-node.result }}
          NODE_SANDBOX_TESTS_RESULT: ${{ needs.tests-node-sandbox.result }}
          BUN_RUNTIME_TESTS_RESULT: ${{ needs.tests-bun.result }}
          BINARY_E2E_RESULT: ${{ needs.tests-binary-e2e.result }}
          RSC_BROWSER_E2E_RESULT: ${{ needs.tests-e2e-rsc-browser.result }}
        run: |
          failed=0
          for result_name in \
            SOURCE_CHECKS_RESULT \
            COVERAGE_RESULT \
            SONAR_RESULT \
            INTEGRATION_TESTS_RESULT \
            NODE_RUNTIME_TESTS_RESULT \
            NODE_SANDBOX_TESTS_RESULT \
            BUN_RUNTIME_TESTS_RESULT \
            BINARY_E2E_RESULT \
            RSC_BROWSER_E2E_RESULT
          do
            result="${!result_name}"
            if [ "$result_name" = "SONAR_RESULT" ] && [ "$SONAR_REQUIRED" != "true" ]; then
              continue
            fi
            if [ -n "$REUSED_RUN_ID" ] && [ "$result_name" != "SONAR_RESULT" ] && [ "$result" = "skipped" ]; then
              echo "$result_name passed in merge-queue run $REUSED_RUN_ID"
              continue
            fi
            if [ "$result" != "success" ]; then
              echo "::error::$result_name finished with $result"
              failed=1
            fi
          done
          exit "$failed"

  # ============================================
  # CI: npm Install Smoke
  # ============================================

  # Clean-room install of the generated npm packages under Node: bare-install
  # CLI startup, optional-peer metadata, extension package loading, and a real
  # starter dev-server render (see scripts/test/npm-install-smoke.ts).
  npm-smoke-node-versions:
    needs: [tested-run]
    if: ${{ !cancelled() && needs.tested-run.outputs.reuse != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 10
    name: npm smoke Node version contract
    outputs:
      node_versions: ${{ steps.versions.outputs.node_versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
      - name: Read npm smoke Node versions
        id: versions
        run: |
          deno eval '
            import { NPM_SMOKE_NODE_VERSIONS } from "./scripts/build/runtime-support.ts";
            console.log(`node_versions=${JSON.stringify(NPM_SMOKE_NODE_VERSIONS)}`);
          ' >> "$GITHUB_OUTPUT"

  tests-npm-install-smoke:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [npm-smoke-node-versions, npm-compatibility-artifact]
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 30
    name: "tests (npm install smoke: Node ${{ matrix.node-version }})"
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        node-version: ${{ fromJSON(needs.npm-smoke-node-versions.outputs.node_versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
        with:
          warm-cache: "true"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Download canonical npm compatibility artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-compatibility-${{ github.sha }}
          path: dist/npm-compatibility
      - name: Materialize canonical npm output
        run: |
          deno run --config=scripts/test.deno.json --frozen --allow-read --allow-write --allow-run=tar \
            scripts/ci/npm-compatibility-artifact.ts materialize dist/npm-compatibility npm
      - name: Install TypeScript toolchain
        run: npm --prefix storybook ci --ignore-scripts
      - name: Check published package types
        run: deno task typecheck:consumer --skip-build
      - name: Report npm package size
        run: |
          deno run --allow-read --allow-run=npm scripts/build/report-artifact-sizes.ts --npm-package npm \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Clean-room install/import smoke
        env:
          VF_NPM_PACK_DIR: ${{ github.workspace }}/dist/npm-compatibility
        run: deno run -A scripts/test/npm-install-smoke.ts

  quality-gate-artifact:
    name: quality gate (artifact)
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 2
    needs:
      - npm-compatibility-artifact
      - tests-npm-install-smoke
      - tests-runtime-critical-flow
      - tested-run
    if: ${{ always() }}
    steps:
      - name: Require canonical artifact compatibility
        env:
          REUSED_RUN_ID: ${{ needs.tested-run.outputs.reuse == 'true' && needs.tested-run.outputs.run_id || '' }}
          ARTIFACT_BUILD_RESULT: ${{ needs.npm-compatibility-artifact.result }}
          NPM_SMOKE_RESULT: ${{ needs.tests-npm-install-smoke.result }}
          RUNTIME_CRITICAL_FLOW_RESULT: ${{ needs.tests-runtime-critical-flow.result }}
        run: |
          failed=0
          for result_name in \
            ARTIFACT_BUILD_RESULT \
            NPM_SMOKE_RESULT \
            RUNTIME_CRITICAL_FLOW_RESULT
          do
            result="${!result_name}"
            if [ -n "$REUSED_RUN_ID" ] && [ "$result" = "skipped" ]; then
              echo "$result_name passed in merge-queue run $REUSED_RUN_ID"
              continue
            fi
            if [ "$result" != "success" ]; then
              echo "::error::$result_name finished with $result"
              failed=1
            fi
          done
          exit "$failed"

  # Release-only test results that are not part of the merge gates. A main
  # run that reuses its merge-queue run inherits them from that run.
  quality-gate-release:
    name: quality gate (release)
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 2
    needs:
      - tested-run
      - npm-compatibility-artifact
      - tests-sentry-runtime-packages
      - tests-windows-localhost
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && ((github.ref == 'refs/heads/main' && inputs.maintenance_release_number == '') || (github.event_name == 'workflow_dispatch' && inputs.maintenance_release_number != '' && startsWith(github.ref, 'refs/heads/maintenance/rc.'))) }}
    steps:
      - name: Require release test results
        env:
          TESTED_RUN_RESULT: ${{ needs.tested-run.result }}
          REUSED_RUN_ID: ${{ needs.tested-run.outputs.reuse == 'true' && needs.tested-run.outputs.run_id || '' }}
          ARTIFACT_BUILD_RESULT: ${{ needs.npm-compatibility-artifact.result }}
          SENTRY_RUNTIME_PACKAGES_RESULT: ${{ needs.tests-sentry-runtime-packages.result }}
          WINDOWS_LOCALHOST_RESULT: ${{ needs.tests-windows-localhost.result }}
        run: |
          if [ "$TESTED_RUN_RESULT" != "success" ]; then
            echo "::error::TESTED_RUN_RESULT finished with $TESTED_RUN_RESULT"
            exit 1
          fi
          failed=0
          for result_name in \
            ARTIFACT_BUILD_RESULT \
            SENTRY_RUNTIME_PACKAGES_RESULT \
            WINDOWS_LOCALHOST_RESULT
          do
            result="${!result_name}"
            if [ -n "$REUSED_RUN_ID" ] && [ "$result" = "skipped" ]; then
              echo "$result_name passed in merge-queue run $REUSED_RUN_ID"
              continue
            fi
            if [ "$result" != "success" ]; then
              echo "::error::$result_name finished with $result"
              failed=1
            fi
          done
          exit "$failed"

  tests-sentry-runtime-packages:
    needs: [tested-run]
    if: ${{ !cancelled() && needs.tested-run.outputs.reuse != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    # Cold-cache runs take ~12-15min; 15 was cutting it too close.
    timeout-minutes: 20
    name: tests (sentry runtime packages)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
        with:
          warm-cache: "true"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check Sentry runtime package variants
        run: deno task test:sentry-runtime-packages

  # ============================================
  # CI: Split Mode Test
  # ============================================

  tests-split-mode:
    needs: [tested-run]
    if: ${{ !cancelled() && needs.tested-run.outputs.reuse != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUN_SPLIT_MODE_TEST == 'true' }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 10
    name: tests (split mode)
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5

      - name: Compile binary
        run: deno task build

      - name: Test split mode startup
        run: |
          # Start renderer in background
          ./bin/veryfront serve --mode=renderer --port=3000 &
          RENDERER_PID=$!

          # Start proxy in background
          ./bin/veryfront serve --mode=proxy --port=8080 &
          PROXY_PID=$!

          # Wait for startup
          sleep 5

          # Health check - just verify processes are running
          echo "Checking renderer on port 3000..."
          curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/ --max-time 5 || echo "Renderer not responding (expected without project)"

          echo "Checking proxy on port 8080..."
          curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/ --max-time 5 || echo "Proxy not responding (expected without project)"

          # Verify processes started successfully
          if kill -0 $RENDERER_PID 2>/dev/null; then
            echo "SUCCESS: Renderer process running"
          else
            echo "FAILED: Renderer process not running"
            exit 1
          fi

          if kill -0 $PROXY_PID 2>/dev/null; then
            echo "SUCCESS: Proxy process running"
          else
            echo "FAILED: Proxy process not running"
            exit 1
          fi

          # Cleanup
          kill $RENDERER_PID $PROXY_PID 2>/dev/null || true
          echo "Split mode startup test passed"

  # ============================================
  # CD: Detect release type from deno.json
  # X.Y.Z = stable (npm latest), anything else = RC
  # ============================================

  version-check:
    timeout-minutes: 5
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && ((github.ref == 'refs/heads/main' && inputs.maintenance_release_number == '') || (github.event_name == 'workflow_dispatch' && inputs.maintenance_release_number != '' && startsWith(github.ref, 'refs/heads/maintenance/rc.'))) }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.check.outputs.version }}
      is_stable: ${{ steps.check.outputs.is_stable }}
      stable_release_requested: ${{ steps.check.outputs.stable_release_requested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect release type
        id: check
        env:
          MAINTENANCE_RELEASE_NUMBER: ${{ inputs.maintenance_release_number }}
        run: |
          VERSION=$(jq -r '.version' deno.json)
          if [[ -n "${MAINTENANCE_RELEASE_NUMBER}" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc$ ]]; then
            echo "::error::Maintenance publication requires the existing numeric RC release line." >&2
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$ ]]; then
            echo "::error::deno.json version must be a valid npm semver or prerelease"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          STABLE_RELEASE_REQUESTED=$(bash scripts/ci/stable-release-requested.sh \
            "${{ github.event_name }}" \
            "$VERSION" \
            "${{ github.event.before }}")
          echo "stable_release_requested=${STABLE_RELEASE_REQUESTED}" >> $GITHUB_OUTPUT

          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> $GITHUB_OUTPUT
            if [[ "$STABLE_RELEASE_REQUESTED" == "true" ]]; then
              echo "::notice::Stable release requested: $VERSION → will publish as latest"
            else
              echo "::notice::Stable version unchanged: $VERSION → skipping publication"
            fi
          else
            echo "is_stable=false" >> $GITHUB_OUTPUT
            echo "::notice::Pre-release version detected: $VERSION → will publish as rc"
          fi

  # ============================================
  # CD: Build Binaries (main only)
  # Stable versions come from deno.json. RC versions append the workflow run number.
  # ============================================

  tests-proxy-binary:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.event_name == 'pull_request' }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
      - uses: ./.github/actions/prepare-build-deps
      - name: Verify proxy dependency lock is current
        run: |
          deno task build:proxy-lock
          git diff --exit-code -- scripts/build/proxy-deno.lock
      - name: Compile proxy binary
        run: |
          deno run -A scripts/build/compile-binary.ts \
            --entrypoint cli/proxy-main.ts \
            --profile proxy \
            --target x86_64-unknown-linux-gnu \
            --output veryfront-proxy-linux-x64
      - name: Smoke test proxy binary
        run: bash scripts/build/smoke-proxy-binary.sh ./veryfront-proxy-linux-x64
      - name: Enforce proxy memory limit
        env:
          PROXY_MEMORY_LIMIT: 1536m
          PROXY_MEMORY_ATTEMPTS: "3"
        run: bash scripts/build/smoke-proxy-memory.sh ./veryfront-proxy-linux-x64

  build-binaries:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && ((github.ref == 'refs/heads/main' && inputs.maintenance_release_number == '') || (github.event_name == 'workflow_dispatch' && inputs.maintenance_release_number != '' && startsWith(github.ref, 'refs/heads/maintenance/rc.'))) }}
    needs: [version-check, tested-run]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ contains(matrix.os, 'windows') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: veryfront-macos-arm64
            entrypoint: cli/main.ts
            profile: full
          - os: macos-latest
            target: x86_64-apple-darwin
            name: veryfront-macos-x64
            entrypoint: cli/main.ts
            profile: full
          - os: ubuntu-latest-m
            target: x86_64-unknown-linux-gnu
            name: veryfront-linux-x64
            entrypoint: cli/main.ts
            profile: full
          - os: ubuntu-latest-m
            target: aarch64-unknown-linux-gnu
            name: veryfront-linux-arm64
            entrypoint: cli/main.ts
            profile: full
          - os: ubuntu-latest-m
            target: x86_64-unknown-linux-gnu
            name: veryfront-proxy-linux-x64
            entrypoint: cli/proxy-main.ts
            profile: proxy
          - os: ubuntu-latest-m
            target: aarch64-unknown-linux-gnu
            name: veryfront-proxy-linux-arm64
            entrypoint: cli/proxy-main.ts
            profile: proxy
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            name: veryfront-windows-x64.exe
            entrypoint: cli/main.ts
            profile: full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5

      - name: Prepare RC build version
        if: needs.version-check.outputs.is_stable == 'false'
        env:
          VERSION: ${{ needs.version-check.outputs.version }}.${{ needs.tested-run.outputs.release_number }}
        run: deno run -A scripts/ci/prepare-rc-build.ts

      - uses: ./.github/actions/prepare-build-deps

      - name: Verify proxy dependency lock is current
        if: matrix.profile == 'proxy'
        shell: bash
        run: |
          deno task build:proxy-lock
          git diff --exit-code -- scripts/build/proxy-deno.lock

      - name: Compile binary
        shell: bash
        run: |
          deno run -A scripts/build/compile-binary.ts \
            --entrypoint ${{ matrix.entrypoint }} \
            --profile ${{ matrix.profile }} \
            --target ${{ matrix.target }} \
            --output ${{ matrix.name }}

      - name: Report binary size
        shell: bash
        run: |
          deno run --allow-read scripts/build/report-artifact-sizes.ts ./${{ matrix.name }} \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Smoke test proxy binary
        if: matrix.name == 'veryfront-proxy-linux-x64'
        shell: bash
        run: bash scripts/build/smoke-proxy-binary.sh ./${{ matrix.name }}

      - name: Enforce proxy memory limit
        if: matrix.name == 'veryfront-proxy-linux-x64'
        shell: bash
        env:
          PROXY_MEMORY_LIMIT: 1536m
          PROXY_MEMORY_ATTEMPTS: "3"
        run: bash scripts/build/smoke-proxy-memory.sh ./veryfront-proxy-linux-x64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          retention-days: 7

  # ============================================
  # CD: Pre-release (RC versions only)
  # Runs when deno.json version has a prerelease suffix (e.g. 0.1.14-rc)
  # Appends .{run_number} and publishes with --tag rc
  # ============================================

  # Release jobs check every dependency explicitly: a main run that reuses its
  # merge-queue run skips the test jobs upstream of the gates, and a job
  # without a status function would skip with them.
  prerelease:
    # Serialize npm publication and RC tag writes independently of dispatch.
    concurrency:
      group: veryfront-rc-publication
      queue: max
    if: ${{ !cancelled() && needs.tested-run.result == 'success' && needs.version-check.result == 'success' && needs.quality-gate-artifact.result == 'success' && needs.quality-gate-release.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.version-check.outputs.is_stable == 'false' }}
    needs: [
      ci,
      coverage,
      tests,
      tests-node,
      tests-node-sandbox,
      tests-bun,
      tests-binary-e2e,
      tests-e2e-rsc-browser,
      sonar,
      quality-gate-artifact,
      quality-gate-release,
      tested-run,
      version-check,
    ]
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    environment: production
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Require merge correctness dependencies
        env:
          # A main run that reuses its merge-queue run skips the tests that run
          # already passed on this commit; dispatch waits for the fresh main Sonar gate.
          REUSED_RUN_ID: ${{ needs.tested-run.outputs.reuse == 'true' && needs.tested-run.outputs.run_id || '' }}
          # Sonar needs SONAR_TOKEN, so fork and Dependabot PRs intentionally
          # skip it. Pushes, merge-group runs, and trusted PRs must block on it.
          SONAR_REQUIRED: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') }}
          SOURCE_CHECKS_RESULT: ${{ needs.ci.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          INTEGRATION_TESTS_RESULT: ${{ needs.tests.result }}
          NODE_RUNTIME_TESTS_RESULT: ${{ needs.tests-node.result }}
          NODE_SANDBOX_TESTS_RESULT: ${{ needs.tests-node-sandbox.result }}
          BUN_RUNTIME_TESTS_RESULT: ${{ needs.tests-bun.result }}
          BINARY_E2E_RESULT: ${{ needs.tests-binary-e2e.result }}
          RSC_BROWSER_E2E_RESULT: ${{ needs.tests-e2e-rsc-browser.result }}
        run: |
          failed=0
          for result_name in \
            SOURCE_CHECKS_RESULT \
            COVERAGE_RESULT \
            SONAR_RESULT \
            INTEGRATION_TESTS_RESULT \
            NODE_RUNTIME_TESTS_RESULT \
            NODE_SANDBOX_TESTS_RESULT \
            BUN_RUNTIME_TESTS_RESULT \
            BINARY_E2E_RESULT \
            RSC_BROWSER_E2E_RESULT
          do
            result="${!result_name}"
            if [ "$result_name" = "SONAR_RESULT" ] && [ "$SONAR_REQUIRED" != "true" ]; then
              continue
            fi
            if [ -n "$REUSED_RUN_ID" ] && [ "$result" = "skipped" ]; then
              echo "$result_name passed in merge-queue run $REUSED_RUN_ID"
              continue
            fi
            if [ "$result" != "success" ]; then
              echo "::error::$result_name finished with $result"
              failed=1
            fi
          done
          exit "$failed"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Pin npm CLI for publication
        env:
          NPM_CLI_VERSION: "11.12.1"
        run: npm install --global "npm@${NPM_CLI_VERSION}"

      - name: Compute RC version
        id: version
        env:
          BASE_VERSION: ${{ needs.version-check.outputs.version }}
          RUN_NUMBER: ${{ needs.tested-run.outputs.release_number }}
        run: |
          RC_VERSION="${BASE_VERSION}.${RUN_NUMBER}"
          echo "version=${RC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing RC: ${RC_VERSION}"

      - name: Download tested npm compatibility artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-compatibility-${{ github.sha }}
          path: dist/npm-compatibility
          run-id: ${{ needs.tested-run.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Publish tested RC npm artifact
        timeout-minutes: 10
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NPM_PACK_DIR: ${{ github.workspace }}/dist/npm-compatibility
          NPM_GIT_HEAD_WAIT_TOTAL_SECONDS: "180"
          NPM_MAINTENANCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.maintenance_release_number != '' }}
        run: |
          deno run --config=scripts/test.deno.json --frozen --allow-read --allow-write --allow-run=tar \
            scripts/ci/npm-compatibility-artifact.ts materialize dist/npm-compatibility npm
          deno run --allow-read --allow-run=npm scripts/build/report-artifact-sizes.ts --npm-package npm \
            | tee -a "$GITHUB_STEP_SUMMARY"
          publish_status=0
          timeout --signal=TERM --kill-after=10s 8m scripts/ci/publish-npm-packages.sh rc-publish || publish_status=$?
          if [[ "$publish_status" == 124 || "$publish_status" == 137 ]]; then
            echo "::error::RC npm publication exceeded its eight-minute deadline; inspect npm publish and registry metadata progress before starting another release." >&2
          fi
          exit "$publish_status"

  github-prerelease:
    name: GitHub prerelease
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.prerelease.result == 'success' && needs.build-binaries.result == 'success' }}
    needs: [prerelease, build-binaries]
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: binaries

      - name: Prepare RC checkout for SBOM
        env:
          VERSION: ${{ needs.prerelease.outputs.version }}
        run: deno run -A scripts/ci/prepare-rc-build.ts

      - name: Generate SBOM
        env:
          VERSION: ${{ needs.prerelease.outputs.version }}
        run: |
          deno task sbom:all --output-dir "dist/sbom-${VERSION}"
          deno task sbom --lock scripts/build/proxy-deno.lock --output "dist/sbom-${VERSION}/proxy.json"

      - name: Prepare public release assets
        env:
          VERSION: ${{ needs.prerelease.outputs.version }}
        run: |
          mkdir -p dist/public-release
          for file in binaries/veryfront-*/veryfront-* dist/sbom-${VERSION}/*.json; do
            [ -f "$file" ] || continue
            cp -- "$file" dist/public-release/
          done
          cp scripts/install.sh dist/public-release/

      - name: Upload public release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-release-${{ github.sha }}
          path: dist/public-release/
          if-no-files-found: error
          overwrite: true

  # ============================================
  # CD: Stable Release (clean semver only)
  # Runs when deno.json changes to X.Y.Z (no suffix), or on manual dispatch
  # Publishes with --tag latest, creates git tag, updates Homebrew
  # ============================================

  release:
    if: ${{ !cancelled() && needs.tested-run.result == 'success' && needs.version-check.result == 'success' && needs.quality-gate-artifact.result == 'success' && needs.quality-gate-release.result == 'success' && needs.build-binaries.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.version-check.outputs.is_stable == 'true' && needs.version-check.outputs.stable_release_requested == 'true' }}
    needs: [
      ci,
      coverage,
      tests,
      tests-node,
      tests-node-sandbox,
      tests-bun,
      tests-binary-e2e,
      tests-e2e-rsc-browser,
      sonar,
      quality-gate-artifact,
      quality-gate-release,
      build-binaries,
      tested-run,
      version-check,
    ]
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    environment: production
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Require merge correctness dependencies
        env:
          # A main run that reuses its merge-queue run skips the tests that run
          # already passed on this commit; Sonar still has to pass here.
          REUSED_RUN_ID: ${{ needs.tested-run.outputs.reuse == 'true' && needs.tested-run.outputs.run_id || '' }}
          # Sonar needs SONAR_TOKEN, so fork and Dependabot PRs intentionally
          # skip it. Pushes, merge-group runs, and trusted PRs must block on it.
          SONAR_REQUIRED: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') }}
          SOURCE_CHECKS_RESULT: ${{ needs.ci.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          INTEGRATION_TESTS_RESULT: ${{ needs.tests.result }}
          NODE_RUNTIME_TESTS_RESULT: ${{ needs.tests-node.result }}
          NODE_SANDBOX_TESTS_RESULT: ${{ needs.tests-node-sandbox.result }}
          BUN_RUNTIME_TESTS_RESULT: ${{ needs.tests-bun.result }}
          BINARY_E2E_RESULT: ${{ needs.tests-binary-e2e.result }}
          RSC_BROWSER_E2E_RESULT: ${{ needs.tests-e2e-rsc-browser.result }}
        run: |
          failed=0
          for result_name in \
            SOURCE_CHECKS_RESULT \
            COVERAGE_RESULT \
            SONAR_RESULT \
            INTEGRATION_TESTS_RESULT \
            NODE_RUNTIME_TESTS_RESULT \
            NODE_SANDBOX_TESTS_RESULT \
            BUN_RUNTIME_TESTS_RESULT \
            BINARY_E2E_RESULT \
            RSC_BROWSER_E2E_RESULT
          do
            result="${!result_name}"
            if [ "$result_name" = "SONAR_RESULT" ] && [ "$SONAR_REQUIRED" != "true" ]; then
              continue
            fi
            if [ -n "$REUSED_RUN_ID" ] && [ "$result_name" != "SONAR_RESULT" ] && [ "$result" = "skipped" ]; then
              echo "$result_name passed in merge-queue run $REUSED_RUN_ID"
              continue
            fi
            if [ "$result" != "success" ]; then
              echo "::error::$result_name finished with $result"
              failed=1
            fi
          done
          exit "$failed"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version
        id: version
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing stable: ${VERSION}"

      - name: Ensure stable version is unpublished
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          scripts/ci/publish-npm-packages.sh preflight
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "::error::Tag ${TAG} already exists on source repo. Bump deno.json before releasing."
            exit 1
          fi
          public_release_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "https://api.github.com/repos/veryfront/veryfront/releases/tags/${TAG}")
          case "$public_release_status" in
            200)
              echo "::error::Release ${TAG} already exists on veryfront/veryfront. Bump deno.json before releasing."
              exit 1
              ;;
            404) ;;
            *)
              echo "::error::Cannot verify public release absence (HTTP ${public_release_status})."
              exit 1
              ;;
          esac
          if GH_TOKEN="${SOURCE_REPO_TOKEN}" gh release view "${TAG}" &>/dev/null; then
            echo "::error::Release ${TAG} already exists on source repo. Bump deno.json before releasing."
            exit 1
          fi

      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Pin npm CLI for publication
        env:
          NPM_CLI_VERSION: "11.12.1"
        run: npm install --global "npm@${NPM_CLI_VERSION}"

      - name: Download tested npm compatibility artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-compatibility-${{ github.sha }}
          path: dist/npm-compatibility
          run-id: ${{ needs.tested-run.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Publish tested stable npm artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NPM_PACK_DIR: ${{ github.workspace }}/dist/npm-compatibility
        run: |
          deno run --config=scripts/test.deno.json --frozen --allow-read --allow-write --allow-run=tar \
            scripts/ci/npm-compatibility-artifact.ts materialize dist/npm-compatibility npm
          deno run --allow-read --allow-run=npm scripts/build/report-artifact-sizes.ts --npm-package npm \
            | tee -a "$GITHUB_STEP_SUMMARY"
          scripts/ci/publish-npm-packages.sh release-publish

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: binaries

      - name: Generate SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          deno task sbom:all --output-dir "dist/sbom-${VERSION}"
          deno task sbom --lock scripts/build/proxy-deno.lock --output "dist/sbom-${VERSION}/proxy.json"

      - name: Create git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION}"
          git tag "${TAG}"
          # Checkout does not persist credentials; authenticate only this push.
          git push "https://x-access-token:${SOURCE_REPO_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${TAG}"
          echo "Created tag ${TAG}"

      - name: Prepare public release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/public-release
          for file in binaries/veryfront-*/veryfront-* dist/sbom-${VERSION}/*.json; do
            [ -f "$file" ] || continue
            cp -- "$file" dist/public-release/
          done
          cp scripts/install.sh dist/public-release/
          cp scripts/install.ps1 dist/public-release/
          (cd dist/public-release && sha256sum veryfront-* install.sh install.ps1 > SHA256SUMS)

      - name: Upload public release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-release-${{ github.sha }}
          path: dist/public-release/
          if-no-files-found: error
          overwrite: true

  # App keys belong only on fresh runners that execute fixed workflow code.
  # Downloaded publication assets are data and must never be executed.
  publish-public-release:
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && ((needs.version-check.outputs.is_stable == 'false' && needs.prerelease.result == 'success' && needs.github-prerelease.result == 'success') || (needs.version-check.outputs.is_stable == 'true' && needs.release.result == 'success')) }}
    needs: [prerelease, github-prerelease, release, version-check]
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    environment: production
    permissions:
      contents: write
    steps:
      - name: Resolve published version
        id: version
        env:
          IS_STABLE: ${{ needs.version-check.outputs.is_stable }}
          RC_VERSION: ${{ needs.prerelease.outputs.version }}
          STABLE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          case "$IS_STABLE" in
            true) version="$STABLE_VERSION" ;;
            false) version="$RC_VERSION" ;;
            *) exit 1 ;;
          esac
          [ -n "$version" ]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download public release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: public-release-${{ github.sha }}
          path: public-release-assets

      - name: Create release GitHub App token
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.VERYFRONT_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.VERYFRONT_RELEASE_APP_PRIVATE_KEY }}
          owner: veryfront
          repositories: |
            veryfront
          permission-contents: write

      - name: Create GitHub releases
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IS_STABLE: ${{ needs.version-check.outputs.is_stable }}
          MAINTENANCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.maintenance_release_number != '' }}
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: |
          # Fixed workflow implementation, kept in parity with the tested helper.
          # Never source or execute a file from the publication artifact.
          publish_github_release() {
            set -euo pipefail

            usage() {
              echo "Usage: $0 --repo <owner/repo> --tag <tag> --title <title> --notes <notes> [--prerelease] [--latest] -- <asset>..." >&2
            }

            require_value() {
              local option="$1"
              local value="${2:-}"
              if [[ -z "$value" ]]; then
                echo "::error::${option} requires a value." >&2
                usage
                exit 2
              fi
            }

            repo=""
            tag=""
            title=""
            notes=""
            prerelease=false
            latest=false

            while [[ "$#" -gt 0 ]]; do
              case "$1" in
                --repo)
                  require_value "$1" "${2:-}"
                  repo="$2"
                  shift 2
                  ;;
                --tag)
                  require_value "$1" "${2:-}"
                  tag="$2"
                  shift 2
                  ;;
                --title)
                  require_value "$1" "${2:-}"
                  title="$2"
                  shift 2
                  ;;
                --notes)
                  require_value "$1" "${2:-}"
                  notes="$2"
                  shift 2
                  ;;
                --prerelease)
                  prerelease=true
                  shift
                  ;;
                --latest)
                  latest=true
                  shift
                  ;;
                --)
                  shift
                  break
                  ;;
                *)
                  echo "::error::Unknown option: $1" >&2
                  usage
                  exit 2
                  ;;
              esac
            done

            require_value "--repo" "$repo"
            require_value "--tag" "$tag"
            require_value "--title" "$title"
            require_value "--notes" "$notes"

            if [[ "$prerelease" == true && "$latest" == true ]]; then
              echo "::error::A release cannot be both a prerelease and the latest release." >&2
              exit 2
            fi

            assets=("$@")
            if [[ "${#assets[@]}" -eq 0 ]]; then
              echo "::error::At least one release asset is required." >&2
              exit 2
            fi
            for asset in "${assets[@]}"; do
              if [[ ! -f "$asset" ]]; then
                echo "::error::Release asset does not exist: $asset" >&2
                exit 2
              fi
            done

            retry_attempts="${GH_RELEASE_RETRY_ATTEMPTS:-3}"
            retry_delay_seconds="${GH_RELEASE_RETRY_DELAY_SECONDS:-10}"
            retry_fatal_status=64
            if ! [[ "$retry_attempts" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::GH_RELEASE_RETRY_ATTEMPTS must be a positive integer." >&2
              exit 2
            fi
            if ! [[ "$retry_delay_seconds" =~ ^[0-9]+$ ]]; then
              echo "::error::GH_RELEASE_RETRY_DELAY_SECONDS must be a non-negative integer." >&2
              exit 2
            fi

            run_with_retry() {
              local description="$1"
              shift
              local fatal_status=""
              if [[ "${1:-}" == "--fatal-status" ]]; then
                fatal_status="$2"
                shift 2
              fi
              local attempt=1
              local status

              while true; do
                if "$@"; then
                  return 0
                else
                  status="$?"
                fi
                if [[ -n "$fatal_status" && "$status" -eq "$fatal_status" ]]; then
                  return 1
                fi
                if [[ "$attempt" -ge "$retry_attempts" ]]; then
                  echo "::error::${description} failed after ${retry_attempts} attempts." >&2
                  return 1
                fi

                echo "::warning::${description} failed on attempt ${attempt}/${retry_attempts}. Retrying." >&2
                if [[ "$retry_delay_seconds" -gt 0 ]]; then
                  sleep "$((retry_delay_seconds * attempt))"
                fi
                attempt=$((attempt + 1))
              done
            }

            delete_release() {
              gh release delete "$tag" --repo "$repo" --yes --cleanup-tag >/dev/null 2>&1 || true
            }

            create_draft_release() {
              local existing_is_draft
              if existing_is_draft="$(
                gh release view "$tag" --repo "$repo" --json isDraft --jq '.isDraft' 2>/dev/null
              )"; then
                if [[ "$existing_is_draft" == true ]]; then
                  echo "::warning::Reusing existing GitHub release draft ${tag}." >&2
                  return 0
                fi

                echo "::error::GitHub release ${tag} already exists and is not a draft." >&2
                return "$retry_fatal_status"
              fi

              local create_args=(
                release create "$tag"
                --repo "$repo"
                --title "$title"
                --draft
                --notes "$notes"
              )
              if [[ "$prerelease" == true ]]; then
                create_args+=(--prerelease)
              fi

              gh "${create_args[@]}"
            }

            incomplete_draft_created=false
            cleanup_failed_release() {
              local status="$?"
              trap - EXIT
              if [[ "$status" -ne 0 && "$incomplete_draft_created" == true ]]; then
                echo "::warning::Removing incomplete GitHub release ${tag}." >&2
                delete_release
              fi
              exit "$status"
            }
            trap cleanup_failed_release EXIT

            run_with_retry \
              "GitHub release draft creation" \
              --fatal-status "$retry_fatal_status" \
              create_draft_release
            incomplete_draft_created=true

            # Start long transfers first so metadata cannot delay their worker allocation.
            asset_sizes=()
            for asset in "${assets[@]}"; do
              asset_size=$(wc -c < "$asset")
              asset_sizes+=("$asset_size")
            done
            for ((asset_index = 1; asset_index < ${#assets[@]}; asset_index++)); do
              asset="${assets[$asset_index]}"
              asset_size="${asset_sizes[$asset_index]}"
              position="$asset_index"
              while ((position > 0)) && ((asset_size > asset_sizes[position - 1])); do
                assets[$position]="${assets[$((position - 1))]}"
                asset_sizes[$position]="${asset_sizes[$((position - 1))]}"
                position=$((position - 1))
              done
              assets[$position]="$asset"
              asset_sizes[$position]="$asset_size"
            done

            # GitHub CLI uploads the complete asset batch with five concurrent workers.
            run_with_retry \
              "GitHub release assets upload" \
              gh release upload "$tag" "${assets[@]}" --repo "$repo" --clobber
            incomplete_draft_created=false

            publish_args=(release edit "$tag" --repo "$repo" --draft=false)
            if [[ "$prerelease" == true ]]; then
              publish_args+=(--prerelease --latest=false)
            elif [[ "$latest" == true ]]; then
              publish_args+=(--prerelease=false --latest)
            fi
            run_with_retry "GitHub release publication" gh "${publish_args[@]}"

            trap - EXIT
          }
          assets=(public-release-assets/*)
          if [ "$IS_STABLE" = true ]; then
            notes='## Install

          ```bash
          # macOS/Linux
          curl -fsSL https://veryfront.com/install.sh | sh

          # npm
          npm install -g veryfront
          ```'
            mode=--latest
          else
            install_target="veryfront@rc"
            if [[ "${MAINTENANCE_RELEASE}" == "true" ]]; then
              install_target="veryfront@${VERSION}"
            fi
            notes='```bash
          npx '"${install_target}"'
          ```'
            mode=--prerelease
          fi
          publish_github_release --repo veryfront/veryfront \
            --tag "v${VERSION}" --title "v${VERSION}" --notes "$notes" \
            "$mode" -- "${assets[@]}"

      - name: Create source repo release
        if: ${{ needs.version-check.outputs.is_stable == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            --notes "Binaries available at: https://github.com/veryfront/veryfront/releases/tag/v${VERSION}"

  registry-validation-rc:
    name: registry validation (RC)
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.version-check.result == 'success' && needs.version-check.outputs.is_stable == 'false' }}
    needs: [prerelease, version-check]
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    permissions:
      contents: read
    timeout-minutes: 65
    steps:
      - name: Report selected release result
        env:
          IS_STABLE: ${{ needs.version-check.outputs.is_stable }}
          PRERELEASE_RESULT: ${{ needs.prerelease.result }}
          STABLE_RELEASE_RESULT: skipped
        run: |
          if [ "$IS_STABLE" = "true" ]; then
            selected_result_name="STABLE_RELEASE_RESULT"
          else
            selected_result_name="PRERELEASE_RESULT"
          fi
          selected_result="${!selected_result_name}"
          if [ "$selected_result" != "success" ]; then
            echo "::warning::REGISTRY RELEASE NON-SUCCESS [configuration]: $selected_result_name finished with $selected_result. Registry validation will continue, but downstream release dispatch remains blocked." >&2
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build registry validation image
        timeout-minutes: 5
        env:
          REGISTRY_IMAGE: veryfront-registry-validation:${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          build_context="$(mktemp -d)"
          cleanup() {
            rm -rf "$build_context"
          }
          trap cleanup EXIT INT TERM
          cat > "$build_context/Dockerfile" <<'DOCKERFILE'
          FROM node:24-bookworm-slim@sha256:5cbc7caba8c2c0f0bca675d1b61b9f2857e1cf1853c6164ee9dd409501a936e7
          RUN apt-get update \
            && apt-get install -y --no-install-recommends ca-certificates curl jq unzip \
            && rm -rf /var/lib/apt/lists/*
          RUN curl --fail --location --silent --show-error \
                https://github.com/denoland/deno/releases/download/v2.7.7/deno-x86_64-unknown-linux-gnu.zip \
                --output /tmp/deno.zip \
            && echo '0cd918870657ccc3d96ac682290e894dda374e2a742424aae9118b258a6cf7a3  /tmp/deno.zip' \
                | sha256sum --check --strict \
            && unzip -q /tmp/deno.zip -d /usr/local/bin \
            && chmod 0755 /usr/local/bin/deno \
            && /usr/local/bin/deno --version \
            && rm /tmp/deno.zip
          RUN mkdir /registry && chown 1000:1000 /registry
          WORKDIR /registry
          DOCKERFILE
          docker build --platform linux/amd64 --tag "$REGISTRY_IMAGE" "$build_context"
      - name: Validate exact registry release
        env:
          REGISTRY_IMAGE: veryfront-registry-validation:${{ github.run_id }}-${{ github.run_attempt }}
          RC_VERSION: ${{ needs.prerelease.outputs.version }}
          STABLE_VERSION: ""
          GITHUB_SHA: ${{ github.sha }}
          IS_STABLE: ${{ needs.version-check.outputs.is_stable }}
        run: |
          set -euo pipefail
          container_name="veryfront-registry-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM
          docker run --rm --init \
            --platform linux/amd64 \
            --name "$container_name" \
            --user 1000:1000 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges=true \
            --network=bridge \
            --volume /registry \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/source,readonly" \
            --env RC_VERSION \
            --env STABLE_VERSION \
            --env GITHUB_SHA \
            --env IS_STABLE \
            --env HOME=/registry/home \
            --env DENO_DIR=/registry/deno-cache \
            --env TMPDIR=/registry/tmp \
            --env npm_config_cache=/registry/npm-cache \
            --env CI=true \
            "$REGISTRY_IMAGE" \
            bash -euo pipefail -c 'mkdir -p /registry/home /registry/deno-cache /registry/tmp /registry/npm-cache /registry/workspace
          tar -C /source --exclude=.git --exclude=node_modules --no-same-owner -cf - . | tar -C /registry/workspace --no-same-owner -xf -
          cd /registry/workspace
          bash scripts/ci/registry-release-smoke.sh'

  quality-gate-registry:
    # Serialize dispatches; the current RC tag check rejects superseded releases.
    concurrency:
      group: veryfront-rc-dispatch
      queue: max
    name: quality gate (registry)
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.version-check.result == 'success' && (needs.version-check.outputs.is_stable == 'false' || needs.version-check.outputs.stable_release_requested == 'true') }}
    needs: [
      sonar-quality-gate,
      prerelease,
      github-prerelease,
      registry-validation-rc,
      release,
      publish-public-release,
      version-check,
    ]
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    environment: production
    timeout-minutes: 65
    steps:
      - name: Require fresh Sonar quality gate
        env:
          SONAR_RESULT: ${{ needs.sonar-quality-gate.result }}
        run: |
          if [ "$SONAR_RESULT" != "success" ]; then
            echo "::error::Fresh SonarQube Cloud quality gate finished with $SONAR_RESULT"
            exit 1
          fi
      - name: Report selected release result
        env:
          IS_STABLE: ${{ needs.version-check.outputs.is_stable }}
          PRERELEASE_RESULT: ${{ needs.prerelease.result }}
          STABLE_RELEASE_RESULT: ${{ needs.release.result }}
          PUBLIC_RELEASE_RESULT: ${{ needs.publish-public-release.result }}
        run: |
          if [ "$IS_STABLE" = "true" ]; then
            selected_result_name="STABLE_RELEASE_RESULT"
          else
            selected_result_name="PRERELEASE_RESULT"
          fi
          selected_result="${!selected_result_name}"
          if [ "$selected_result" != "success" ]; then
            echo "::warning::REGISTRY RELEASE NON-SUCCESS [configuration]: $selected_result_name finished with $selected_result. Registry validation will continue, but downstream release dispatch remains blocked." >&2
          fi
      - name: Require RC release dependencies
        if: ${{ needs.version-check.outputs.is_stable == 'false' }}
        env:
          PRERELEASE_RESULT: ${{ needs.prerelease.result }}
          ASSETS_RESULT: ${{ needs.github-prerelease.result }}
          PUBLIC_RELEASE_RESULT: ${{ needs.publish-public-release.result }}
          REGISTRY_RESULT: ${{ needs.registry-validation-rc.result }}
        run: |
          failed=0
          for result_name in PRERELEASE_RESULT ASSETS_RESULT PUBLIC_RELEASE_RESULT REGISTRY_RESULT; do
            result="${!result_name}"
            if [ "$result" != "success" ]; then
              echo "::error::$result_name finished with $result"
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.version-check.outputs.is_stable == 'true' }}
        with:
          persist-credentials: false
      - name: Build registry validation image
        if: ${{ needs.version-check.outputs.is_stable == 'true' }}
        timeout-minutes: 5
        env:
          REGISTRY_IMAGE: veryfront-registry-validation:${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          build_context="$(mktemp -d)"
          cleanup() {
            rm -rf "$build_context"
          }
          trap cleanup EXIT INT TERM
          cat > "$build_context/Dockerfile" <<'DOCKERFILE'
          FROM node:24-bookworm-slim@sha256:5cbc7caba8c2c0f0bca675d1b61b9f2857e1cf1853c6164ee9dd409501a936e7
          RUN apt-get update \
            && apt-get install -y --no-install-recommends ca-certificates curl jq unzip \
            && rm -rf /var/lib/apt/lists/*
          RUN curl --fail --location --silent --show-error \
                https://github.com/denoland/deno/releases/download/v2.7.7/deno-x86_64-unknown-linux-gnu.zip \
                --output /tmp/deno.zip \
            && echo '0cd918870657ccc3d96ac682290e894dda374e2a742424aae9118b258a6cf7a3  /tmp/deno.zip' \
                | sha256sum --check --strict \
            && unzip -q /tmp/deno.zip -d /usr/local/bin \
            && chmod 0755 /usr/local/bin/deno \
            && /usr/local/bin/deno --version \
            && rm /tmp/deno.zip
          RUN mkdir /registry && chown 1000:1000 /registry
          WORKDIR /registry
          DOCKERFILE
          docker build --platform linux/amd64 --tag "$REGISTRY_IMAGE" "$build_context"
      - name: Validate exact registry release
        if: ${{ needs.version-check.outputs.is_stable == 'true' }}
        env:
          REGISTRY_IMAGE: veryfront-registry-validation:${{ github.run_id }}-${{ github.run_attempt }}
          RC_VERSION: ${{ needs.prerelease.outputs.version }}
          STABLE_VERSION: ${{ needs.release.outputs.version }}
          GITHUB_SHA: ${{ github.sha }}
          IS_STABLE: ${{ needs.version-check.outputs.is_stable }}
        run: |
          set -euo pipefail
          container_name="veryfront-registry-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM
          docker run --rm --init \
            --platform linux/amd64 \
            --name "$container_name" \
            --user 1000:1000 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges=true \
            --network=bridge \
            --volume /registry \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/source,readonly" \
            --env RC_VERSION \
            --env STABLE_VERSION \
            --env GITHUB_SHA \
            --env IS_STABLE \
            --env HOME=/registry/home \
            --env DENO_DIR=/registry/deno-cache \
            --env TMPDIR=/registry/tmp \
            --env npm_config_cache=/registry/npm-cache \
            --env CI=true \
            "$REGISTRY_IMAGE" \
            bash -euo pipefail -c 'mkdir -p /registry/home /registry/deno-cache /registry/tmp /registry/npm-cache /registry/workspace
          tar -C /source --exclude=.git --exclude=node_modules --no-same-owner -cf - . | tar -C /registry/workspace --no-same-owner -xf -
          cd /registry/workspace
          bash scripts/ci/registry-release-smoke.sh'

      - name: Resolve published version
        if: ${{ success() && needs.publish-public-release.result == 'success' && ((needs.version-check.outputs.is_stable == 'true' && needs.release.result == 'success') || (needs.version-check.outputs.is_stable == 'false' && needs.prerelease.result == 'success' && needs.github-prerelease.result == 'success' && needs.registry-validation-rc.result == 'success')) }}
        timeout-minutes: 5
        id: version
        env:
          IS_STABLE: ${{ needs.version-check.outputs.is_stable }}
          RC_VERSION: ${{ needs.prerelease.outputs.version }}
          STABLE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          case "$IS_STABLE" in
            true) version="$STABLE_VERSION" ;;
            false) version="$RC_VERSION" ;;
            *)
              echo "::error::Unsupported release stability value: $IS_STABLE"
              exit 1
              ;;
          esac
          if [ -z "$version" ]; then
            echo "::error::Selected published version is empty"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check current RC tag
        if: ${{ success() && needs.publish-public-release.result == 'success' && ((needs.version-check.outputs.is_stable == 'true' && needs.release.result == 'success') || (needs.version-check.outputs.is_stable == 'false' && needs.prerelease.result == 'success' && needs.github-prerelease.result == 'success' && needs.registry-validation-rc.result == 'success')) }}
        timeout-minutes: 5
        id: current
        env:
          IS_STABLE: ${{ needs.version-check.outputs.is_stable }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$IS_STABLE" = true ]; then
            dispatch=true
          else
            # This App-key runner executes only fixed workflow logic. Keep the
            # comparator in parity with the publisher through the workflow test.
            tags="$(curl --fail --silent --show-error --max-time 60 --retry 0 \
              --header 'Cache-Control: no-cache' \
              https://registry.npmjs.org/-/package/veryfront/dist-tags)"
            current_rc="$(printf '%s\n' "$tags" | jq -er '
              if type == "object" and (.rc | type == "string" and length > 0)
              then .rc else error("Published RC tag is missing or invalid") end
            ')"
            dispatch="$(jq -ner --arg candidate "$VERSION" --arg current "${current_rc}" --arg mode dispatch '
              # Compare integer components by digit count then digits, without losing
              # precision or sorting 10 before 9. Reject unexpected tag formats.
              def rc_key:
                capture("^(?<major>0|[1-9][0-9]*)\\.(?<minor>0|[1-9][0-9]*)\\.(?<patch>0|[1-9][0-9]*)-(?<pre>[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)$") as $version
                | ([$version.major, $version.minor, $version.patch] | map([length, .]))
                  + [($version.pre | split(".") | map(
                      if test("^[0-9]+$") then
                        if test("^(0|[1-9][0-9]*)$") then [0, length, .]
                        else error("Numeric prerelease identifiers cannot have leading zeroes") end
                      else [1, .] end
                    ))];
              ($candidate | rc_key) as $next
              | if $mode == "dispatch" then
                  if $current == $candidate then "true"
                  elif $current != "" and ($current | rc_key) > $next then "false"
                  else error("Published RC tag does not match the dispatch candidate") end
                elif $current == "" then "rc"
                elif ($current | rc_key) > $next then "rc-history"
                else "rc" end
            ')"
          fi
          if [ "$dispatch" = true ]; then
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
          else
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping superseded RC dispatch for ${VERSION}"
          fi

      - name: Build dispatch payload
        if: ${{ success() && needs.publish-public-release.result == 'success' && ((needs.version-check.outputs.is_stable == 'true' && needs.release.result == 'success') || (needs.version-check.outputs.is_stable == 'false' && needs.prerelease.result == 'success' && needs.github-prerelease.result == 'success' && needs.registry-validation-rc.result == 'success')) }}
        timeout-minutes: 5
        id: payload
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          payload=$(jq -cn --arg version "$VERSION" '{version: $version}')
          echo "payload=$payload" >> "$GITHUB_OUTPUT"

      - name: Create release GitHub App token
        if: ${{ success() && needs.publish-public-release.result == 'success' && ((needs.version-check.outputs.is_stable == 'true' && needs.release.result == 'success') || (needs.version-check.outputs.is_stable == 'false' && needs.prerelease.result == 'success' && needs.github-prerelease.result == 'success' && needs.registry-validation-rc.result == 'success')) && steps.current.outputs.dispatch == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.maintenance_release_number != '') }}
        timeout-minutes: 5
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.VERYFRONT_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.VERYFRONT_RELEASE_APP_PRIVATE_KEY }}
          owner: veryfront
          repositories: |
            veryfront-server
            veryfront-job-runner
            veryfront-sandbox
          permission-contents: write

      - name: Trigger server deploy
        if: ${{ success() && needs.publish-public-release.result == 'success' && ((needs.version-check.outputs.is_stable == 'true' && needs.release.result == 'success') || (needs.version-check.outputs.is_stable == 'false' && needs.prerelease.result == 'success' && needs.github-prerelease.result == 'success' && needs.registry-validation-rc.result == 'success')) && steps.current.outputs.dispatch == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.maintenance_release_number != '') }}
        timeout-minutes: 5
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.release-app-token.outputs.token }}
          repository: veryfront/veryfront-server
          event-type: veryfront-code-released
          client-payload: ${{ steps.payload.outputs.payload }}

      - name: Trigger job-runner deploy
        if: ${{ success() && needs.publish-public-release.result == 'success' && ((needs.version-check.outputs.is_stable == 'true' && needs.release.result == 'success') || (needs.version-check.outputs.is_stable == 'false' && needs.prerelease.result == 'success' && needs.github-prerelease.result == 'success' && needs.registry-validation-rc.result == 'success')) && steps.current.outputs.dispatch == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.maintenance_release_number != '') }}
        timeout-minutes: 5
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.release-app-token.outputs.token }}
          repository: veryfront/veryfront-job-runner
          event-type: veryfront-code-released
          client-payload: ${{ steps.payload.outputs.payload }}

      - name: Trigger sandbox deploy
        if: ${{ success() && needs.publish-public-release.result == 'success' && ((needs.version-check.outputs.is_stable == 'true' && needs.release.result == 'success') || (needs.version-check.outputs.is_stable == 'false' && needs.prerelease.result == 'success' && needs.github-prerelease.result == 'success' && needs.registry-validation-rc.result == 'success')) && steps.current.outputs.dispatch == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.maintenance_release_number != '') }}
        timeout-minutes: 5
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.release-app-token.outputs.token }}
          repository: veryfront/veryfront-sandbox
          event-type: veryfront-code-released
          client-payload: ${{ steps.payload.outputs.payload }}

  # ============================================
  # CD: Update Homebrew (stable releases only)
  # ============================================

  update-homebrew:
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.publish-public-release.result == 'success' && needs.version-check.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [release, publish-public-release, version-check]
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create Homebrew tap GitHub App token
        id: homebrew-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HOMEBREW_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: veryfront
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - name: Update Homebrew tap
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          HOMEBREW_TAP_TOKEN: ${{ steps.homebrew-app-token.outputs.token }}
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            set -euo pipefail

            VERSION="${{ needs.version-check.outputs.version }}"

            # Download binaries and calculate checksums
            declare -A SHAS
            for binary in veryfront-macos-arm64 veryfront-macos-x64 veryfront-linux-arm64 veryfront-linux-x64; do
              curl -fsSL "https://github.com/veryfront/veryfront/releases/download/v${VERSION}/${binary}" -o "${binary}"
              SHAS[$binary]=$(sha256sum "${binary}" | cut -d' ' -f1)
            done

            # Generate formula from template
            FORMULA=$(cat homebrew/veryfront.rb)
            FORMULA="${FORMULA//VERSION_PLACEHOLDER/$VERSION}"
            FORMULA="${FORMULA//SHA256_MACOS_ARM64_PLACEHOLDER/${SHAS[veryfront-macos-arm64]}}"
            FORMULA="${FORMULA//SHA256_MACOS_X64_PLACEHOLDER/${SHAS[veryfront-macos-x64]}}"
            FORMULA="${FORMULA//SHA256_LINUX_ARM64_PLACEHOLDER/${SHAS[veryfront-linux-arm64]}}"
            FORMULA="${FORMULA//SHA256_LINUX_X64_PLACEHOLDER/${SHAS[veryfront-linux-x64]}}"

            # Create PR against tap repo (branch protection requires PRs)
            rm -rf tap
            git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/veryfront/homebrew-tap.git" tap
            mkdir -p tap/Formula
            echo "$FORMULA" > tap/Formula/veryfront.rb
            cd tap
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add Formula/veryfront.rb
            git diff --cached --quiet && echo "No changes to commit" && exit 0

            BRANCH="update-veryfront-v${VERSION}"
            git checkout -b "${BRANCH}"
            git commit -m "Update veryfront to v${VERSION}"
            git push -u origin "${BRANCH}" || git push -u origin "${BRANCH}" --force-with-lease

            export GH_TOKEN="${HOMEBREW_TAP_TOKEN}"
            PR_NUMBER=$(gh api repos/veryfront/homebrew-tap/pulls \
              --method GET \
              -f state=open \
              -f head="veryfront:${BRANCH}" \
              -f base=main \
              --jq '.[0].number // empty')

            if [ -z "${PR_NUMBER}" ]; then
              CREATE_PR_OUTPUT=$(gh pr create \
                --repo veryfront/homebrew-tap \
                --title "Update veryfront to v${VERSION}" \
                --base main \
                --head "${BRANCH}" \
                --body "Automated update from CI - veryfront v${VERSION}" 2>&1) || {
                  if echo "${CREATE_PR_OUTPUT}" | grep -Eq "Resource not accessible by (integration|personal access token)"; then
                    echo "::error::Homebrew tap update requires a GitHub App token with Pull requests: write and Contents: write on veryfront/homebrew-tap."
                  fi
                  echo "${CREATE_PR_OUTPUT}"
                  exit 1
                }

              PR_URL=$(printf '%s\n' "${CREATE_PR_OUTPUT}" | tail -n 1)
              PR_NUMBER="${PR_URL##*/}"
              if ! [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
                echo "::error::Created Homebrew tap PR but could not read its number."
                echo "${CREATE_PR_OUTPUT}"
                exit 1
              fi
            fi

            # GitHub can report mergeability as unknown immediately after PR creation or a force-push.
            MERGEABLE=""
            MERGEABLE_STATE=""
            for attempt in {1..24}; do
              PR_JSON=$(gh pr view "${PR_NUMBER}" \
                --repo veryfront/homebrew-tap \
                --json mergeable,mergeStateStatus)
              MERGEABLE=$(echo "${PR_JSON}" | jq -r '.mergeable')
              MERGEABLE_STATE=$(echo "${PR_JSON}" | jq -r '.mergeStateStatus')

              if [ "${MERGEABLE}" = "MERGEABLE" ] && [ "${MERGEABLE_STATE}" = "CLEAN" ]; then
                break
              fi

              if [ "${MERGEABLE}" = "CONFLICTING" ]; then
                echo "::error::Homebrew tap PR #${PR_NUMBER} is not mergeable (state=${MERGEABLE_STATE})."
                exit 1
              fi

              sleep 5
            done

            if [ "${MERGEABLE}" != "MERGEABLE" ] || [ "${MERGEABLE_STATE}" != "CLEAN" ]; then
              echo "::error::Timed out waiting for Homebrew tap PR #${PR_NUMBER} to become mergeable (mergeable=${MERGEABLE}, state=${MERGEABLE_STATE})."
              exit 1
            fi

            gh pr merge "${PR_NUMBER}" \
              --repo veryfront/homebrew-tap \
              --merge
