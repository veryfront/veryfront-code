    uses: veryfront/veryfront-code/.github/workflows/cancel-failed-merge-group.yml@03903775fbf92852f23cccc1ba6243192042ff64

  cancel-after-tests-npm-install-smoke:
    needs: [tests-npm-install-smoke]
    if: ${{ failure() && github.event_name == 'merge_group' }}
    permissions:
      actions: write
    uses: veryfront/veryfront-code/.github/workflows/cancel-failed-merge-group.yml@03903775fbf92852f23cccc1ba6243192042ff64

  cancel-after-tests-runtime-critical-flow:
    needs: [tests-runtime-critical-flow]
    if: ${{ failure() && github.event_name == 'merge_group' }}
    permissions:
      actions: write
    uses: veryfront/veryfront-code/.github/workflows/cancel-failed-merge-group.yml@03903775fbf92852f23cccc1ba6243192042ff64

  cancel-after-sonar:
