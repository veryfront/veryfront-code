name: CI/CD

on:
  workflow_dispatch:
  pull_request:
  # Required for merge-queue entries: queued runs report checks via merge_group.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Cancel only superseded first-attempt pull_request runs. Everything else
  # gets a run-unique group: a non-PR run must never be cancelled (a main push
  # can be mid-publish) nor replaced while pending, since GitHub keeps one
  # pending run per group, and a manual rerun of an older attempt keeps its
  # ref and must not cancel the current head's run. The contract is pinned by
  # tests/integration/ci/workflow-concurrency.test.ts. See veryfront-studio#5544.
  group: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('{0}-{1}', github.workflow, github.ref) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================
  # CI: Quality Checks
  # ============================================
  ci:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [test-layout, format, lint, typecheck]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure test migration baselines
        if: ${{ matrix.check == 'test-layout' || matrix.check == 'lint' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          case "$EVENT_NAME" in
            pull_request) fetch_ref="$PR_BASE_SHA"; base="$PR_BASE_SHA" ;;
            merge_group) fetch_ref="$MERGE_GROUP_BASE_SHA"; base="$MERGE_GROUP_BASE_SHA" ;;
            push) fetch_ref="$PUSH_BASE_SHA"; base="$PUSH_BASE_SHA" ;;
            *) fetch_ref="main"; base="origin/main" ;;
          esac

          if [ -z "$base" ] || printf '%s' "$base" | grep -Eq '^0+$'; then
            fetch_ref="main"
            base="origin/main"
          fi
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            if [ "$base" = "origin/main" ]; then
              git fetch --no-tags --unshallow origin "main:refs/remotes/origin/main"
            else
              git fetch --no-tags --unshallow origin "$fetch_ref"
            fi
          elif [ "$base" = "origin/main" ]; then
            git fetch --no-tags --depth=1 origin "main:refs/remotes/origin/main"
          else
            git fetch --no-tags --depth=1 origin "$fetch_ref"
          fi

          echo "TEST_LAYOUT_MIGRATION_BASE_REF=$base" >> "$GITHUB_ENV"
          echo "TEST_SEMANTIC_AUDIT_BASE_REF=$base" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
      - name: Run ${{ matrix.check }}
        run: |
          case "${{ matrix.check }}" in
            test-layout) deno task test:layout ;;
            format) deno task fmt:check ;;
            # The chain lives in the lint:ci task so a contributor can run this
            # shard locally instead of learning what it covers from a red CI run.
            lint) deno task lint:ci ;;
            typecheck) deno task typecheck ;;
          esac

  # ============================================
  # CI: Tests
  # ============================================

  tests:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: tests (integration)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 10
        with:
          warm-cache: "true"
          warm-redis-cache: "true"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Node resolver test dependencies
        run: |
          npm ci --ignore-scripts --prefix tests/node/resolver-dependencies
          mkdir -p node_modules npm/node_modules
          cp -R tests/node/resolver-dependencies/node_modules/. npm/node_modules/
      - name: Run Node cache-link compatibility tests
        run: node ./tests/node/run-tests.mjs 'src/utils/cache-dir.test.ts'
      # The pinned egress transport is Node/Bun-only, so the Deno lanes skip its
      # tests entirely. Without this step nothing in CI exercises it, which is
      # how it shipped omitting the request headers `fetch` normally supplies.
      - name: Run Node egress transport tests
        run: node ./tests/node/run-tests.mjs 'src/platform/compat/http/pinned-fetch.test.ts'
      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: VF_DISABLE_LRU_INTERVAL=1 deno task test:integration --no-lock
      - name: Run CLI integration tests
        run: deno task test:integration:cli --no-lock

  tests-node:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [npm-compatibility-artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: "tests (node shard ${{ matrix.shard }}/2)"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
        with:
          warm-cache: "true"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: ./.github/actions/restore-npm-workspace
      - name: Run Node runtime shard
        env:
          VF_TEST_SHARD: ${{ matrix.shard }}/2
        run: node ./tests/node/run-tests.mjs --suite=runtime:node

  # Sandbox worker generation and prepared-module encoding on the minimum
  # supported Node. Only Node 22/24 lack the Uint8Array proposal methods
  # (toHex/toBase64) whose use shipped the #732 defect class; the full node
  # suite above covers Node 24, this leg pins the floor
  # (veryfront-issue-inbox#751).
  tests-node-sandbox:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [npm-compatibility-artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: tests (node sandbox, minimum Node)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
        with:
          warm-cache: "true"
      - name: Read minimum supported Node version
        id: node-version
        run: |
          deno eval '
            import { MINIMUM_NODE_VERSION } from "./scripts/build/runtime-support.ts";
            console.log(`version=${MINIMUM_NODE_VERSION}`);
          ' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          package-manager-cache: false
      - uses: ./.github/actions/restore-npm-workspace
      - name: Run sandbox worker tests
        run: node ./tests/node/run-tests.mjs --suite=runtime:node 'src/security/sandbox/'

  tests-bun:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [npm-compatibility-artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: tests (bun)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
        with:
          warm-cache: "true"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.6"
      - uses: ./.github/actions/restore-npm-workspace
      - name: Run Bun runtime suite
        run: node --test tests/bun/runner-args.test.mjs tests/bun/workspace-packages.test.mjs && node ./tests/bun/run-tests.mjs --suite=runtime:bun

  npm-compatibility-artifact:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: npm compatibility artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
        with:
          warm-cache: "true"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Build and pack tested npm output
        run: |
          BASE_VERSION=$(jq -r '.version' deno.json)
          if [ "${GITHUB_REF}" = "refs/heads/main" ] && [[ ! "${BASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            export VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
            deno run -A scripts/ci/prepare-rc-build.ts
          fi
          deno task build:npm
          deno run --config=scripts/test.deno.json --frozen --allow-read --allow-write --allow-run=npm,tar \
            scripts/ci/npm-compatibility-artifact.ts pack npm dist/npm-compatibility "${GITHUB_SHA}"
      - name: Archive npm runtime workspace
        run: tar -cf - npm | gzip -1 > dist/npm-runtime-workspace.tar.gz
      - name: Upload tested npm compatibility artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-compatibility-${{ github.sha }}
          path: dist/npm-compatibility
          retention-days: 30
          overwrite: true
      - name: Upload npm runtime workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-runtime-workspace-${{ github.sha }}
          path: dist/npm-runtime-workspace.tar.gz
          retention-days: 1
          compression-level: 0
          overwrite: true

  tests-runtime-critical-flow:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [npm-compatibility-artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: "tests (runtime critical flow: ${{ matrix.runtime }})"
    strategy:
      fail-fast: false
      matrix:
        runtime: [deno, node, bun]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
        with:
          warm-cache: "true"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ matrix.runtime == 'bun' }}
        with:
          bun-version: "1.3.6"
      - name: Download canonical npm compatibility artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-compatibility-${{ github.sha }}
          path: dist/npm-compatibility
      - name: Run runtime critical flow
        run: deno run -A scripts/test/runtime-inference-critical-flow.ts --runtime=${{ matrix.runtime }} --packed-dir=dist/npm-compatibility

  tests-windows-localhost:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-2022
    timeout-minutes: 20
    name: tests (Windows localhost routing)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
        with:
          warm-cache: "true"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Record wildcard localhost resolution
        shell: pwsh
        run: |
          $nodeReport = node scripts/ci/probe-localhost-resolution.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $denoReport = deno run --allow-net scripts/ci/probe-localhost-resolution.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @(
            "### Windows wildcard localhost resolution",
            "",
            '```json',
            $nodeReport,
            $denoReport,
            '```'
          ) | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Install Chromium
        timeout-minutes: 10
        run: deno run -A npm:playwright@1.60.0 install chromium
      - name: Exercise local virtual-host routing
        run: deno run -A scripts/ci/run-windows-localhost-e2e.ts

  coverage-shards:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: coverage shard ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
      - name: Run unit coverage shard
        id: coverage
        run: |
          START=$(date +%s)
          deno task coverage:ci:shard -- --shard=${{ matrix.shard }}/4 --coverage-dir=coverage-shard-${{ matrix.shard }}
          echo "duration=$(($(date +%s) - START))s" >> "$GITHUB_OUTPUT"
      - name: Upload unit coverage lcov
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-shard-${{ matrix.shard }}/lcov.info
          retention-days: 1
      - name: Add coverage shard summary
        run: echo "### Coverage shard ${{ matrix.shard }}/4 completed in ${{ steps.coverage.outputs.duration }}" >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    name: tests (unit)
    needs: [coverage-shards]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Require all unit test shards
        env:
          COVERAGE_SHARDS_RESULT: ${{ needs.coverage-shards.result }}
        run: |
          if [ "$COVERAGE_SHARDS_RESULT" != "success" ]; then
            echo "::error::Unit test shards finished with $COVERAGE_SHARDS_RESULT"
            exit 1
          fi

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: coverage gate
    needs: [coverage-shards]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Require coverage shards
        env:
          COVERAGE_SHARDS_RESULT: ${{ needs.coverage-shards.result }}
        run: |
          if [ "$COVERAGE_SHARDS_RESULT" != "success" ]; then
            echo "::error::Coverage shards finished with $COVERAGE_SHARDS_RESULT"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
      - name: Download unit coverage lcov files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: coverage-profiles
          pattern: coverage-shard-*
      - name: Run coverage gate
        id: coverage
        run: |
          START=$(date +%s)
          deno task coverage:ci:merge coverage-profiles/coverage-shard-*
          echo "duration=$(($(date +%s) - START))s" >> "$GITHUB_OUTPUT"
      - name: Add coverage summary
        run: echo "### Coverage shard merge completed in ${{ steps.coverage.outputs.duration }}" >> "$GITHUB_STEP_SUMMARY"

  # Uploading is a separate job from `coverage-shards` on purpose. The shard job
  # runs the unit suite with `--allow-all`, so any code on the branch executes
  # there. Granting that job `id-token: write` would let branch code mint a
  # repository OIDC token. This job runs no repository code: it downloads the
  # shard artifacts, rewrites paths with sed, and calls the upload action.
  codecov-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: codecov upload
    needs: [coverage-shards]
    if: ${{ needs.coverage-shards.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download unit coverage lcov files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: coverage-profiles
          pattern: coverage-shard-*
      # `deno coverage --lcov` emits absolute `SF:` paths (for example,
      # `$GITHUB_WORKSPACE/src/...`). Codecov matches
      # coverage records against repo-relative paths, so strip the workspace
      # prefix. This edits the downloaded copies only. The stored artifact and
      # the `coverage gate` job read their own copies and are unaffected.
      - name: Normalize lcov paths for Codecov
        run: |
          for file in coverage-profiles/coverage-shard-*/lcov.info; do
            sed -i "s|^SF:${GITHUB_WORKSPACE}/|SF:|" "$file"
          done
      # Authenticated with OIDC rather than a stored CODECOV_TOKEN, so there is
      # no upload secret to manage or rotate. A token is otherwise mandatory
      # here: `main` is a protected branch, and Codecov only permits tokenless
      # uploads for fork PRs.
      #
      # Advisory only: `fail_ci_if_error` stays false so a Codecov outage can
      # never fail this job, and this job is not a required status check. The
      # blocking threshold remains `deno task coverage:gate`.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          # Comma separated, the form the action documents. All 4 files go up
          # in one call, so Codecov records one upload per commit.
          files: coverage-profiles/coverage-shard-1/lcov.info,coverage-profiles/coverage-shard-2/lcov.info,coverage-profiles/coverage-shard-3/lcov.info,coverage-profiles/coverage-shard-4/lcov.info
          disable_search: true
          name: unit
          fail_ci_if_error: false

  # Automatic Analysis runs on Sonar's servers and cannot see coverage, which is
  # only produced where the tests run. Reuses the shard artifacts; runs no
  # repository code, like codecov-upload.
  #
  # Skipped for forks and for Dependabot: both reach the scan without SONAR_TOKEN
  # (Dependabot branches live in this repository, but Actions secrets are not
  # exposed to Dependabot-triggered runs), and an empty token fails the scan.
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: sonar
    needs: [coverage-shards]
    if: ${{ needs.coverage-shards.result == 'success' && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]')) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Sonar reads git history for new-code and blame.
          fetch-depth: 0
      - name: Download unit coverage lcov files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: coverage-profiles
          pattern: coverage-shard-*
      - name: Normalize lcov paths
        run: |
          for file in coverage-profiles/coverage-shard-*/lcov.info; do
            sed -i "s|^SF:${GITHUB_WORKSPACE}/|SF:|" "$file"
          done
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  tests-e2e-rsc-browser:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    name: tests (rsc browser e2e)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
      - name: Install Chromium
        timeout-minutes: 20
        uses: ./.github/actions/install-chromium
      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_wait_seconds: 10
          command: deno task test:e2e:rsc-browser

  # ============================================
  # CI: Compiled Binary E2E Tests
  # ============================================

  tests-binary-e2e:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: tests (binary e2e)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
      - name: Install Chromium
        timeout-minutes: 20
        uses: ./.github/actions/install-chromium
      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 30
          max_attempts: 2
          retry_wait_seconds: 30
          command: |
            VERYFRONT_BINARY_FRESH=1 deno task test:e2e:binary

  quality-gate-merge:
    name: quality gate (merge)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - ci
      - unit-tests
      - coverage
      - tests
      - tests-node
      - tests-node-sandbox
      - tests-bun
      - tests-binary-e2e
      - tests-e2e-rsc-browser
      - sonar
    if: ${{ always() }}
    steps:
      - name: Require merge correctness dependencies
        env:
          # Sonar needs SONAR_TOKEN, so fork and Dependabot PRs intentionally
          # skip it. Pushes, merge-group runs, and trusted PRs must block on it.
          SONAR_REQUIRED: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') }}
          SOURCE_CHECKS_RESULT: ${{ needs.ci.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          INTEGRATION_TESTS_RESULT: ${{ needs.tests.result }}
          NODE_RUNTIME_TESTS_RESULT: ${{ needs.tests-node.result }}
          NODE_SANDBOX_TESTS_RESULT: ${{ needs.tests-node-sandbox.result }}
          BUN_RUNTIME_TESTS_RESULT: ${{ needs.tests-bun.result }}
          BINARY_E2E_RESULT: ${{ needs.tests-binary-e2e.result }}
          RSC_BROWSER_E2E_RESULT: ${{ needs.tests-e2e-rsc-browser.result }}
        run: |
          failed=0
          for result_name in \
            SOURCE_CHECKS_RESULT \
            UNIT_TESTS_RESULT \
            COVERAGE_RESULT \
            SONAR_RESULT \
            INTEGRATION_TESTS_RESULT \
            NODE_RUNTIME_TESTS_RESULT \
            NODE_SANDBOX_TESTS_RESULT \
            BUN_RUNTIME_TESTS_RESULT \
            BINARY_E2E_RESULT \
            RSC_BROWSER_E2E_RESULT
          do
            result="${!result_name}"
            if [ "$result_name" = "SONAR_RESULT" ] && [ "$SONAR_REQUIRED" != "true" ]; then
              continue
            fi
            if [ "$result" != "success" ]; then
              echo "::error::$result_name finished with $result"
              failed=1
            fi
          done
          exit "$failed"

  # ============================================
  # CI: npm Install Smoke
  # ============================================

  # Clean-room install of the generated npm packages under Node: bare-install
  # CLI startup, optional-peer metadata, extension package loading, and a real
  # starter dev-server render (see scripts/test/npm-install-smoke.ts).
  npm-smoke-node-versions:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: npm smoke Node version contract
    outputs:
      node_versions: ${{ steps.versions.outputs.node_versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
      - name: Read npm smoke Node versions
        id: versions
        run: |
          deno eval '
            import { NPM_SMOKE_NODE_VERSIONS } from "./scripts/build/runtime-support.ts";
            console.log(`node_versions=${JSON.stringify(NPM_SMOKE_NODE_VERSIONS)}`);
          ' >> "$GITHUB_OUTPUT"

  tests-npm-install-smoke:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [npm-smoke-node-versions, npm-compatibility-artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: "tests (npm install smoke: Node ${{ matrix.node-version }})"
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.npm-smoke-node-versions.outputs.node_versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
        with:
          warm-cache: "true"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Download canonical npm compatibility artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-compatibility-${{ github.sha }}
          path: dist/npm-compatibility
      - name: Materialize canonical npm output
        run: |
          deno run --config=scripts/test.deno.json --frozen --allow-read --allow-write --allow-run=tar \
            scripts/ci/npm-compatibility-artifact.ts materialize dist/npm-compatibility npm
      - name: Install TypeScript toolchain
        run: npm --prefix storybook ci --ignore-scripts
      - name: Check published package types
        run: deno task typecheck:consumer --skip-build
      - name: Report npm package size
        run: |
          deno run --allow-read --allow-run=npm scripts/build/report-artifact-sizes.ts --npm-package npm \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Clean-room install/import smoke
        env:
          VF_NPM_PACK_DIR: ${{ github.workspace }}/dist/npm-compatibility
        run: deno run -A scripts/test/npm-install-smoke.ts

  quality-gate-artifact:
    name: quality gate (artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - npm-compatibility-artifact
      - tests-npm-install-smoke
      - tests-runtime-critical-flow
    if: ${{ always() }}
    steps:
      - name: Require canonical artifact compatibility
        env:
          ARTIFACT_BUILD_RESULT: ${{ needs.npm-compatibility-artifact.result }}
          NPM_SMOKE_RESULT: ${{ needs.tests-npm-install-smoke.result }}
          RUNTIME_CRITICAL_FLOW_RESULT: ${{ needs.tests-runtime-critical-flow.result }}
        run: |
          failed=0
          for result_name in \
            ARTIFACT_BUILD_RESULT \
            NPM_SMOKE_RESULT \
            RUNTIME_CRITICAL_FLOW_RESULT
          do
            result="${!result_name}"
            if [ "$result" != "success" ]; then
              echo "::error::$result_name finished with $result"
              failed=1
            fi
          done
          exit "$failed"

  tests-sentry-runtime-packages:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: tests (sentry runtime packages)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
        with:
          warm-cache: "true"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check Sentry runtime package variants
        run: deno task test:sentry-runtime-packages

  # ============================================
  # CI: Split Mode Test
  # ============================================

  tests-split-mode:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUN_SPLIT_MODE_TEST == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: tests (split mode)
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5

      - name: Compile binary
        run: deno task build

      - name: Test split mode startup
        run: |
          # Start renderer in background
          ./bin/veryfront serve --mode=renderer --port=3000 &
          RENDERER_PID=$!

          # Start proxy in background
          ./bin/veryfront serve --mode=proxy --port=8080 &
          PROXY_PID=$!

          # Wait for startup
          sleep 5

          # Health check - just verify processes are running
          echo "Checking renderer on port 3000..."
          curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/ --max-time 5 || echo "Renderer not responding (expected without project)"

          echo "Checking proxy on port 8080..."
          curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/ --max-time 5 || echo "Proxy not responding (expected without project)"

          # Verify processes started successfully
          if kill -0 $RENDERER_PID 2>/dev/null; then
            echo "SUCCESS: Renderer process running"
          else
            echo "FAILED: Renderer process not running"
            exit 1
          fi

          if kill -0 $PROXY_PID 2>/dev/null; then
            echo "SUCCESS: Proxy process running"
          else
            echo "FAILED: Proxy process not running"
            exit 1
          fi

          # Cleanup
          kill $RENDERER_PID $PROXY_PID 2>/dev/null || true
          echo "Split mode startup test passed"

  # ============================================
  # CD: Detect release type from deno.json
  # X.Y.Z = stable (npm latest), anything else = RC
  # ============================================

  version-check:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      is_stable: ${{ steps.check.outputs.is_stable }}
      stable_release_requested: ${{ steps.check.outputs.stable_release_requested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect release type
        id: check
        run: |
          VERSION=$(jq -r '.version' deno.json)
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$ ]]; then
            echo "::error::deno.json version must be a valid npm semver or prerelease"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          STABLE_RELEASE_REQUESTED=$(bash scripts/ci/stable-release-requested.sh \
            "${{ github.event_name }}" \
            "$VERSION" \
            "${{ github.event.before }}")
          echo "stable_release_requested=${STABLE_RELEASE_REQUESTED}" >> $GITHUB_OUTPUT

          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> $GITHUB_OUTPUT
            if [[ "$STABLE_RELEASE_REQUESTED" == "true" ]]; then
              echo "::notice::Stable release requested: $VERSION → will publish as latest"
            else
              echo "::notice::Stable version unchanged: $VERSION → skipping publication"
            fi
          else
            echo "is_stable=false" >> $GITHUB_OUTPUT
            echo "::notice::Pre-release version detected: $VERSION → will publish as rc"
          fi

  # ============================================
  # CD: Build Binaries (main only)
  # Stable versions come from deno.json. RC versions append the workflow run number.
  # ============================================

  tests-proxy-binary:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
      - uses: ./.github/actions/prepare-build-deps
      - name: Verify proxy dependency lock is current
        run: |
          deno task build:proxy-lock
          git diff --exit-code -- scripts/build/proxy-deno.lock
      - name: Compile proxy binary
        run: |
          deno run -A scripts/build/compile-binary.ts \
            --entrypoint cli/proxy-main.ts \
            --profile proxy \
            --target x86_64-unknown-linux-gnu \
            --output veryfront-proxy-linux-x64
      - name: Smoke test proxy binary
        run: bash scripts/build/smoke-proxy-binary.sh ./veryfront-proxy-linux-x64
      - name: Enforce proxy memory limit
        env:
          PROXY_MEMORY_LIMIT: 1536m
          PROXY_MEMORY_ATTEMPTS: "3"
        run: bash scripts/build/smoke-proxy-memory.sh ./veryfront-proxy-linux-x64

  build-binaries:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.ref == 'refs/heads/main' }}
    needs: [version-check]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ contains(matrix.os, 'windows') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: veryfront-macos-arm64
            entrypoint: cli/main.ts
            profile: full
          - os: macos-latest
            target: x86_64-apple-darwin
            name: veryfront-macos-x64
            entrypoint: cli/main.ts
            profile: full
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: veryfront-linux-x64
            entrypoint: cli/main.ts
            profile: full
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: veryfront-linux-arm64
            entrypoint: cli/main.ts
            profile: full
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: veryfront-proxy-linux-x64
            entrypoint: cli/proxy-main.ts
            profile: proxy
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: veryfront-proxy-linux-arm64
            entrypoint: cli/proxy-main.ts
            profile: proxy
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            name: veryfront-windows-x64.exe
            entrypoint: cli/main.ts
            profile: full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5

      - name: Prepare RC build version
        if: needs.version-check.outputs.is_stable == 'false'
        env:
          VERSION: ${{ needs.version-check.outputs.version }}.${{ github.run_number }}
        run: deno run -A scripts/ci/prepare-rc-build.ts

      - uses: ./.github/actions/prepare-build-deps

      - name: Verify proxy dependency lock is current
        if: matrix.profile == 'proxy'
        shell: bash
        run: |
          deno task build:proxy-lock
          git diff --exit-code -- scripts/build/proxy-deno.lock

      - name: Compile binary
        shell: bash
        run: |
          deno run -A scripts/build/compile-binary.ts \
            --entrypoint ${{ matrix.entrypoint }} \
            --profile ${{ matrix.profile }} \
            --target ${{ matrix.target }} \
            --output ${{ matrix.name }}

      - name: Report binary size
        shell: bash
        run: |
          deno run --allow-read scripts/build/report-artifact-sizes.ts ./${{ matrix.name }} \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Smoke test proxy binary
        if: matrix.name == 'veryfront-proxy-linux-x64'
        shell: bash
        run: bash scripts/build/smoke-proxy-binary.sh ./${{ matrix.name }}

      - name: Enforce proxy memory limit
        if: matrix.name == 'veryfront-proxy-linux-x64'
        shell: bash
        env:
          PROXY_MEMORY_LIMIT: 1536m
          PROXY_MEMORY_ATTEMPTS: "3"
        run: bash scripts/build/smoke-proxy-memory.sh ./veryfront-proxy-linux-x64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          retention-days: 7

  # ============================================
  # CD: Pre-release (RC versions only)
  # Runs when deno.json version has a prerelease suffix (e.g. 0.1.14-rc)
  # Appends .{run_number} and publishes with --tag rc
  # ============================================

  prerelease:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.version-check.outputs.is_stable == 'false' }}
    needs: [
      quality-gate-merge,
      quality-gate-artifact,
      tests-sentry-runtime-packages,
      tests-windows-localhost,
      build-binaries,
      npm-compatibility-artifact,
      version-check,
    ]
    runs-on: ubuntu-latest
    environment: production
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Pin npm CLI for publication
        env:
          NPM_CLI_VERSION: "11.12.1"
        run: npm install --global "npm@${NPM_CLI_VERSION}"

      - name: Compute RC version
        id: version
        env:
          BASE_VERSION: ${{ needs.version-check.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          RC_VERSION="${BASE_VERSION}.${RUN_NUMBER}"
          echo "version=${RC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing RC: ${RC_VERSION}"

      - name: Download tested npm compatibility artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-compatibility-${{ github.sha }}
          path: dist/npm-compatibility

      - name: Publish tested RC npm artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NPM_PACK_DIR: ${{ github.workspace }}/dist/npm-compatibility
        run: |
          deno run --config=scripts/test.deno.json --frozen --allow-read --allow-write --allow-run=tar \
            scripts/ci/npm-compatibility-artifact.ts materialize dist/npm-compatibility npm
          deno run --allow-read --allow-run=npm scripts/build/report-artifact-sizes.ts --npm-package npm \
            | tee -a "$GITHUB_STEP_SUMMARY"
          scripts/ci/publish-npm-packages.sh rc-publish

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: binaries

      - name: Prepare RC checkout for SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: deno run -A scripts/ci/prepare-rc-build.ts

      - name: Generate SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          deno task sbom:all --output-dir "dist/sbom-${VERSION}"
          deno task sbom --lock scripts/build/proxy-deno.lock --output "dist/sbom-${VERSION}/proxy.json"

      - name: Create release GitHub App token
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.VERYFRONT_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.VERYFRONT_RELEASE_APP_PRIVATE_KEY }}
          owner: veryfront
          repositories: |
            veryfront
          permission-contents: write

      - name: Create GitHub pre-release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: |
          # Collect available binaries dynamically (Windows build is optional)
          BINARIES=()
          for f in binaries/veryfront-*/veryfront-*; do
            [ -f "$f" ] && BINARIES+=("$f")
          done
          SBOMS=()
          for f in dist/sbom-${VERSION}/*.json; do
            [ -f "$f" ] && SBOMS+=("$f")
          done
          echo "Available binaries: ${BINARIES[*]}"
          echo "Available SBOMs: ${SBOMS[*]}"

          bash scripts/ci/publish-github-release.sh \
            --repo veryfront/veryfront \
            --tag "v${VERSION}" \
            --title "v${VERSION}" \
            --notes '```bash
          npx veryfront@rc
          ```' \
            --prerelease \
            -- \
            "${BINARIES[@]}" \
            scripts/install.sh \
            "${SBOMS[@]}"

  # ============================================
  # CD: Stable Release (clean semver only)
  # Runs when deno.json changes to X.Y.Z (no suffix), or on manual dispatch
  # Publishes with --tag latest, creates git tag, updates Homebrew
  # ============================================

  release:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.version-check.outputs.is_stable == 'true' && needs.version-check.outputs.stable_release_requested == 'true' }}
    needs: [
      quality-gate-merge,
      quality-gate-artifact,
      tests-sentry-runtime-packages,
      tests-windows-localhost,
      build-binaries,
      npm-compatibility-artifact,
      version-check,
    ]
    runs-on: ubuntu-latest
    environment: production
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version
        id: version
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing stable: ${VERSION}"

      - name: Create release GitHub App token
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.VERYFRONT_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.VERYFRONT_RELEASE_APP_PRIVATE_KEY }}
          owner: veryfront
          repositories: |
            veryfront
          permission-contents: write

      - name: Ensure stable version is unpublished
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          SOURCE_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          scripts/ci/publish-npm-packages.sh preflight
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "::error::Tag ${TAG} already exists on source repo. Bump deno.json before releasing."
            exit 1
          fi
          if gh release view "${TAG}" --repo veryfront/veryfront &>/dev/null; then
            echo "::error::Release ${TAG} already exists on veryfront/veryfront. Bump deno.json before releasing."
            exit 1
          fi
          if GH_TOKEN="${SOURCE_REPO_TOKEN}" gh release view "${TAG}" &>/dev/null; then
            echo "::error::Release ${TAG} already exists on source repo. Bump deno.json before releasing."
            exit 1
          fi

      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Pin npm CLI for publication
        env:
          NPM_CLI_VERSION: "11.12.1"
        run: npm install --global "npm@${NPM_CLI_VERSION}"

      - name: Download tested npm compatibility artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-compatibility-${{ github.sha }}
          path: dist/npm-compatibility

      - name: Publish tested stable npm artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NPM_PACK_DIR: ${{ github.workspace }}/dist/npm-compatibility
        run: |
          deno run --config=scripts/test.deno.json --frozen --allow-read --allow-write --allow-run=tar \
            scripts/ci/npm-compatibility-artifact.ts materialize dist/npm-compatibility npm
          deno run --allow-read --allow-run=npm scripts/build/report-artifact-sizes.ts --npm-package npm \
            | tee -a "$GITHUB_STEP_SUMMARY"
          scripts/ci/publish-npm-packages.sh release-publish

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: binaries

      - name: Generate SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          deno task sbom:all --output-dir "dist/sbom-${VERSION}"
          deno task sbom --lock scripts/build/proxy-deno.lock --output "dist/sbom-${VERSION}/proxy.json"

      - name: Create git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION}"
          git tag "${TAG}"
          # Checkout does not persist credentials; authenticate only this push.
          git push "https://x-access-token:${SOURCE_REPO_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${TAG}"
          echo "Created tag ${TAG}"

      - name: Create GitHub releases
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: |
          # Collect available binaries dynamically (Windows build is optional)
          BINARIES=()
          for f in binaries/veryfront-*/veryfront-*; do
            [ -f "$f" ] && BINARIES+=("$f")
          done
          SBOMS=()
          for f in dist/sbom-${VERSION}/*.json; do
            [ -f "$f" ] && SBOMS+=("$f")
          done
          echo "Available binaries: ${BINARIES[*]}"
          echo "Available SBOMs: ${SBOMS[*]}"

          # Publish a checksum manifest alongside the assets. install.sh verifies a
          # downloaded binary against this before moving it into place, so the
          # manifest must name assets exactly as they are uploaded -- basenames,
          # not the artifact paths they were downloaded to.
          SUMS_FILE="SHA256SUMS"
          : > "$SUMS_FILE"
          for f in "${BINARIES[@]}" scripts/install.sh scripts/install.ps1; do
            [ -f "$f" ] || continue
            sha256sum "$f" | sed "s#  .*/#  #" >> "$SUMS_FILE"
          done
          echo "Checksum manifest:"
          cat "$SUMS_FILE"

          # Clean up rc pre-releases (created by the prerelease job on main pushes)
          gh release list --repo veryfront/veryfront --json tagName -q ".[].tagName" \
            | grep "^v${VERSION}-rc\." \
            | xargs -I{} gh release delete {} --repo veryfront/veryfront --yes --cleanup-tag 2>/dev/null || true

          bash scripts/ci/publish-github-release.sh \
            --repo veryfront/veryfront \
            --tag "v${VERSION}" \
            --title "v${VERSION}" \
            --notes '## Install

          ```bash
          # macOS/Linux
          curl -fsSL https://veryfront.com/install.sh | sh

          # npm
          npm install -g veryfront
          ```' \
            --latest \
            -- \
            "${BINARIES[@]}" \
            "$SUMS_FILE" \
            scripts/install.sh \
            scripts/install.ps1 \
            "${SBOMS[@]}"

      - name: Create source repo release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            --notes "Binaries available at: https://github.com/veryfront/veryfront/releases/tag/v${VERSION}"

  quality-gate-registry:
    name: quality gate (registry)
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.version-check.result == 'success' && (needs.version-check.outputs.is_stable == 'false' || needs.version-check.outputs.stable_release_requested == 'true') }}
    needs: [prerelease, release, version-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Report selected release result
        env:
          IS_STABLE: ${{ needs.version-check.outputs.is_stable }}
          PRERELEASE_RESULT: ${{ needs.prerelease.result }}
          STABLE_RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          if [ "$IS_STABLE" = "true" ]; then
            selected_result_name="STABLE_RELEASE_RESULT"
          else
            selected_result_name="PRERELEASE_RESULT"
          fi
          selected_result="${!selected_result_name}"
          if [ "$selected_result" != "success" ]; then
            echo "::warning::REGISTRY RELEASE NON-SUCCESS [configuration]: $selected_result_name finished with $selected_result. Registry validation will continue, but downstream release dispatch remains blocked." >&2
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
        timeout-minutes: 5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate exact registry release
        env:
          RC_VERSION: ${{ needs.prerelease.outputs.version }}
          STABLE_VERSION: ${{ needs.release.outputs.version }}
          GITHUB_SHA: ${{ github.sha }}
          IS_STABLE: ${{ needs.version-check.outputs.is_stable }}
        run: bash scripts/ci/registry-release-smoke.sh

  dispatch-release:
    name: dispatch release
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.quality-gate-registry.result == 'success' && ((needs.version-check.outputs.is_stable == 'true' && needs.release.result == 'success') || (needs.version-check.outputs.is_stable == 'false' && needs.prerelease.result == 'success')) }}
    needs: [quality-gate-registry, prerelease, release, version-check]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Resolve published version
        id: version
        env:
          IS_STABLE: ${{ needs.version-check.outputs.is_stable }}
          RC_VERSION: ${{ needs.prerelease.outputs.version }}
          STABLE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          case "$IS_STABLE" in
            true) version="$STABLE_VERSION" ;;
            false) version="$RC_VERSION" ;;
            *)
              echo "::error::Unsupported release stability value: $IS_STABLE"
              exit 1
              ;;
          esac
          if [ -z "$version" ]; then
            echo "::error::Selected published version is empty"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build dispatch payload
        id: payload
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          payload=$(jq -cn --arg version "$VERSION" '{version: $version}')
          echo "payload=$payload" >> "$GITHUB_OUTPUT"

      - name: Create release GitHub App token
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.VERYFRONT_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.VERYFRONT_RELEASE_APP_PRIVATE_KEY }}
          owner: veryfront
          repositories: |
            veryfront-server
            veryfront-job-runner
            veryfront-sandbox
          permission-contents: write

      - name: Trigger server deploy
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.release-app-token.outputs.token }}
          repository: veryfront/veryfront-server
          event-type: veryfront-code-released
          client-payload: ${{ steps.payload.outputs.payload }}

      - name: Trigger job-runner deploy
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.release-app-token.outputs.token }}
          repository: veryfront/veryfront-job-runner
          event-type: veryfront-code-released
          client-payload: ${{ steps.payload.outputs.payload }}

      - name: Trigger sandbox deploy
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.release-app-token.outputs.token }}
          repository: veryfront/veryfront-sandbox
          event-type: veryfront-code-released
          client-payload: ${{ steps.payload.outputs.payload }}

  # ============================================
  # CD: Update Homebrew (stable releases only)
  # ============================================

  update-homebrew:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [release, version-check]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create Homebrew tap GitHub App token
        id: homebrew-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HOMEBREW_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: veryfront
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - name: Update Homebrew tap
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          HOMEBREW_TAP_TOKEN: ${{ steps.homebrew-app-token.outputs.token }}
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            set -euo pipefail

            VERSION="${{ needs.version-check.outputs.version }}"

            # Download binaries and calculate checksums
            declare -A SHAS
            for binary in veryfront-macos-arm64 veryfront-macos-x64 veryfront-linux-arm64 veryfront-linux-x64; do
              curl -fsSL "https://github.com/veryfront/veryfront/releases/download/v${VERSION}/${binary}" -o "${binary}"
              SHAS[$binary]=$(sha256sum "${binary}" | cut -d' ' -f1)
            done

            # Generate formula from template
            FORMULA=$(cat homebrew/veryfront.rb)
            FORMULA="${FORMULA//VERSION_PLACEHOLDER/$VERSION}"
            FORMULA="${FORMULA//SHA256_MACOS_ARM64_PLACEHOLDER/${SHAS[veryfront-macos-arm64]}}"
            FORMULA="${FORMULA//SHA256_MACOS_X64_PLACEHOLDER/${SHAS[veryfront-macos-x64]}}"
            FORMULA="${FORMULA//SHA256_LINUX_ARM64_PLACEHOLDER/${SHAS[veryfront-linux-arm64]}}"
            FORMULA="${FORMULA//SHA256_LINUX_X64_PLACEHOLDER/${SHAS[veryfront-linux-x64]}}"

            # Create PR against tap repo (branch protection requires PRs)
            rm -rf tap
            git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/veryfront/homebrew-tap.git" tap
            mkdir -p tap/Formula
            echo "$FORMULA" > tap/Formula/veryfront.rb
            cd tap
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add Formula/veryfront.rb
            git diff --cached --quiet && echo "No changes to commit" && exit 0

            BRANCH="update-veryfront-v${VERSION}"
            git checkout -b "${BRANCH}"
            git commit -m "Update veryfront to v${VERSION}"
            git push -u origin "${BRANCH}" || git push -u origin "${BRANCH}" --force-with-lease

            export GH_TOKEN="${HOMEBREW_TAP_TOKEN}"
            PR_NUMBER=$(gh api repos/veryfront/homebrew-tap/pulls \
              --method GET \
              -f state=open \
              -f head="veryfront:${BRANCH}" \
              -f base=main \
              --jq '.[0].number // empty')

            if [ -z "${PR_NUMBER}" ]; then
              CREATE_PR_OUTPUT=$(gh pr create \
                --repo veryfront/homebrew-tap \
                --title "Update veryfront to v${VERSION}" \
                --base main \
                --head "${BRANCH}" \
                --body "Automated update from CI - veryfront v${VERSION}" 2>&1) || {
                  if echo "${CREATE_PR_OUTPUT}" | grep -Eq "Resource not accessible by (integration|personal access token)"; then
                    echo "::error::Homebrew tap update requires a GitHub App token with Pull requests: write and Contents: write on veryfront/homebrew-tap."
                  fi
                  echo "${CREATE_PR_OUTPUT}"
                  exit 1
                }

              PR_URL=$(printf '%s\n' "${CREATE_PR_OUTPUT}" | tail -n 1)
              PR_NUMBER="${PR_URL##*/}"
              if ! [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
                echo "::error::Created Homebrew tap PR but could not read its number."
                echo "${CREATE_PR_OUTPUT}"
                exit 1
              fi
            fi

            # GitHub can report mergeability as unknown immediately after PR creation or a force-push.
            MERGEABLE=""
            MERGEABLE_STATE=""
            for attempt in {1..24}; do
              PR_JSON=$(gh pr view "${PR_NUMBER}" \
                --repo veryfront/homebrew-tap \
                --json mergeable,mergeStateStatus)
              MERGEABLE=$(echo "${PR_JSON}" | jq -r '.mergeable')
              MERGEABLE_STATE=$(echo "${PR_JSON}" | jq -r '.mergeStateStatus')

              if [ "${MERGEABLE}" = "MERGEABLE" ] && [ "${MERGEABLE_STATE}" = "CLEAN" ]; then
                break
              fi

              if [ "${MERGEABLE}" = "CONFLICTING" ]; then
                echo "::error::Homebrew tap PR #${PR_NUMBER} is not mergeable (state=${MERGEABLE_STATE})."
                exit 1
              fi

              sleep 5
            done

            if [ "${MERGEABLE}" != "MERGEABLE" ] || [ "${MERGEABLE_STATE}" != "CLEAN" ]; then
              echo "::error::Timed out waiting for Homebrew tap PR #${PR_NUMBER} to become mergeable (mergeable=${MERGEABLE}, state=${MERGEABLE_STATE})."
              exit 1
            fi

            gh pr merge "${PR_NUMBER}" \
              --repo veryfront/homebrew-tap \
              --merge
