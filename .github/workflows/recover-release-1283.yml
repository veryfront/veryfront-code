# Read-only preparation checks. Publication remains unavailable until canonical
# artifacts, all registry bytes, signatures and installed behavior are qualified.
name: Check original 0.1.1283 recovery evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/recover-release-1283.yml
      - scripts/ci/recover-release-1283*
      - scripts/ci/recover-release-assets.py
      - scripts/ci/test_recover_release*.py

permissions:
  contents: read
  actions: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test recovery identity and asset preservation
        run: python3 -B -m unittest discover -s scripts/ci -p 'test_recover_release*.py' -v

  readiness:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check original producer and root registry availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ci/recover-release-1283-preflight.py
