name: Automated review gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: automated-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    name: publish automated review status
    if: >-
      (github.event_name != 'issue_comment' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This workflow has pull_request_target authority. Check out only the
      # trusted base commit and never execute files from the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Require an automated review for the current commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const { pathToFileURL } = require("node:url");
            const gateUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/ci/automated-review-gate.mjs`,
            ).href;
            const { publishAutomatedReviewStatus } = await import(gateUrl);
            let pullRequest = context.payload.pull_request;
            if (!pullRequest) {
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.issue.number,
              });
              pullRequest = response.data;
            }
            if (pullRequest.draft) {
              core.notice("Draft pull requests wait for ready_for_review.");
              return;
            }
            const headSha = pullRequest.head.sha;
            const result = await publishAutomatedReviewStatus({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              pullNumber: pullRequest.number,
              headSha,
              pullUrl: pullRequest.html_url,
            });
            if (result.review) {
              core.notice(
                `Automated review submitted by ${result.review.reviewer} for ${headSha.slice(0, 12)}.`,
              );
            } else {
              core.warning(result.failure.message);
            }
