name: Automated review gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Automated review wakeup]
    types: [completed]
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  target:
    name: resolve automated review target
    # Apply publisher eligibility before allocating a resolver runner. The
    # resolver exists only to feed pull request reconciliation below.
    if: >-
      github.event_name != 'merge_group' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'pull_request_review' &&
        github.event.workflow_run.conclusion == 'success'))
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      key: ${{ steps.resolve.outputs.result }}
      pull_number: ${{ steps.resolve.outputs.pull-number }}
    steps:
      - name: Resolve the current head commit
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          result-encoding: string
          script: |
            const workflowRun = context.payload.workflow_run;
            let workflowPullNumber;
            if (context.eventName === "workflow_run") {
              const trustedPath =
                ".github/workflows/automated-review-wakeup.yml";
              const runIsTrusted =
                (workflowRun?.path === trustedPath ||
                  workflowRun?.path?.startsWith(`${trustedPath}@`)) &&
                workflowRun.event === "pull_request_review" &&
                workflowRun?.conclusion === "success" &&
                Number.isSafeInteger(workflowRun?.id) &&
                workflowRun.id > 0;
              const titleMatch =
                /^automated-review-wakeup-pr-([1-9][0-9]*)$/.exec(
                  workflowRun?.display_title ?? "",
                );
              workflowPullNumber = titleMatch
                ? Number(titleMatch[1])
                : undefined;
              if (
                !runIsTrusted ||
                !Number.isSafeInteger(workflowPullNumber)
              ) {
                core.setFailed("Could not validate the review wakeup run");
                return `run-${context.runId}`;
              }
            }
            // pull_request_review workflows use a synthetic merge SHA. For a
            // workflow_run wakeup, resolve the current source head from the
            // pull request instead of treating that merge SHA as review proof.
            let headSha = context.eventName === "workflow_run"
              ? undefined
              : context.payload.sha;
            const pullNumber = context.payload.pull_request?.number ??
              (context.payload.issue?.pull_request
                ? context.payload.issue.number
                : workflowPullNumber);
            if (!Number.isSafeInteger(pullNumber) || pullNumber < 1) {
              core.setFailed("Could not resolve a valid pull request number");
              return `run-${context.runId}`;
            }
            core.setOutput("pull-number", String(pullNumber));
            if (!headSha && pullNumber) {
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
              });
              headSha = response.data.head.sha;
            }
            if (!/^[0-9a-f]{40}$/i.test(headSha ?? "")) {
              core.setFailed("Could not resolve a valid review target commit");
              return `run-${context.runId}`;
            }
            return headSha;

  review:
    name: publish automated review status
    # Issues write lets this job post the fixed "@codex review" request after
    # verifying the current head. This job checks out
    # only the trusted default branch and never executes pull request files.
    permissions:
      contents: read
      issues: write
      pull-requests: read
      statuses: write
    # issue_comment fires for issues too, so keep only pull request comments.
    # Fork pull_request_review events have read-only tokens. The unprivileged
    # wakeup workflow observes them, then workflow_run invokes this trusted
    # default-branch reconciler with write permission. Eligibility comes from
    # the resolver dependency above. This job never reads wakeup artifacts or
    # executes pull request code.
    needs: target
    concurrency:
      # Every pull request event for one head must serialize on the same key so
      # an older pending write cannot win.
      group: automated-review-${{ needs.target.outputs.key }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This workflow has pull_request_target authority. Check out only the
      # trusted default branch and never execute files from the PR head. The
      # base commit of an older pull request predates this gate, so reading the
      # gate from the default branch is what keeps the status computable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Require an automated review for the current commit
        id: publish
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_SHA: ${{ needs.target.outputs.key }}
          PULL_NUMBER: ${{ needs.target.outputs.pull_number }}
        with:
          retries: 3
          result-encoding: string
          script: |
            const { pathToFileURL } = require("node:url");
            const gateUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/ci/automated-review-gate.mjs`,
            ).href;
            const pullNumber = Number(process.env.PULL_NUMBER);
            if (!Number.isSafeInteger(pullNumber) || pullNumber < 1) {
              core.setFailed("The resolved pull request number is invalid");
              return "failure";
            }
            const response = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            const pullRequest = response.data;
            const headSha = process.env.TARGET_SHA;
            if (!/^[0-9a-f]{40}$/i.test(headSha ?? "")) {
              core.setFailed("The resolved review target commit is invalid");
              return "failure";
            }
            if (pullRequest.head.sha !== headSha) {
              core.notice("Skipped automated review publication after the pull request head changed.");
              return "stale";
            }
            let publishAutomatedReviewStatus;
            try {
              ({ publishAutomatedReviewStatus } = await import(gateUrl));
            } catch (error) {
              // A missing or broken gate must show up as a red status, not as
              // an absent one. Absent is what a skipped review already looks
              // like, and telling those apart is the point of this workflow.
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: headSha,
                state: "failure",
                context: "Automated review",
                description:
                  "Review gate is unavailable on the default branch",
                target_url: pullRequest.html_url,
              });
              core.setFailed(`Could not load the review gate: ${error}`);
              return;
            }
            const result = await publishAutomatedReviewStatus({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              pullNumber: pullRequest.number,
              headSha,
              pullUrl: pullRequest.html_url,
              isDraft: pullRequest.draft === true,
            });
            if (result.state === "pending") {
              core.notice(`${result.description}.`);
            } else if (result.review) {
              core.notice(
                `Automated review submitted by ${result.review.reviewer} for ${headSha.slice(0, 12)}.`,
              );
            } else {
              core.warning(result.failure.message);
            }
            return result.state;
      # A pending status on a trusted push event means no review exists for
      # this head yet, and nothing would request one: the Codex connector
      # handles open and ready-for-review events, but not a push to an open
      # pull request. Post the "@codex review" request only for synchronize.
      # The helper re-fetches the PR immediately before posting so a queued
      # stale event cannot bind its marker to a request for a newer head.
      - name: Request an automated review of the current commit
        if: >-
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.draft == false &&
          github.event.action == 'synchronize' &&
          steps.publish.outputs.result == 'pending'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_SHA: ${{ needs.target.outputs.key }}
        with:
          retries: 3
          script: |
            const { pathToFileURL } = require("node:url");
            const gateUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/ci/automated-review-gate.mjs`,
            ).href;
            const { requestAutomatedReview } = await import(gateUrl);
            const pullRequest = context.payload.pull_request;
            const result = await requestAutomatedReview({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              pullNumber: pullRequest.number,
              headSha: process.env.TARGET_SHA,
            });
            core.notice(
              result.requested
                ? `Requested an automated review of ${process.env.TARGET_SHA.slice(0, 12)}.`
                : result.reason === "stale-head"
                ? "Skipped an automated review request from a stale synchronize event."
                : "An automated review request for this head commit already exists.",
            );

  merge_group:
    name: reuse exact-head review for merge group
    if: github.event_name == 'merge_group'
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    concurrency:
      group: automated-review-${{ github.event.merge_group.head_sha }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reuse the source pull request review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const { pathToFileURL } = require("node:url");
            const gateUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/ci/automated-review-gate.mjs`,
            ).href;
            let parseMergeQueuePullNumber;
            let publishMergeGroupReviewStatus;
            try {
              ({
                parseMergeQueuePullNumber,
                publishMergeGroupReviewStatus,
              } = await import(gateUrl));
            } catch (error) {
              core.setFailed(`Could not load the review gate: ${error}`);
              return;
            }
            const queueEntry = parseMergeQueuePullNumber(
              context.payload.merge_group.head_ref,
            );
            if (!queueEntry) {
              core.setFailed("Could not resolve the merge queue pull request");
              return;
            }
            const { pullNumber, sourceHeadSha } = queueEntry;
            const result = await publishMergeGroupReviewStatus({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              pullNumber,
              sourceHeadSha,
              mergeGroupSha: context.payload.merge_group.head_sha,
            });
            if (result.state === "success") {
              core.notice(
                `Reused PR #${pullNumber} review for ${context.payload.merge_group.head_sha.slice(0, 12)}.`,
              );
            } else {
              core.setFailed(result.failure.message);
            }
