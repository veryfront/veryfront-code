name: Automated review gate

on:
  pull_request_target:
    types: [
      opened,
      synchronize,
      reopened,
      ready_for_review,
      converted_to_draft,
      edited,
    ]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Automated review wakeup]
    types: [completed]
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  target:
    name: resolve automated review target
    # Apply publisher eligibility before allocating a resolver runner. The
    # resolver also gives source and merge-group publishers the same immutable
    # source-SHA concurrency key.
    if: >-
      github.event_name == 'merge_group' ||
      ((github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
       (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.event == 'pull_request_review' &&
         github.event.workflow_run.conclusion == 'success')))
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      key: ${{ steps.resolve.outputs.result }}
      pull_number: ${{ steps.resolve.outputs.pull-number }}
    steps:
      - name: Resolve the current head commit
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          result-encoding: string
          script: |
            let matchesReviewWakeupPullRequest;
            let parseMergeQueuePullNumber;
            let parseReviewWakeupRun;
            try {
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: "scripts/ci/automated-review-gate.mjs",
                ref: context.payload.repository.default_branch,
              });
              const file = response.data;
              if (
                Array.isArray(file) || file?.type !== "file" ||
                file?.encoding !== "base64" ||
                typeof file?.content !== "string"
              ) throw new Error("Trusted review gate content is malformed");
              const gateUrl = `data:text/javascript;base64,${
                Buffer.from(file.content, "base64").toString("base64")
              }`;
              ({
                matchesReviewWakeupPullRequest,
                parseMergeQueuePullNumber,
                parseReviewWakeupRun,
              } = await import(gateUrl));
            } catch (error) {
              core.setFailed(`Could not load the review target resolver: ${error}`);
              return `run-${context.runId}`;
            }
            const workflowRun = context.payload.workflow_run;
            let wakeupSignal;
            if (context.eventName === "workflow_run") {
              wakeupSignal = parseReviewWakeupRun(workflowRun);
              if (!wakeupSignal) {
                core.setFailed("Could not validate the review wakeup run");
                return `run-${context.runId}`;
              }
            }
            if (context.eventName === "merge_group") {
              const queueEntry = parseMergeQueuePullNumber(
                context.payload.merge_group?.head_ref,
              );
              if (!queueEntry) {
                core.setFailed("Could not resolve the merge queue source");
                return `run-${context.runId}`;
              }
              core.setOutput("pull-number", String(queueEntry.pullNumber));
              return queueEntry.sourceHeadSha;
            }
            const pullNumber = context.payload.pull_request?.number ??
              (context.payload.issue?.pull_request
                ? context.payload.issue.number
                : wakeupSignal?.pullNumber);
            if (!Number.isSafeInteger(pullNumber) || pullNumber < 1) {
              core.setFailed("Could not resolve a valid pull request number");
              return `run-${context.runId}`;
            }
            let headSha;
            try {
              const response = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `pull/${pullNumber}/head`,
              });
              headSha = response.data?.object?.sha;
            } catch (error) {
              let failureHeadSha;
              try {
                const fallbackResponse = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullNumber,
                });
                failureHeadSha = fallbackResponse.data?.head?.sha;
              } catch (fallbackError) {
                const eventFailureHead =
                  context.payload.pull_request?.number === pullNumber
                    ? context.payload.pull_request?.head?.sha
                    : undefined;
                if (/^[0-9a-f]{40}$/i.test(eventFailureHead ?? "")) {
                  failureHeadSha = eventFailureHead;
                } else {
                  core.error(
                    `Could not resolve a failure target from the pull request: ${fallbackError}`,
                  );
                }
              }
              core.setFailed(`Could not resolve the pull request head ref: ${error}`);
              return failureHeadSha ?? `run-${context.runId}`;
            }
            if (!/^[0-9a-f]{40}$/i.test(headSha ?? "")) {
              core.setFailed("Could not resolve a valid review target commit");
              return `run-${context.runId}`;
            }
            core.setOutput("pull-number", String(pullNumber));
            if (wakeupSignal) {
              let pullRequest;
              try {
                const response = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullNumber,
                });
                pullRequest = response.data;
              } catch (error) {
                core.setFailed(`Could not validate the review wakeup: ${error}`);
                return headSha;
              }
              if (
                !matchesReviewWakeupPullRequest(
                  wakeupSignal,
                  pullRequest,
                  context.payload.repository,
                )
              ) {
                core.setFailed(
                  "Review wakeup metadata does not match the pull request",
                );
                return headSha;
              }
            }
            return headSha;

  review:
    name: publish automated review status
    # Issues write lets this job post the fixed "@codex review" request after
    # verifying the current head. This job checks out
    # only the trusted default branch and never executes pull request files.
    permissions:
      contents: read
      issues: write
      pull-requests: read
      statuses: write
    # issue_comment fires for issues too, so keep only pull request comments.
    # Fork pull_request_review events have read-only tokens. The unprivileged
    # wakeup workflow observes them, then workflow_run invokes this trusted
    # default-branch reconciler with write permission. Eligibility comes from
    # the resolver dependency above. This job never reads wakeup artifacts or
    # executes pull request code.
    needs: target
    if: github.event_name != 'merge_group'
    concurrency:
      # Every pull request event for one head must serialize on the same key so
      # an older pending write cannot win.
      group: automated-review-${{ needs.target.outputs.key }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require an automated review for the current commit
        id: publish
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_SHA: ${{ needs.target.outputs.key }}
          PULL_NUMBER: ${{ needs.target.outputs.pull_number }}
        with:
          retries: 3
          result-encoding: string
          script: |
            const pullNumber = Number(process.env.PULL_NUMBER);
            if (!Number.isSafeInteger(pullNumber) || pullNumber < 1) {
              core.setFailed("The resolved pull request number is invalid");
              return "failure";
            }
            const headSha = process.env.TARGET_SHA;
            if (!/^[0-9a-f]{40}$/i.test(headSha ?? "")) {
              core.setFailed("The resolved review target commit is invalid");
              return "failure";
            }
            let publishAutomatedReviewStatus;
            let publishReviewResolutionFailure;
            let reconcileActiveMergeGroupReviewStatuses;
            try {
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: "scripts/ci/automated-review-gate.mjs",
                ref: context.payload.repository.default_branch,
              });
              const file = response.data;
              if (
                Array.isArray(file) || file?.type !== "file" ||
                file?.encoding !== "base64" ||
                typeof file?.content !== "string"
              ) throw new Error("Trusted review gate content is malformed");
              const gateUrl = `data:text/javascript;base64,${
                Buffer.from(file.content, "base64").toString("base64")
              }`;
              ({
                publishAutomatedReviewStatus,
                publishReviewResolutionFailure,
                reconcileActiveMergeGroupReviewStatuses,
              } = await import(gateUrl));
            } catch (error) {
              // A missing or broken gate must show up as a red status, not as
              // an absent one. Absent is what a skipped review already looks
              // like, and telling those apart is the point of this workflow.
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: headSha,
                state: "failure",
                context: "Automated review",
                description:
                  "Review gate is unavailable on the default branch",
                target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${pullNumber}`,
              });
              core.setFailed(`Could not load the review gate: ${error}`);
              return;
            }
            const result = await publishAutomatedReviewStatus({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              pullNumber,
              headSha,
              pullUrl: `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${pullNumber}`,
              reviewResetKey:
                context.eventName === "pull_request_target" &&
                context.payload.action === "edited" &&
                context.payload.changes?.base !== undefined
                  ? `base-${context.runId}`
                  : undefined,
            });
            let queueResultCount;
            if (
              result.state === "failure" ||
              typeof result.baseRef !== "string"
            ) {
              const { queueFailures } = await publishReviewResolutionFailure({
                github,
                owner: context.repo.owner,
                repo: context.repo.repo,
                pullNumber,
                sourceHeadSha: headSha,
              });
              queueResultCount = queueFailures;
            } else {
              const queueResults = await reconcileActiveMergeGroupReviewStatuses({
                github,
                owner: context.repo.owner,
                repo: context.repo.repo,
                pullNumber,
                sourceHeadSha: headSha,
                baseRef: result.baseRef,
              });
              queueResultCount = queueResults.length;
            }
            if (queueResultCount > 0) {
              core.notice(
                `Reconciled ${queueResultCount} active merge queue review status.`,
              );
            }
            if (result.state === "pending") {
              core.notice(`${result.description}.`);
            } else if (result.review) {
              core.notice(
                `Automated review submitted by ${result.review.reviewer} for ${headSha.slice(0, 12)}.`,
              );
            } else {
              core.warning(result.failure.message);
            }
            return result.state;
      # A pending status on a trusted push event means no review exists for
      # this head yet, and nothing would request one: the Codex connector
      # handles open and ready-for-review events, but not a push to an open
      # pull request. Post the "@codex review" request only for synchronize.
      # The helper re-fetches the PR immediately before posting so a queued
      # stale event cannot bind its marker to a request for a newer head. A
      # base edit gets a marker scoped to the run, which invalidates
      # proof issued for an earlier base without coupling normal reviews to a
      # moving base commit. A rerun keeps the same marker, so it re-evaluates
      # evidence after the original reset instead of creating another epoch
      # that would erase a successful review submitted in the meantime.
      - name: Request an automated review of the current commit
        if: >-
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.draft == false &&
          (github.event.action == 'synchronize' ||
           (github.event.action == 'edited' && github.event.changes.base)) &&
          steps.publish.outputs.result == 'pending'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_SHA: ${{ needs.target.outputs.key }}
        with:
          retries: 3
          script: |
            const response = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "scripts/ci/automated-review-gate.mjs",
              ref: context.payload.repository.default_branch,
            });
            const file = response.data;
            if (
              Array.isArray(file) || file?.type !== "file" ||
              file?.encoding !== "base64" ||
              typeof file?.content !== "string"
            ) throw new Error("Trusted review gate content is malformed");
            const gateUrl = `data:text/javascript;base64,${
              Buffer.from(file.content, "base64").toString("base64")
            }`;
            const { requestAutomatedReview } = await import(gateUrl);
            const pullRequest = context.payload.pull_request;
            const result = await requestAutomatedReview({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              pullNumber: pullRequest.number,
              headSha: process.env.TARGET_SHA,
              requestKey: context.payload.action === "edited"
                ? `base-${context.runId}`
                : undefined,
            });
            core.notice(
              result.requested
                ? `Requested an automated review of ${process.env.TARGET_SHA.slice(0, 12)}.`
                : result.reason === "stale-head"
                ? "Skipped an automated review request from a stale synchronize event."
                : "An automated review request for this head commit already exists.",
            );

  invalidate:
    name: invalidate unverified review proof
    # A reconciliation event is consumed by the run that observes it. If the
    # resolver or the publisher cannot complete, the previous success stays on
    # the head and a later merge group reuses it, so a finding, a deleted
    # verdict, or a dismissed approval is silently lost. A new head has no
    # status of its own. A base edit does need this fallback because the source
    # SHA is unchanged and its prior success can otherwise remain current.
    needs: [target, review]
    if: >-
      failure() &&
      (github.event_name == 'issue_comment' ||
       github.event_name == 'workflow_run' ||
       (github.event_name == 'pull_request_target' &&
        github.event.action == 'edited' &&
        github.event.changes.base))
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    concurrency:
      # Share the source-head publisher lock so fallback failures cannot race
      # successful source or merge-group status writes.
      group: automated-review-${{ needs.target.outputs.key }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close the gate on the unreconciled head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const response = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "scripts/ci/automated-review-gate.mjs",
              ref: context.payload.repository.default_branch,
            });
            const file = response.data;
            if (
              Array.isArray(file) || file?.type !== "file" ||
              file?.encoding !== "base64" ||
              typeof file?.content !== "string"
            ) throw new Error("Trusted review gate content is malformed");
            const gateUrl = `data:text/javascript;base64,${
              Buffer.from(file.content, "base64").toString("base64")
            }`;
            const {
              invalidateReviewProof,
              parseReviewWakeupRun,
            } = await import(gateUrl);
            const pullNumber = context.eventName === "pull_request_target"
              ? context.payload.pull_request?.number
              : context.eventName === "issue_comment"
              ? (context.payload.issue?.pull_request
                ? context.payload.issue?.number
                : undefined)
              : parseReviewWakeupRun(context.payload.workflow_run)?.pullNumber;
            if (!Number.isSafeInteger(pullNumber) || pullNumber < 1) {
              core.setFailed(
                "Could not resolve the pull request whose review proof is unverified",
              );
              return;
            }
            let reconciliationStartedAt;
            try {
              const workflowRun = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });
              reconciliationStartedAt = workflowRun.data?.created_at;
            } catch (error) {
              core.warning(
                `Could not timestamp fallback invalidation: ${error}`,
              );
            }
            const result = await invalidateReviewProof({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              pullNumber,
              reconciliationStartedAt,
            });
            // Keep the run red: the revocation event was still dropped, and
            // the closed gate has to be looked at rather than waited out.
            core.setFailed(
              result.skipped
                ? `Skipped stale fallback invalidation for ${result.headSha.slice(0, 12)} after a later reconciliation succeeded.`
                : `Closed the review gate on ${result.headSha.slice(0, 12)} after reconciliation failed.`,
            );

  merge_group:
    name: reuse exact-head review for merge group
    if: github.event_name == 'merge_group'
    needs: target
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    concurrency:
      group: automated-review-${{ needs.target.outputs.key }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reuse the source pull request review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_HEAD_SHA: ${{ needs.target.outputs.key }}
          PULL_NUMBER: ${{ needs.target.outputs.pull_number }}
        with:
          retries: 3
          script: |
            let parseMergeQueuePullNumber;
            let publishMergeGroupReviewStatus;
            try {
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: "scripts/ci/automated-review-gate.mjs",
                ref: context.payload.repository.default_branch,
              });
              const file = response.data;
              if (
                Array.isArray(file) || file?.type !== "file" ||
                file?.encoding !== "base64" ||
                typeof file?.content !== "string"
              ) throw new Error("Trusted review gate content is malformed");
              const gateUrl = `data:text/javascript;base64,${
                Buffer.from(file.content, "base64").toString("base64")
              }`;
              ({
                parseMergeQueuePullNumber,
                publishMergeGroupReviewStatus,
              } = await import(gateUrl));
            } catch (error) {
              core.setFailed(`Could not load the review gate: ${error}`);
              return;
            }
            const queueEntry = parseMergeQueuePullNumber(
              context.payload.merge_group.head_ref,
            );
            if (!queueEntry) {
              core.setFailed("Could not resolve the merge queue pull request");
              return;
            }
            const pullNumber = Number(process.env.PULL_NUMBER);
            const sourceHeadSha = process.env.SOURCE_HEAD_SHA;
            if (
              !Number.isSafeInteger(pullNumber) ||
              pullNumber !== queueEntry.pullNumber ||
              sourceHeadSha !== queueEntry.sourceHeadSha
            ) {
              core.setFailed("Merge queue source does not match its serialized lock");
              return;
            }
            const result = await publishMergeGroupReviewStatus({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              pullNumber,
              sourceHeadSha,
              mergeGroupSha: context.payload.merge_group.head_sha,
            });
            if (result.state === "success") {
              core.notice(
                `Reused PR #${pullNumber} review for ${context.payload.merge_group.head_sha.slice(0, 12)}.`,
              );
            } else {
              core.setFailed(result.failure.message);
            }
