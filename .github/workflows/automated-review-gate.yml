name: Automated review gate

on:
  pull_request_target:
    types: [
      opened,
      synchronize,
      reopened,
      ready_for_review,
      converted_to_draft,
      edited,
    ]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Automated review wakeup]
    types: [completed]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "*/10 * * * *"

permissions: {}

jobs:
  timeout_targets:
    name: find timed-out automated reviews
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.discover.outputs.result }}
    steps:
      - name: Discover expired review statuses
        id: discover
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          result-encoding: string
          script: |
            const response = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "scripts/ci/automated-review-gate.mjs",
              ref: context.payload.repository.default_branch,
            });
            const file = response.data;
            if (
              Array.isArray(file) || file?.type !== "file" ||
              file?.encoding !== "base64" ||
              typeof file?.content !== "string"
            ) throw new Error("Trusted review gate content is malformed");
            const gateUrl = `data:text/javascript;base64,${
              Buffer.from(file.content, "base64").toString("base64")
            }`;
            const {
              AUTOMATED_REVIEW_TIMEOUT_MS,
              findTimedOutAutomatedReviews,
            } = await import(gateUrl);
            const targets = await findTimedOutAutomatedReviews({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              now: Date.now(),
              reviewTimeoutMs: AUTOMATED_REVIEW_TIMEOUT_MS,
            });
            core.notice(`Found ${targets.length} timed-out automated review(s).`);
            return JSON.stringify(targets);

  timeout:
    name: fail timed-out automated review
    needs: timeout_targets
    if: needs.timeout_targets.outputs.targets != '[]'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target: ${{ fromJSON(needs.timeout_targets.outputs.targets) }}
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    concurrency:
      group: automated-review-pr-${{ matrix.target.pullNumber }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the expired review status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PULL_NUMBER: ${{ matrix.target.pullNumber }}
          HEAD_SHA: ${{ matrix.target.headSha }}
        with:
          retries: 3
          script: |
            const response = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "scripts/ci/automated-review-gate.mjs",
              ref: context.payload.repository.default_branch,
            });
            const file = response.data;
            if (
              Array.isArray(file) || file?.type !== "file" ||
              file?.encoding !== "base64" ||
              typeof file?.content !== "string"
            ) throw new Error("Trusted review gate content is malformed");
            const gateUrl = `data:text/javascript;base64,${
              Buffer.from(file.content, "base64").toString("base64")
            }`;
            const {
              AUTOMATED_REVIEW_TIMEOUT_MS,
              expireTimedOutAutomatedReview,
            } = await import(gateUrl);
            const result = await expireTimedOutAutomatedReview({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              pullNumber: Number(process.env.PULL_NUMBER),
              headSha: process.env.HEAD_SHA,
              now: Date.now(),
              reviewTimeoutMs: AUTOMATED_REVIEW_TIMEOUT_MS,
            });
            core.notice(
              result.expired
                ? `Failed timed-out review for PR #${process.env.PULL_NUMBER}.`
                : `Skipped PR #${process.env.PULL_NUMBER}: ${result.reason}.`,
            );

  target:
    name: resolve automated review target
    # Apply publisher eligibility before allocating a resolver runner. The
    # resolver also gives source and merge-group publishers the same per-pull
    # concurrency key while keeping the immutable source SHA separate.
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name == 'merge_group' ||
       ((github.event_name != 'issue_comment' ||
         (github.event.issue.pull_request &&
          github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
          github.event.comment.user.id == 199175422 &&
          github.event.comment.user.type == 'Bot')) &&
        (github.event_name != 'workflow_run' ||
         (github.event.workflow_run.event == 'pull_request_review' &&
          endsWith(github.event.workflow_run.display_title, '-eligible')))))
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      key: ${{ steps.resolve.outputs.key }}
      head_sha: ${{ steps.resolve.outputs.head-sha }}
      pull_number: ${{ steps.resolve.outputs.pull-number }}
      status_id: ${{ steps.resolve.outputs.status-id }}
      merge_group_status_id: ${{ steps.resolve.outputs.merge-group-status-id }}
    steps:
      - name: Resolve the current head commit
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          result-encoding: string
          script: |
            const fullSha = /^[0-9a-f]{40}$/i;
            const parseMergeQueuePullNumber = (headRef) => {
              if (typeof headRef !== "string") return undefined;
              const match = /^(?:refs\/heads\/)?gh-readonly-queue\/.+\/pr-([1-9]\d*)-([0-9a-f]{40})$/i.exec(headRef);
              const pullNumber = match ? Number(match[1]) : undefined;
              return Number.isSafeInteger(pullNumber)
                ? { pullNumber, baseHeadSha: match[2].toLowerCase() }
                : undefined;
            };
            const parseReviewWakeupIdentity = (run) => {
              const path = typeof run?.path === "string" ? run.path : "";
              const trustedPath = path === ".github/workflows/automated-review-wakeup.yml" ||
                path.startsWith(".github/workflows/automated-review-wakeup.yml@");
              const title = typeof run?.display_title === "string"
                ? run.display_title
                : "";
              const match = /^automated-review-wakeup-pr-([1-9]\d*)-eligible$/.exec(title);
              const pullNumber = match ? Number(match[1]) : undefined;
              const headRepositoryId = run?.head_repository?.id;
              if (
                !trustedPath || run?.event !== "pull_request_review" ||
                !Number.isSafeInteger(run?.id) || run.id < 1 ||
                !Number.isSafeInteger(pullNumber) ||
                !Number.isSafeInteger(headRepositoryId) || headRepositoryId < 1 ||
                typeof run?.head_branch !== "string" || run.head_branch.length === 0 ||
                typeof run?.head_sha !== "string" || !fullSha.test(run.head_sha)
              ) return undefined;
              return {
                pullNumber,
                headBranch: run.head_branch,
                headRepositoryId,
              };
            };
            const workflowRun = context.payload.workflow_run;
            let wakeupSignal;
            if (context.eventName === "workflow_run") {
              wakeupSignal = parseReviewWakeupIdentity(workflowRun);
              if (!wakeupSignal) {
                core.setFailed("Could not validate the review wakeup run");
                core.setOutput("key", `run-${context.runId}`);
                return;
              }
            }
            let queueEntry;
            if (context.eventName === "merge_group") {
              queueEntry = parseMergeQueuePullNumber(
                context.payload.merge_group?.head_ref,
              );
              if (!queueEntry) {
                core.setFailed("Could not resolve the merge queue source");
                core.setOutput("key", `run-${context.runId}`);
                return;
              }
              // Publish the per-pull lock as soon as the serialized queue ref
              // is trustworthy. Later resolver failures must serialize their
              // emergency status with the normal merge-group publisher.
              core.setOutput("key", `pr-${queueEntry.pullNumber}`);
              const mergeGroupSha = context.payload.merge_group?.head_sha;
              if (typeof mergeGroupSha !== "string" || !fullSha.test(mergeGroupSha)) {
                core.setFailed("Could not resolve a valid merge group commit");
                return;
              }
              let mergeGroupStatusId = 0;
              let mergeGroupStatusFound = false;
              try {
                for (let page = 1; page <= 5; page += 1) {
                  const response = await github.rest.repos.listCommitStatusesForRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: mergeGroupSha,
                    per_page: 100,
                    page,
                  });
                  if (!Array.isArray(response.data)) {
                    throw new Error("Merge group status history is malformed");
                  }
                  for (const status of response.data) {
                    if (status?.context !== "Automated review") continue;
                    if (!Number.isSafeInteger(status?.id) || status.id < 1) {
                      throw new Error("Merge group status identity is malformed");
                    }
                    mergeGroupStatusId = status.id;
                    mergeGroupStatusFound = true;
                    break;
                  }
                  if (mergeGroupStatusFound || response.data.length < 100) break;
                  if (page === 5) {
                    throw new Error("Merge group status history exceeded 500 items");
                  }
                }
                core.setOutput(
                  "merge-group-status-id",
                  String(mergeGroupStatusId),
                );
              } catch (error) {
                core.setFailed(`Could not capture the merge group status boundary: ${error}`);
                return;
              }
              const baseSha = context.payload.merge_group?.base_sha;
              if (
                typeof baseSha !== "string" || !fullSha.test(baseSha) ||
                queueEntry.baseHeadSha !== baseSha.toLowerCase()
              ) {
                core.setFailed("Merge queue base does not match its serialized lock");
                return;
              }
            }
            const pullNumber = queueEntry?.pullNumber ??
              context.payload.pull_request?.number ??
              (context.payload.issue?.pull_request
                ? context.payload.issue.number
                : wakeupSignal?.pullNumber);
            if (!Number.isSafeInteger(pullNumber) || pullNumber < 1) {
              core.setFailed("Could not resolve a valid pull request number");
              if (!queueEntry) core.setOutput("key", `run-${context.runId}`);
              return;
            }
            let headSha;
            try {
              const response = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `pull/${pullNumber}/head`,
              });
              headSha = response.data?.object?.sha;
            } catch (error) {
              try {
                const fallbackResponse = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullNumber,
                });
                const fallbackHead = fallbackResponse.data?.head?.sha;
                if (typeof fallbackHead === "string" && fullSha.test(fallbackHead)) {
                  headSha = fallbackHead;
                }
              } catch (fallbackError) {
                core.error(
                  `Could not resolve a failure target from the pull request: ${fallbackError}`,
                );
              }
              const eventFailureHead =
                context.payload.pull_request?.number === pullNumber
                  ? context.payload.pull_request?.head?.sha
                  : undefined;
              if (!headSha && fullSha.test(eventFailureHead ?? "")) {
                headSha = eventFailureHead;
              }
              core.setFailed(`Could not resolve the pull request head ref: ${error}`);
            }
            if (!fullSha.test(headSha ?? "")) {
              core.setFailed("Could not resolve a valid review target commit");
              if (!queueEntry) core.setOutput("key", `run-${context.runId}`);
              return;
            }
            headSha = headSha.toLowerCase();
            core.setOutput("key", `pr-${pullNumber}`);
            core.setOutput("head-sha", headSha);
            core.setOutput("pull-number", String(pullNumber));
            if (wakeupSignal) {
              let pullRequest;
              try {
                const response = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullNumber,
                });
                pullRequest = response.data;
              } catch (error) {
                core.setFailed(`Could not validate the review wakeup: ${error}`);
                return;
              }
              if (
                pullRequest?.number !== wakeupSignal.pullNumber ||
                pullRequest?.state !== "open" ||
                pullRequest?.head?.ref !== wakeupSignal.headBranch ||
                pullRequest?.head?.sha?.toLowerCase() !== headSha ||
                pullRequest?.head?.repo?.id !== wakeupSignal.headRepositoryId ||
                pullRequest?.base?.repo?.id !== context.payload.repository?.id ||
                typeof pullRequest?.base?.ref !== "string" ||
                pullRequest.base.ref.length === 0 ||
                pullRequest.base.ref.length > 1024 ||
                pullRequest.base.ref.includes("\0")
              ) {
                core.setFailed(
                  "Review wakeup metadata does not match the pull request",
                );
                return;
              }
            }
            let statusId = 0;
            let statusFound = false;
            try {
              for (let page = 1; page <= 5; page += 1) {
                const response = await github.rest.repos.listCommitStatusesForRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: headSha,
                  per_page: 100,
                  page,
                });
                if (!Array.isArray(response.data)) {
                  throw new Error("Review status history is malformed");
                }
                for (const status of response.data) {
                  if (
                    status?.context !== "Automated review" ||
                    typeof status?.description !== "string" ||
                    !status.description.startsWith(`PR#${pullNumber} `) ||
                    status?.creator?.login !== "github-actions[bot]" ||
                    status?.creator?.id !== 41898282 ||
                    status?.creator?.type !== "Bot"
                  ) continue;
                  if (!Number.isSafeInteger(status?.id) || status.id < 1) {
                    throw new Error("Review status identity is malformed");
                  }
                  statusId = status.id;
                  statusFound = true;
                  break;
                }
                if (statusFound || response.data.length < 100) break;
                if (page === 5) {
                  throw new Error("Review status history exceeded 500 items");
                }
              }
              core.setOutput("status-id", String(statusId));
            } catch (error) {
              core.setFailed(`Could not capture the review status boundary: ${error}`);
              return;
            }
            if (
              context.eventName === "workflow_run" &&
              workflowRun?.conclusion !== "success"
            ) {
              core.setFailed("The review wakeup did not complete successfully");
            }

  merge_group_target_failure:
    name: close unresolved merge group review gate
    needs: [target, merge_group]
    if: >-
      always() &&
      github.event_name == 'merge_group' &&
      (needs.target.result != 'success' ||
       needs.merge_group.result != 'success')
    permissions:
      contents: read
      statuses: write
    env:
      TARGET_RESULT: ${{ needs.target.result }}
      TARGET_STATUS_ID: ${{ needs.target.outputs.merge_group_status_id }}
      PUBLISHER_STATUS_ID: ${{ needs.merge_group.outputs.status_id }}
    concurrency:
      # Parsed merge-group runs share the normal per-pull lock. The raw-ref
      # fallback only applies when target resolution could not parse the ref.
      group: automated-review-${{ needs.target.outputs.key || format('merge-group-{0}', github.event.merge_group.head_ref) }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish the resolver failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const mergeGroupSha = context.payload.merge_group?.head_sha;
            if (!/^[0-9a-f]{40}$/i.test(mergeGroupSha ?? "")) {
              core.setFailed("Could not resolve the merge group failure target");
              return;
            }
            const headRef = context.payload.merge_group?.head_ref;
            const pullMatch = typeof headRef === "string"
              ? /^(?:refs\/heads\/)?gh-readonly-queue\/.+\/pr-([1-9]\d*)-[0-9a-f]{40}$/i.exec(headRef)
              : undefined;
            const pullNumber = pullMatch ? Number(pullMatch[1]) : undefined;
            const parseStatusId = (value) => {
              if (typeof value !== "string" || value === "") return undefined;
              const statusId = Number(value);
              return Number.isSafeInteger(statusId) && statusId >= 0
                ? statusId
                : undefined;
            };
            let selectMergeGroupFailureStatusBoundary = ({
              targetResult,
              targetStatusId,
              publisherStatusId,
            }) => {
              const statusId = targetResult === "success" &&
                  publisherStatusId !== undefined
                ? publisherStatusId
                : targetStatusId;
              return Number.isSafeInteger(statusId) && statusId >= 0
                ? statusId
                : undefined;
            };
            let shouldPreserveLaterMergeGroupSuccess = ({
              latestStatus,
              reconciliationStatusId,
              pullNumber,
            }) =>
              Number.isSafeInteger(reconciliationStatusId) &&
              reconciliationStatusId >= 0 &&
              Number.isSafeInteger(pullNumber) && pullNumber >= 1 &&
              Number.isSafeInteger(latestStatus?.id) &&
              latestStatus.id !== reconciliationStatusId &&
              latestStatus?.context === "Automated review" &&
              latestStatus?.state === "success" &&
              latestStatus?.creator?.login === "github-actions[bot]" &&
              latestStatus?.creator?.id === 41898282 &&
              latestStatus?.creator?.type === "Bot" &&
              latestStatus?.description ===
                `Reused exact-head review for PR #${pullNumber}`;
            try {
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: "scripts/ci/automated-review-gate.mjs",
                ref: context.payload.repository.default_branch,
              });
              const file = response.data;
              if (
                Array.isArray(file) || file?.type !== "file" ||
                file?.encoding !== "base64" ||
                typeof file?.content !== "string"
              ) throw new Error("Trusted review gate content is malformed");
              const gateUrl = `data:text/javascript;base64,${
                Buffer.from(file.content, "base64").toString("base64")
              }`;
              const gate = await import(gateUrl);
              if (
                typeof gate.selectMergeGroupFailureStatusBoundary !== "function" ||
                typeof gate.shouldPreserveLaterMergeGroupSuccess !== "function"
              ) {
                throw new Error("Trusted review boundary helper is unavailable");
              }
              selectMergeGroupFailureStatusBoundary =
                gate.selectMergeGroupFailureStatusBoundary;
              shouldPreserveLaterMergeGroupSuccess =
                gate.shouldPreserveLaterMergeGroupSuccess;
            } catch (error) {
              // This job must still close the gate when the trusted helper is
              // the component that failed. Keep an independent pinned check.
              core.warning(`Using the independent boundary check: ${error}`);
            }
            const reconciliationStatusId = selectMergeGroupFailureStatusBoundary({
              targetResult: process.env.TARGET_RESULT,
              targetStatusId: parseStatusId(process.env.TARGET_STATUS_ID),
              publisherStatusId: parseStatusId(process.env.PUBLISHER_STATUS_ID),
            });
            if (reconciliationStatusId === undefined) {
              core.warning("The merge group status boundary is unavailable");
            }
            let latestStatus;
            try {
              for (let page = 1; page <= 5; page += 1) {
                const response = await github.rest.repos.listCommitStatusesForRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: mergeGroupSha,
                  per_page: 100,
                  page,
                });
                if (!Array.isArray(response.data)) {
                  throw new Error("Merge group status history is malformed");
                }
                latestStatus = response.data.find((status) =>
                  status?.context === "Automated review"
                );
                if (latestStatus || response.data.length < 100) break;
                if (page === 5) {
                  throw new Error("Merge group status history exceeded 500 items");
                }
              }
            } catch (error) {
              // If the optional stale-run check is unavailable, closing the
              // required status remains the fail-closed result.
              core.warning(`Could not check for a later merge group publisher: ${error}`);
            }
            if (shouldPreserveLaterMergeGroupSuccess({
              latestStatus,
              reconciliationStatusId,
              pullNumber,
            })) {
              core.notice(
                `Preserved merge group success ${latestStatus.id} published after boundary ${reconciliationStatusId}.`,
              );
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: mergeGroupSha,
              state: "failure",
              context: "Automated review",
              description: "Merge queue review resolver is unavailable",
            });
            core.setFailed("Closed the merge group gate after target resolution failed");

  review:
    name: publish automated review status
    # Issues and PR write let this job post the fixed "@codex review" request
    # after verifying the current head. This job loads gate code through the
    # API from the trusted default branch and never executes pull request files.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    # issue_comment fires for issues too, so keep only pull request comments.
    # Fork pull_request_review events have read-only tokens. The unprivileged
    # wakeup workflow observes them, then workflow_run invokes this trusted
    # default-branch reconciler with write permission. Eligibility comes from
    # the resolver dependency above. This job never reads wakeup artifacts or
    # executes pull request code.
    needs: target
    if: github.event_name != 'merge_group'
    outputs:
      force_invalidate: ${{ steps.publish.outputs.force-invalidate }}
      source_status_id: ${{ steps.publish.outputs.source-status-id }}
    concurrency:
      # Every event for one pull request must serialize across force-pushes so
      # an old-head failure cannot close the current merge-group gate.
      group: automated-review-${{ needs.target.outputs.key }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require an automated review for the current commit
        id: publish
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_SHA: ${{ needs.target.outputs.head_sha }}
          PULL_NUMBER: ${{ needs.target.outputs.pull_number }}
        with:
          retries: 3
          result-encoding: string
          script: |
            const pullNumber = Number(process.env.PULL_NUMBER);
            if (!Number.isSafeInteger(pullNumber) || pullNumber < 1) {
              core.setFailed("The resolved pull request number is invalid");
              return "failure";
            }
            const headSha = process.env.TARGET_SHA;
            if (!/^[0-9a-f]{40}$/i.test(headSha ?? "")) {
              core.setFailed("The resolved review target commit is invalid");
              return "failure";
            }
            let publishAutomatedReviewStatus;
            let publishReviewResolutionFailure;
            let completeReviewFailurePropagation;
            let reconcileActiveMergeGroupReviewStatuses;
            try {
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: "scripts/ci/automated-review-gate.mjs",
                ref: context.payload.repository.default_branch,
              });
              const file = response.data;
              if (
                Array.isArray(file) || file?.type !== "file" ||
                file?.encoding !== "base64" ||
                typeof file?.content !== "string"
              ) throw new Error("Trusted review gate content is malformed");
              const gateUrl = `data:text/javascript;base64,${
                Buffer.from(file.content, "base64").toString("base64")
              }`;
              ({
                publishAutomatedReviewStatus,
                publishReviewResolutionFailure,
                completeReviewFailurePropagation,
                reconcileActiveMergeGroupReviewStatuses,
              } = await import(gateUrl));
            } catch (error) {
              // A missing or broken gate must show up as a red status, not as
              // an absent one. Absent is what a skipped review already looks
              // like, and telling those apart is the point of this workflow.
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: headSha,
                state: "failure",
                context: "Automated review",
                description:
                  "Review gate is unavailable on the default branch",
                target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${pullNumber}`,
              });
              core.setFailed(`Could not load the review gate: ${error}`);
              return;
            }
            const result = await publishAutomatedReviewStatus({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              pullNumber,
              headSha,
              pullUrl: `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${pullNumber}`,
              reviewResetKey:
                context.eventName === "pull_request_target"
                    ? context.payload.action === "edited" &&
                      context.payload.changes?.base !== undefined
                    ? "base"
                    : context.payload.action === "reopened"
                    ? "reopen"
                    : undefined
                  : undefined,
              reviewFailureCommentId:
                context.eventName === "issue_comment" &&
                  context.payload.action !== "deleted"
                  ? context.payload.comment?.id
                  : undefined,
              queuePropagationPending: true,
            });
            if (Number.isSafeInteger(result.statusId)) {
              core.setOutput("source-status-id", String(result.statusId));
            }
            if (
              result.state === "success" &&
              (!Number.isSafeInteger(result.statusId) || result.statusId < 1)
            ) {
              core.setFailed(
                "Automated review success did not return a source status identity.",
              );
              return "failure";
            }
            const forceInvalidateCurrentSource = () => {
              if (!Number.isSafeInteger(result.statusId) || result.statusId < 1) {
                core.setFailed(
                  "Cannot force invalidation without the source status identity.",
                );
                return false;
              }
              core.setOutput("force-invalidate", "true");
              return true;
            };
            let queueResultCount;
            if (result.state === "failure") {
              let completed;
              try {
                completed = await completeReviewFailurePropagation({
                  github,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pullNumber,
                  headSha,
                  sourceStatusId: result.statusId,
                  description: result.description,
                  targetUrl: result.targetUrl,
                });
              } catch (error) {
                if (!forceInvalidateCurrentSource()) return "failure";
                throw error;
              }
              queueResultCount = completed.resolution.queueFailures;
            } else if (typeof result.baseRef !== "string") {
              const { queueFailures } = await publishReviewResolutionFailure({
                github,
                owner: context.repo.owner,
                repo: context.repo.repo,
                pullNumber,
                sourceHeadSha: headSha,
                sourceStatusId: result.statusId,
              });
              queueResultCount = queueFailures;
            } else {
              let queueResults;
              try {
                queueResults = await reconcileActiveMergeGroupReviewStatuses({
                  github,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pullNumber,
                  sourceHeadSha: headSha,
                  baseRef: result.baseRef,
                });
              } catch (error) {
                // The source success above belongs to this failed run. Tell
                // fallback invalidation not to treat it as a later repair.
                if (!forceInvalidateCurrentSource()) return "failure";
                throw error;
              }
              // A failure that never reached its synthetic commit leaves the
              // queue's prior success as live review proof. The trusted gate
              // throws on that, but the loaded module comes from the default
              // branch, so verify the collected results here as well and fail
              // the run: the fallback invalidation job keys on this failure.
              const unreplaced = queueResults.filter((entry) =>
                entry?.state === "failure" && entry?.published !== true
              ).length;
              if (unreplaced > 0) {
                if (!forceInvalidateCurrentSource()) return "failure";
                core.setFailed(
                  `Review proof was not replaced on ${unreplaced} active merge queue commit(s).`,
                );
                return "failure";
              }
              queueResultCount = queueResults.length;
            }
            if (queueResultCount > 0) {
              core.notice(
                `Reconciled ${queueResultCount} active merge queue review status.`,
              );
            }
            if (result.state === "pending") {
              core.notice(`${result.description}.`);
            } else if (result.review) {
              core.notice(
                `Automated review submitted by ${result.review.reviewer} for ${headSha.slice(0, 12)}.`,
              );
            } else {
              core.warning(result.failure.message);
            }
            return result.state;
      # A pending status on a trusted push event means no review exists for
      # this head yet, and nothing would request one: the Codex connector
      # handles open and ready-for-review events, but not a push to an open
      # pull request. Post the "@codex review" request for synchronize and
      # reopened events.
      # The helper re-fetches the PR immediately before posting so a queued
      # stale event cannot bind its marker to a request for a newer head. A
      # base edit gets a marker scoped to the run, which invalidates
      # proof issued for an earlier base without coupling normal reviews to a
      # moving base commit. A rerun keeps the same marker, so it re-evaluates
      # evidence after the original reset instead of creating another epoch
      # that would erase a successful review submitted in the meantime.
      - name: Request an automated review of the current commit
        if: >-
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.draft == false &&
          (github.event.action == 'synchronize' ||
           github.event.action == 'reopened' ||
           (github.event.action == 'edited' && github.event.changes.base)) &&
          steps.publish.outputs.result == 'pending'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_SHA: ${{ needs.target.outputs.head_sha }}
        with:
          retries: 3
          script: |
            const response = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "scripts/ci/automated-review-gate.mjs",
              ref: context.payload.repository.default_branch,
            });
            const file = response.data;
            if (
              Array.isArray(file) || file?.type !== "file" ||
              file?.encoding !== "base64" ||
              typeof file?.content !== "string"
            ) throw new Error("Trusted review gate content is malformed");
            const gateUrl = `data:text/javascript;base64,${
              Buffer.from(file.content, "base64").toString("base64")
            }`;
            const { requestAutomatedReview } = await import(gateUrl);
            const pullRequest = context.payload.pull_request;
            const result = await requestAutomatedReview({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              pullNumber: pullRequest.number,
              headSha: process.env.TARGET_SHA,
              requestKey: context.payload.action === "edited"
                ? "base"
                : context.payload.action === "reopened"
                ? "reopen"
                : undefined,
            });
            core.notice(
              result.requested
                ? `Requested an automated review of ${process.env.TARGET_SHA.slice(0, 12)}.`
                : result.reason === "stale-head"
                ? "Skipped an automated review request from a stale synchronize event."
                : result.reason === "ineligible-pull"
                ? "Skipped an automated review request because the pull request is no longer open and ready for review."
                : result.reason === "stale-epoch"
                ? "Skipped an automated review request from a superseded review epoch."
                : "An automated review request for this head commit already exists.",
            );

  invalidate:
    name: invalidate unverified review proof
    # A reconciliation event is consumed by the run that observes it. If the
    # resolver or the publisher cannot complete, the previous success stays on
    # the head and a later merge group reuses it, so a finding, a deleted
    # verdict, or a dismissed approval is silently lost. A new head has no
    # status of its own. Lifecycle resets need this fallback because the source
    # SHA is unchanged and prior success can otherwise remain current.
    needs: [target, review]
    if: >-
      failure() &&
      (github.event_name == 'issue_comment' ||
       github.event_name == 'workflow_run' ||
       (github.event_name == 'pull_request_target' &&
        (github.event.action == 'reopened' ||
         github.event.action == 'ready_for_review' ||
         (github.event.action == 'edited' &&
          github.event.changes.base))))
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      TARGET_SHA: ${{ needs.target.outputs.head_sha }}
      PULL_NUMBER: ${{ needs.target.outputs.pull_number }}
      RECONCILIATION_STATUS_ID: ${{ needs.target.outputs.status_id }}
      SOURCE_STATUS_ID: ${{ needs.review.outputs.source_status_id }}
      FORCE_INVALIDATE: ${{ needs.review.outputs.force_invalidate }}
    concurrency:
      # Share the per-pull publisher lock so fallback failures cannot race
      # successful source or merge-group status writes across force-pushes.
      group: automated-review-${{ needs.target.outputs.key }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close the gate on the unreconciled head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const fullSha = /^[0-9a-f]{40}$/i;
            const pullNumber = Number(process.env.PULL_NUMBER);
            const headSha = process.env.TARGET_SHA;
            const forceInvalidateText = process.env.FORCE_INVALIDATE ?? "";
            if (forceInvalidateText !== "" && forceInvalidateText !== "true") {
              core.setFailed("The forced invalidation signal is malformed");
              return;
            }
            const forceInvalidate = forceInvalidateText === "true";
            const statusIdText = forceInvalidate
              ? process.env.SOURCE_STATUS_ID ?? ""
              : process.env.RECONCILIATION_STATUS_ID ?? "";
            const reconciliationStatusId = statusIdText === ""
              ? undefined
              : Number(statusIdText);
            if (!Number.isSafeInteger(pullNumber) || pullNumber < 1) {
              core.setFailed(
                "Could not resolve the pull request whose review proof is unverified",
              );
              return;
            }
            if (!fullSha.test(headSha ?? "")) {
              core.setFailed("Could not resolve the head whose review proof is unverified");
              return;
            }
            if (
              reconciliationStatusId !== undefined &&
              (!Number.isSafeInteger(reconciliationStatusId) ||
                reconciliationStatusId < 0)
            ) {
              core.setFailed("The review status boundary is invalid");
              return;
            }
            const parseMergeQueuePullNumber = (headRef) => {
              if (typeof headRef !== "string") return undefined;
              const match = /^(?:refs\/heads\/)?gh-readonly-queue\/.+\/pr-([1-9]\d*)-([0-9a-f]{40})$/i.exec(headRef);
              const number = match ? Number(match[1]) : undefined;
              return Number.isSafeInteger(number)
                ? { pullNumber: number, baseHeadSha: match[2].toLowerCase() }
                : undefined;
            };
            const collectAll = async (endpoint, parameters, source) => {
              const items = [];
              for await (
                const response of github.paginate.iterator(endpoint, {
                  ...parameters,
                  per_page: 100,
                })
              ) {
                if (!Array.isArray(response?.data)) {
                  throw new Error(`${source} pagination returned malformed data`);
                }
                items.push(...response.data);
                if (items.length > 500) {
                  throw new Error(`${source} exceeded 500 items`);
                }
              }
              return items;
            };
            const resolveQueueRefTarget = async (ref) => {
              let response;
              try {
                response = await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref,
                });
              } catch (error) {
                if (error?.status === 404) return undefined;
                throw error;
              }
              const sha = response?.data?.object?.sha;
              if (!fullSha.test(sha ?? "")) {
                throw new Error("Merge queue ref response has a malformed commit");
              }
              return sha;
            };
            const publishIndependentFailure = async () => {
              const pull = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
              });
              const pullHeadSha = pull.data?.head?.sha;
              if (!fullSha.test(pullHeadSha ?? "")) {
                throw new Error("Pull request head response has a malformed commit");
              }
              if (pullHeadSha.toLowerCase() !== headSha.toLowerCase()) {
                return { headSha, queueFailures: 0, skipped: true };
              }
              const baseRepositoryId = pull.data?.base?.repo?.id;
              const baseRef = pull.data?.base?.ref;
              if (
                !Number.isSafeInteger(baseRepositoryId) || baseRepositoryId < 1 ||
                typeof baseRef !== "string" || baseRef.length === 0 ||
                baseRef.length > 1024 || baseRef.includes("\0")
              ) throw new Error("Pull request base is malformed");
              if (reconciliationStatusId !== undefined) {
                const { createHash } = require("node:crypto");
                const baseBinding = createHash("sha256")
                  .update(`${baseRepositoryId}\0${baseRef}`)
                  .digest("hex");
                const statuses = await collectAll(
                  github.rest.repos.listCommitStatusesForRef,
                  { owner: context.repo.owner, repo: context.repo.repo, ref: headSha },
                  "review statuses",
                );
                const latest = statuses.find((status) =>
                  status?.context === "Automated review" &&
                  typeof status?.description === "string" &&
                  status.description.startsWith(`PR#${pullNumber} `)
                );
                const successPrefix = `PR#${pullNumber} base:${baseBinding} by:`;
                const reviewer = latest?.description?.startsWith(successPrefix)
                  ? latest.description.slice(successPrefix.length)
                  : "";
                const trustedReviewer =
                  reviewer === "chatgpt-codex-connector[bot]" ||
                  /^[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})$/.test(reviewer);
                if (
                  Number.isSafeInteger(latest?.id) &&
                  latest.id !== reconciliationStatusId &&
                  latest?.state === "success" &&
                  latest?.creator?.login === "github-actions[bot]" &&
                  latest?.creator?.id === 41898282 &&
                  latest?.creator?.type === "Bot" &&
                  trustedReviewer
                ) return { headSha, queueFailures: 0, skipped: true };
              }
              const pullUrl = typeof pull.data?.html_url === "string"
                ? pull.data.html_url
                : `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${pullNumber}`;
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: headSha,
                state: "failure",
                context: "Automated review",
                description: `PR#${pullNumber} review status unavailable`,
                target_url: pullUrl,
              });
              const refs = await collectAll(
                github.rest.git.listMatchingRefs,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: "heads/gh-readonly-queue/",
                },
                "merge queue refs",
              );
              const seen = new Set();
              for (const queueRef of refs) {
                const parsed = parseMergeQueuePullNumber(queueRef?.ref);
                if (parsed?.pullNumber !== pullNumber) continue;
                const mergeGroupSha = queueRef?.object?.sha;
                if (!fullSha.test(mergeGroupSha ?? "")) {
                  throw new Error("Merge queue ref has a malformed commit");
                }
                if (seen.has(mergeGroupSha.toLowerCase())) continue;
                const latestPull = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullNumber,
                });
                const latestHeadSha = latestPull.data?.head?.sha;
                if (!fullSha.test(latestHeadSha ?? "")) {
                  throw new Error("Pull request head response has a malformed commit");
                }
                if (
                  latestHeadSha.toLowerCase() !== headSha.toLowerCase()
                ) continue;
                let targetVerified = false;
                try {
                  const bindingResponse = await github.graphql(
                    `query ActiveMergeQueueBinding($owner: String!, $repo: String!, $number: Int!) {
                      repository(owner: $owner, name: $repo) {
                        pullRequest(number: $number) {
                          number
                          state
                          headRefOid
                          baseRefName
                          mergeQueueEntry {
                            baseCommit { oid }
                            headCommit { oid }
                          }
                        }
                      }
                    }`,
                    {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      number: pullNumber,
                    },
                  );
                  const boundPull = bindingResponse?.repository?.pullRequest;
                  const boundEntry = boundPull?.mergeQueueEntry;
                  const activeBindingMismatch =
                    boundPull?.number !== pullNumber ||
                    boundPull?.state !== "OPEN" ||
                    boundPull?.headRefOid?.toLowerCase() !== headSha.toLowerCase() ||
                    boundPull?.baseRefName !== baseRef ||
                    boundEntry?.baseCommit?.oid?.toLowerCase() !==
                      parsed.baseHeadSha ||
                    boundEntry?.headCommit?.oid?.toLowerCase() !==
                      mergeGroupSha.toLowerCase();
                  if (!activeBindingMismatch) {
                    const liveRef = await github.rest.git.getRef({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      ref: queueRef.ref.slice("refs/".length),
                    });
                    targetVerified =
                      liveRef?.data?.object?.sha?.toLowerCase() ===
                        mergeGroupSha.toLowerCase();
                  }
                } catch {
                  targetVerified = false;
                }
                if (!targetVerified) {
                  const liveTarget = await resolveQueueRefTarget(
                    queueRef.ref.slice("refs/".length),
                  );
                  targetVerified =
                    liveTarget?.toLowerCase() === mergeGroupSha.toLowerCase();
                }
                if (!targetVerified) continue;
                const finalPull = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullNumber,
                });
                const finalHeadSha = finalPull.data?.head?.sha;
                if (!fullSha.test(finalHeadSha ?? "")) {
                  throw new Error("Pull request head response has a malformed commit");
                }
                if (
                  finalHeadSha.toLowerCase() !== headSha.toLowerCase()
                ) continue;
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha: mergeGroupSha,
                  state: "failure",
                  context: "Automated review",
                  description: `Could not revalidate review for PR #${pullNumber}`,
                  target_url: pullUrl,
                });
                seen.add(mergeGroupSha.toLowerCase());
              }
              return {
                headSha,
                queueFailures: seen.size,
                skipped: false,
              };
            };
            let result;
            try {
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: "scripts/ci/automated-review-gate.mjs",
                ref: context.payload.repository.default_branch,
              });
              const file = response.data;
              if (
                Array.isArray(file) || file?.type !== "file" ||
                file?.encoding !== "base64" ||
                typeof file?.content !== "string"
              ) throw new Error("Trusted review gate content is malformed");
              const gateUrl = `data:text/javascript;base64,${
                Buffer.from(file.content, "base64").toString("base64")
              }`;
              const { invalidateReviewProof } = await import(gateUrl);
              result = await invalidateReviewProof({
                github,
                owner: context.repo.owner,
                repo: context.repo.repo,
                pullNumber,
                expectedHeadSha: headSha,
                reconciliationStatusId,
              });
            } catch (error) {
              core.warning(
                `Trusted invalidation was unavailable, using the independent failure path: ${error}`,
              );
              result = await publishIndependentFailure();
            }
            // Keep the run red: the revocation event was still dropped, and
            // the closed gate has to be looked at rather than waited out.
            core.setFailed(
              result.skipped
                ? `Skipped stale fallback invalidation for ${result.headSha.slice(0, 12)} after a later reconciliation succeeded.`
                : `Closed the review gate on ${result.headSha.slice(0, 12)} after reconciliation failed.`,
            );

  merge_group:
    name: reuse exact-head review for merge group
    if: github.event_name == 'merge_group'
    needs: target
    outputs:
      status_id: ${{ steps.reuse.outputs.merge-group-status-id }}
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    concurrency:
      group: automated-review-${{ needs.target.outputs.key }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reuse the source pull request review
        id: reuse
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_HEAD_SHA: ${{ needs.target.outputs.head_sha }}
          PULL_NUMBER: ${{ needs.target.outputs.pull_number }}
        with:
          retries: 3
          script: |
            const fullSha = /^[0-9a-f]{40}$/i;
            const mergeGroupSha = context.payload.merge_group?.head_sha;
            if (!fullSha.test(mergeGroupSha ?? "")) {
              core.setFailed("Could not resolve a valid merge group commit");
              return;
            }
            let mergeGroupStatusId = 0;
            let mergeGroupStatusFound = false;
            try {
              for (let page = 1; page <= 5; page += 1) {
                const response = await github.rest.repos.listCommitStatusesForRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: mergeGroupSha,
                  per_page: 100,
                  page,
                });
                if (!Array.isArray(response.data)) {
                  throw new Error("Merge group status history is malformed");
                }
                for (const status of response.data) {
                  if (status?.context !== "Automated review") continue;
                  if (!Number.isSafeInteger(status?.id) || status.id < 1) {
                    throw new Error("Merge group status identity is malformed");
                  }
                  mergeGroupStatusId = status.id;
                  mergeGroupStatusFound = true;
                  break;
                }
                if (mergeGroupStatusFound || response.data.length < 100) break;
                if (page === 5) {
                  throw new Error("Merge group status history exceeded 500 items");
                }
              }
              core.setOutput(
                "merge-group-status-id",
                String(mergeGroupStatusId),
              );
            } catch (error) {
              core.setFailed(`Could not capture the publisher status boundary: ${error}`);
              return;
            }
            let parseMergeQueuePullNumber;
            let publishMergeGroupReviewStatus;
            try {
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: "scripts/ci/automated-review-gate.mjs",
                ref: context.payload.repository.default_branch,
              });
              const file = response.data;
              if (
                Array.isArray(file) || file?.type !== "file" ||
                file?.encoding !== "base64" ||
                typeof file?.content !== "string"
              ) throw new Error("Trusted review gate content is malformed");
              const gateUrl = `data:text/javascript;base64,${
                Buffer.from(file.content, "base64").toString("base64")
              }`;
              ({
                parseMergeQueuePullNumber,
                publishMergeGroupReviewStatus,
              } = await import(gateUrl));
            } catch (error) {
              core.setFailed(`Could not load the review gate: ${error}`);
              return;
            }
            const queueEntry = parseMergeQueuePullNumber(
              context.payload.merge_group.head_ref,
            );
            if (!queueEntry) {
              core.setFailed("Could not resolve the merge queue pull request");
              return;
            }
            const pullNumber = Number(process.env.PULL_NUMBER);
            const sourceHeadSha = process.env.SOURCE_HEAD_SHA;
            const baseSha = context.payload.merge_group.base_sha;
            const serializedBaseSha = queueEntry.baseHeadSha;
            if (
              !Number.isSafeInteger(pullNumber) ||
              pullNumber !== queueEntry.pullNumber ||
              !fullSha.test(sourceHeadSha ?? "") ||
              !fullSha.test(baseSha ?? "") ||
              !fullSha.test(serializedBaseSha ?? "") ||
              baseSha.toLowerCase() !== serializedBaseSha
            ) {
              core.setFailed("Merge queue identity does not match its serialized lock");
              return;
            }
            const bindingResponse = await github.graphql(
              `query ActiveMergeQueueBinding($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    number
                    state
                    headRefOid
                    baseRefName
                    mergeQueueEntry {
                      baseCommit { oid }
                      headCommit { oid }
                    }
                  }
                }
              }`,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: pullNumber,
              },
            );
            const boundPull = bindingResponse?.repository?.pullRequest;
            const boundEntry = boundPull?.mergeQueueEntry;
            const baseRef = boundPull?.baseRefName;
            const eventRef = context.payload.merge_group.head_ref;
            const normalizedEventRef = typeof eventRef === "string" &&
                eventRef.startsWith("refs/heads/")
              ? eventRef
              : `refs/heads/${eventRef}`;
            const expectedRef = typeof baseRef === "string"
              ? `refs/heads/gh-readonly-queue/${baseRef}/pr-${pullNumber}-${serializedBaseSha}`
              : "";
            if (
              boundPull?.number !== pullNumber || boundPull?.state !== "OPEN" ||
              !fullSha.test(mergeGroupSha ?? "") ||
              boundPull?.headRefOid?.toLowerCase() !== sourceHeadSha ||
              boundEntry?.baseCommit?.oid?.toLowerCase() !== serializedBaseSha ||
              boundEntry?.headCommit?.oid?.toLowerCase() !== mergeGroupSha ||
              typeof baseRef !== "string" || baseRef.length === 0 ||
              baseRef.length > 1024 || baseRef.includes("\0") ||
              normalizedEventRef !== expectedRef
            ) {
              core.setFailed("Merge group is not bound to the current pull request head");
              return;
            }
            const liveRef = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: expectedRef.slice("refs/".length),
            });
            if (liveRef?.data?.object?.sha?.toLowerCase() !== mergeGroupSha) {
              core.setFailed("Merge queue ref no longer targets this merge group");
              return;
            }
            const result = await publishMergeGroupReviewStatus({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              pullNumber,
              sourceHeadSha,
              baseHeadSha: serializedBaseSha,
              mergeGroupSha,
            });
            if (result.state === "success") {
              core.notice(
                `Reused PR #${pullNumber} review for ${context.payload.merge_group.head_sha.slice(0, 12)}.`,
              );
            } else {
              core.setFailed(result.failure.message);
            }
