name: Automated review gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created, edited, deleted]
  status:

permissions:
  contents: read
  issues: read
  # pull-requests: write lets the gate post the "@codex review" comment when a
  # push leaves the head commit without a review. This workflow runs with
  # pull_request_target authority, so the write scope stays safe only because
  # the workflow checks out the trusted default branch, never executes files
  # from the pull request head, and the posted comment body is a fixed string
  # plus the verified head commit SHA with no pull request controlled content.
  pull-requests: write
  statuses: write

# One publisher at a time repo-wide, processing every event in order. `queue`
# is a workflow-level key; placing this block on the jobs made them fail before
# any step ran, which took the gate down for every pull request.
concurrency:
  group: automated-review-status-publishers
  queue: max

jobs:
  review:
    name: publish automated review status
    # issue_comment fires for issues too, so keep only pull request comments.
    # pull_request_review hands fork pull requests a read-only token that cannot
    # write a commit status, so skip it there and let the trusted
    # pull_request_target and issue_comment runs publish the decision instead.
    if: >-
      github.event_name != 'status' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (github.event_name != 'pull_request_review' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This workflow has pull_request_target authority. Check out only the
      # trusted default branch and never execute files from the PR head. The
      # base commit of an older pull request predates this gate, so reading the
      # gate from the default branch is what keeps the status computable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Require an automated review for the current commit
        id: publish
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          result-encoding: string
          script: |
            const { pathToFileURL } = require("node:url");
            const gateUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/ci/automated-review-gate.mjs`,
            ).href;
            const pullNumber = context.payload.pull_request?.number ??
              context.payload.issue.number;
            const response = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            const pullRequest = response.data;
            const sameRepository =
              `${context.repo.owner}/${context.repo.repo}`;
            const headSha = pullRequest.head.sha;
            let publishAutomatedReviewStatus;
            try {
              ({ publishAutomatedReviewStatus } = await import(gateUrl));
            } catch (error) {
              // A missing or broken gate must show up as a red status, not as
              // an absent one. Absent is what a skipped review already looks
              // like, and telling those apart is the point of this workflow.
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: headSha,
                state: "failure",
                context: "Automated review",
                description:
                  "Review gate is unavailable on the default branch",
                target_url: pullRequest.html_url,
              });
              core.setFailed(`Could not load the review gate: ${error}`);
              return;
            }
            const result = await publishAutomatedReviewStatus({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              pullNumber: pullRequest.number,
              headSha,
              pullUrl: pullRequest.html_url,
              isDraft: pullRequest.draft === true,
              // Fork review events cannot publish a status. Ignore review
              // objects for forks and accept only proof a trusted pull or
              // comment event can reconcile. This safely stays pending until
              // a trusted event observes status or comment proof.
              allowPullRequestReviews:
                pullRequest.head.repo?.full_name === sameRepository,
            });
            if (result.state === "pending") {
              core.notice(`${result.description}.`);
            } else if (result.review) {
              core.notice(
                `Automated review submitted by ${result.review.reviewer} for ${headSha.slice(0, 12)}.`,
              );
            } else {
              core.warning(result.failure.message);
            }
            return result.state;
      # A pending status on a trusted push event means no review exists for
      # this head yet, and nothing would request one: the Codex connector
      # handles open and ready-for-review events, but not a push to an open
      # pull request. Post the "@codex review" request only for synchronize.
      # The helper re-fetches the PR immediately before posting so a queued
      # stale event cannot bind its marker to a request for a newer head.
      - name: Request an automated review of the current commit
        if: >-
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.draft == false &&
          github.event.action == 'synchronize' &&
          steps.publish.outputs.result == 'pending'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const { pathToFileURL } = require("node:url");
            const gateUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/ci/automated-review-gate.mjs`,
            ).href;
            const { requestAutomatedReview } = await import(gateUrl);
            const pullRequest = context.payload.pull_request;
            const result = await requestAutomatedReview({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              pullNumber: pullRequest.number,
              headSha: pullRequest.head.sha,
            });
            core.notice(
              result.requested
                ? `Requested an automated review of ${pullRequest.head.sha.slice(0, 12)}.`
                : result.reason === "stale-head"
                ? "Skipped an automated review request from a stale synchronize event."
                : "An automated review request for this head commit already exists.",
            );

  status_review:
    name: publish completed CodeRabbit review status
    # This SHA-scoped path publishes only durable completion success. It shares
    # the status publisher queue so it cannot race general PR reconciliation.
    # The status payload carries no creator field, so pin the sender instead:
    # for a bot-created commit status the sender is the bot itself. The gate
    # helper then re-verifies the creator over the REST status history, where
    # creator does exist, before treating the wakeup as completion proof.
    if: >-
      github.event_name == 'status' &&
      github.event.context == 'CodeRabbit' &&
      github.event.state == 'success' &&
      github.event.description == 'Review completed' &&
      github.event.sender.login == 'coderabbitai[bot]' &&
      github.event.sender.id == 136622811 &&
      github.event.sender.type == 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Publish authenticated CodeRabbit completion
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const { pathToFileURL } = require("node:url");
            const gateUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/ci/automated-review-gate.mjs`,
            ).href;
            let publishCodeRabbitCompletionStatus;
            try {
              ({ publishCodeRabbitCompletionStatus } = await import(gateUrl));
            } catch (error) {
              core.setFailed(`Could not load the review gate: ${error}`);
              return;
            }
            const result = await publishCodeRabbitCompletionStatus({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              headSha: context.payload.sha,
              // The payload claim carries no creator; the helper authenticates
              // the completion against the REST status history for the head.
              status: {
                context: context.payload.context,
                state: context.payload.state,
                description: context.payload.description,
              },
            });
            if (result.state === "success") {
              core.notice(
                `Authenticated CodeRabbit completion for ${context.payload.sha.slice(0, 12)}.`,
              );
            } else if (result.failure) {
              core.warning(result.failure.message);
            }
