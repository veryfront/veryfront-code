name: Sonar retry contract

on:
  pull_request:
    paths:
      - .github/workflows/cicd.yml
      - .github/workflows/sonar-retry-contract.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/cicd.yml
      - .github/workflows/sonar-retry-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded first-attempt PR runs. Non-PR runs and manual reruns get
  # run-unique groups so a pending or newer run is never cancelled or replaced.
  # Pinned by tests/integration/ci/workflow-concurrency.test.ts; see cicd.yml and
  # veryfront-studio#5544.
  group: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('{0}-{1}', github.workflow, github.ref) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise the production retry wrapper
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import textwrap
          import time

          source = Path('.github/workflows/cicd.yml').read_text()
          name = '      - name: Scan with one Sonar server-error retry\n'
          assert name in source, 'The production Sonar scan has no bounded retry wrapper'
          step = source.split(name, 1)[1].split('\n      - ', 1)[0].split('\n\n', 1)[0]
          assert '        run: |\n' in step, 'The scan must expose its output and exit status'
          wrapper = textwrap.dedent(step.split('        run: |\n', 1)[1])
          assert 'continue-on-error:' not in step, 'The wrapper must propagate failures'

          # Stock SonarScanner output when SonarCloud stalls the report upload:
          # exit 3, no report-task.txt and no CE task or quality gate result.
          upload_timeout = '\n'.join([
              '12:27:24.900 DEBUG POST https://sonarcloud.io/api/ce/submit',
              '12:27:25.075 ERROR Error during SonarScanner Engine execution',
              'java.lang.IllegalStateException: Failed to request POST https://sonarcloud.io/api/ce/submit',
              '\tat org.sonar.scanner.http.transport.JdkHttpClient.execute(JdkHttpClient.java:151)',
              '\tat org.sonar.scanner.report.ReportPublisher.upload(ReportPublisher.java:208)',
              '\tat org.sonar.scanner.report.ReportPublisher.execute(ReportPublisher.java:146)',
              'Caused by: java.net.http.HttpTimeoutException: request timed out',
              '\tat java.net.http/jdk.internal.net.http.HttpClientImpl.send(Unknown Source)',
              '12:27:25.740 INFO  EXECUTION FAILURE',
          ])
          upload_503 = '\n'.join([
              '12:27:25.075 ERROR Error during SonarScanner Engine execution',
              'java.lang.IllegalStateException: Error status returned by url [https://sonarcloud.io/api/ce/submit]: 503',
              '\tat org.sonar.scanner.report.ReportPublisher.upload(ReportPublisher.java:208)',
              '12:27:25.740 INFO  EXECUTION FAILURE',
          ])
          upload_500 = upload_503.replace(']: 503', ']: 500')
          # The pinned action exits 1 and reports the scanner's exit status.
          def action_failed(log, scanner_status):
              return log + f"\n::error::Action failed: The process '/opt/hostedtoolcache/sonar-scanner-cli/8.1.0-build.6389/linux-x64/bin/sonar-scanner' failed with exit code {scanner_status}"
          gate_failed = 'QUALITY GATE STATUS: FAILED - coverage 0.0% < 80%'
          oom = 'java.lang.OutOfMemoryError: Java heap space\n\tat org.sonar.scanner.report.ReportPublisher.upload(ReportPublisher.java:208)\nEXECUTION FAILURE'
          cases = [
              ('success', [('analysis complete', 0)], 0, 1),
              ('initial clock tick', [('analysis complete', 0)], 0, 1),
              ('server error then success', [('CE Task finished abnormally', 3), ('analysis complete', 0)], 0, 2),
              ('server error twice', [('CE Task finished abnormally', 3), ('CE Task finished abnormally', 7)], 7, 2),
              ('server error then quality gate', [('CE Task finished abnormally', 3), ('QUALITY GATE STATUS: FAILED - coverage 0.0% < 80%', 2)], 2, 2),
              ('quality gate', [('QUALITY GATE STATUS: FAILED - coverage 0.0% < 80%', 2)], 2, 1),
              ('other failure', [('Not authorized', 4)], 4, 1),
              ('insufficient retry budget', [('CE Task finished abnormally', 3)], 3, 1),
              ('deadline after server text', [('CE Task finished abnormally', 124)], 124, 1),
              ('forced deadline after server text', [('CE Task finished abnormally', 137)], 137, 1),
              ('similar message', [('CE Task timeout', 6)], 6, 1),
              ('mixed gate and server text', [('CE Task finished abnormally; QUALITY GATE STATUS: FAILED', 2)], 2, 1),
              ('upload timeout then success', [(upload_timeout, 3), ('analysis complete', 0)], 0, 2),
              ('upload timeout twice', [(upload_timeout, 3), (upload_timeout, 3)], 3, 2),
              ('upload timeout then quality gate', [(upload_timeout, 3), (gate_failed, 2)], 2, 2),
              ('quality gate exit 3', [(upload_timeout + '\n' + gate_failed, 3)], 3, 1),
              ('quality gate status with upload text', [(upload_timeout + '\nQUALITY GATE STATUS: ERROR', 3)], 3, 1),
              ('out of memory exit 3', [(oom, 3)], 3, 1),
              ('other exit 3', [('ERROR Error during SonarScanner Engine execution\nEXECUTION FAILURE', 3)], 3, 1),
              ('upload timeout other exit', [(upload_timeout, 1)], 1, 1),
              ('upload 503 then success', [(upload_503, 3), ('analysis complete', 0)], 0, 2),
              ('upload 500', [(upload_500, 3)], 3, 1),
              ('upload timeout via action then success', [(action_failed(upload_timeout, 3), 1), ('analysis complete', 0)], 0, 2),
              ('upload timeout via action twice', [(action_failed(upload_timeout, 3), 1), (action_failed(upload_timeout, 3), 1)], 1, 2),
              ('upload 503 via action then success', [(action_failed(upload_503, 3), 1), ('analysis complete', 0)], 0, 2),
              ('quality gate via action', [(action_failed(upload_timeout + '\n' + gate_failed, 3), 1)], 1, 1),
              ('out of memory via action', [(action_failed(oom, 3), 1)], 1, 1),
              ('upload timeout via action other exit', [(action_failed(upload_timeout, 30), 1)], 1, 1),
              ('upload timeout via action exit 1', [(action_failed(upload_timeout, 1), 1)], 1, 1),
          ]
          def write_timeout(directory):
              tool = directory / 'timeout'
              tool.write_text('#!/usr/bin/env python3\nimport os, sys\n'
                  "expected = '38m' if os.environ.get('SONAR_REF_NAME') == 'main' and os.environ.get('SONAR_EVENT_NAME') != 'merge_group' else '27m'\n"
                  "assert sys.argv[1:4] == ['--signal=TERM', '--kill-after=30s', expected]\n"
                  'os.execvp(sys.argv[4], sys.argv[4:])\n')
              tool.chmod(0o755)
          for label, results, expected_status, expected_attempts in cases:
              with tempfile.TemporaryDirectory() as directory:
                  tmp = Path(directory)
                  write_timeout(tmp)
                  node = tmp / 'node'
                  node.write_text('#!/usr/bin/env python3\n' + '''import json, os, pathlib, sys
          root = pathlib.Path(os.environ['FIXTURE_ROOT'])
          count = root / 'attempts'
          attempt = int(count.read_text()) + 1 if count.exists() else 1
          count.write_text(str(attempt))
          assert sys.argv[1] == str(root / 'sonarqube-scan-action/dist/index.js')
          assert os.environ['INPUT_SKIPSIGNATUREVERIFICATION'] == 'false'
          results = json.loads(os.environ['FIXTURE_RESULTS'])
          assert attempt <= len(results), 'Unexpected extra retry'
          message, status = results[attempt - 1]
          print(message, file=sys.stderr)
          sys.exit(status)
          ''')
                  node.chmod(0o755)
                  env = {**os.environ, 'PATH': str(tmp) + os.pathsep + os.environ['PATH'],
                         'SONAR_EVENT_NAME': 'push', 'SONAR_REF_NAME': 'main', 'RUNNER_TEMP': str(tmp), 'FIXTURE_ROOT': str(tmp),
                         'FIXTURE_RESULTS': json.dumps(results), 'INPUT_SKIPSIGNATUREVERIFICATION': 'false',
                         'GITHUB_STEP_SUMMARY': str(tmp / 'summary.md')}
                  started = time.monotonic()
                  case_wrapper = wrapper
                  if label == 'initial clock tick':
                      env.update(SONAR_EVENT_NAME='pull_request', SONAR_REF_NAME='feature/test')
                      case_wrapper = wrapper.replace('for attempt in 1 2; do',
                          'for attempt in 1 2; do\n  SECONDS=$((scan_started + 1))')
                  if label == 'insufficient retry budget':
                      case_wrapper = wrapper.replace('for attempt in 1 2; do',
                          'for attempt in 1 2; do\n  if [ "$attempt" -eq 2 ]; then SECONDS=$((scan_started + 81 * 60)); fi')
                  run = subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', case_wrapper], env=env,
                                       text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=15)
                  attempts = int((tmp / 'attempts').read_text()) if (tmp / 'attempts').exists() else 0
                  assert (run.returncode, attempts) == (expected_status, expected_attempts), (label, run.returncode, attempts, run.stdout)
                  upload_retry = 'Retrying Sonar once after report upload timeout' in run.stdout
                  assert upload_retry == (label.startswith('upload') and expected_attempts == 2), (label, run.stdout)
                  summary = (tmp / 'summary.md').read_text()
                  for message, _ in results:
                      for line in message.splitlines():
                          assert (line in summary) == (' DEBUG ' not in line), (label, line, summary)
                  print(f'PASS {label}: attempts={attempts}, exit={run.returncode}, seconds={time.monotonic() - started:.3f}')
                  print(run.stdout, end='')
          # A failed log write must never trigger a retry, even if the CE signature was read.
          with tempfile.TemporaryDirectory() as directory:
              tmp = Path(directory)
              write_timeout(tmp)
              (tmp / 'node').write_text('#!/bin/sh\necho "CE Task finished abnormally" >&2\nexit 3\n')
              (tmp / 'tee').write_text('#!/bin/sh\ncat\nexit 9\n')
              for executable in ['node', 'tee']:
                  (tmp / executable).chmod(0o755)
              run = subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', wrapper],
                                   env={**os.environ, 'PATH': str(tmp) + os.pathsep + os.environ['PATH'], 'SONAR_EVENT_NAME': 'push', 'SONAR_REF_NAME': 'main', 'RUNNER_TEMP': str(tmp)},
                                   text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=15)
              assert run.returncode == 9, run.stdout
              assert 'Retrying' not in run.stdout, run.stdout
              print('PASS failed log capture: exit=9, no retry')
          PY
