name: Cancel failed merge-group run

on:
  workflow_call:

permissions:
  actions: write

jobs:
  cancel:
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Preserve always() aggregators so required gates can report failed dependencies.
      # Heavy jobs stop on cancellation through their merge-group-only guards.
      # No checkout: repository code must never execute with this write token.
      - name: Cancel the failed merge-group run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel"
