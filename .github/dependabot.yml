# .github/dependabot.yml
#
# Dependabot does not natively understand `deno.json` / `deno.lock`, and this
# repo currently has no checked-in npm `package.json` (the `npm/` workspace and
# `deno.lock` are generated artifacts and `.gitignore`d). For now, only the
# GitHub Actions ecosystem is covered here. OSV-Scanner (see
# `.github/workflows/security-audit.yml`) handles `deno.lock`. When Dependabot
# adds Deno support, or if a tracked `package.json` lands, add a corresponding
# `updates:` entry below.
version: 2

updates:
  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    # Self-pins need an atomic manual update to keep the trusted-revision test strict.
    # Select a reviewed commit on main. In one commit, update every cancellation
    # workflow uses: pin in .github/workflows/cicd.yml and
    # TRUSTED_CANCELLATION_WORKFLOW in
    # tests/integration/ci/merge-quality-gate-workflow.test.ts, then run:
    # deno task test:file tests/integration/ci/merge-quality-gate-workflow.test.ts
    ignore:
      - dependency-name: "veryfront/veryfront-code/.github/workflows/*"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
    labels:
      - "dependencies"
      - "ci"
