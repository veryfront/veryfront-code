# Exclude paths whose "secrets" are deliberate fakes from secret scanning.
#
# Test files routinely embed fake credentials (postgres://admin:s3cret@db.internal,
# basic-auth headers, vf_live_* display values) as fixtures for the redaction and
# sanitization code under test, and Storybook stories show mock credential values
# in read-only inputs. Every secret-scanning alert raised for these paths to date
# (#1-#14) was triaged as used-in-tests or false positive; editing those tests
# re-raises new alerts for the same fixtures at new line numbers.
#
# Real credentials must never be committed to these paths either — this only
# stops the recurring false-positive alerts, it is not permission to relax.
paths-ignore:
  - "**/*.test.ts"
  - "storybook/stories/**"
