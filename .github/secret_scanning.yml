# Exclude only files with recurring, detector-shaped false positives.
#
# The logger test must use realistic URL credentials to verify redaction. The
# input story shows a structurally invalid mock Veryfront key in a read-only
# field. These exact files have produced recurring false-positive alerts.
#
# Real credentials must never be committed to these paths. Keep every new or
# unrelated test and story covered by secret scanning.
paths-ignore:
  - "src/utils/logger/logger.test.ts"
  - "storybook/stories/ui/Input.stories.tsx"
