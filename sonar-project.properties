sonar.projectKey=veryfront_veryfront-code
sonar.organization=veryfront
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.exclusions=coverage-profiles/**

# The required CI `sonar` check must represent the server-side Quality Gate,
# not only successful report upload. Keep enough time for SonarCloud to process
# this repository's large analysis before the scanner reports the result.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=1200

# Test fixtures and assertions are intentionally repetitive. Keep test files
# in the analysis so their issues remain visible, but exclude them from CPD so
# the duplication gate measures production implementation duplication.
#
# templates/files/** is scaffold source, not framework source: every starter is
# copied verbatim into a generated project, so a file cannot import a shared
# module from a sibling starter. Starters that offer the same capability
# therefore ship the same file by construction - five of them scaffold the same
# app/markdown-renderer.tsx - and CPD reports that intended parity as
# duplication. The files stay in sonar.sources, so their bugs, smells, and
# security issues are still reported.
sonar.cpd.exclusions=**/*.test.*,**/*.spec.*,**/*test-helpers.*,**/*.fixture.*,**/*.mock.*,**/__fixtures__/**,**/fixtures/**,**/testing/**,tests/**,templates/files/**

sonar.javascript.lcov.reportPaths=coverage-profiles/coverage-shard-*/lcov.info
sonar.javascript.node.maxspace=8192

# Excluded from the coverage ratio only; these files are still analysed.
#
# scripts/test/coverage-ci.ts builds the lcov with --include=src/ and
# --include=cli/ only, so the other unit-suite roots (extensions/, react/,
# scripts/) have no coverage records even though their tests run. They are
# excluded here so Sonar does not report tested code as 0% covered. Widening the
# lcov instead would also move the repo's own coverage gate, so that belongs in
# its own change.
#
# Test files stay in sonar.sources rather than moving to sonar.tests, which is
# how the project was analysed before and what the existing issue markings
# assume.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.bench.ts,**/*.generated.ts,tests/**,templates/**,storybook/**,extensions/**,react/**,scripts/**
